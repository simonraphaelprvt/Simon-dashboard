<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard · Simon</title>
<!-- Google Identity Services für Gmail + Calendar OAuth -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Morning Report Slideshow -->
<link rel="stylesheet" href="morningReport.css">
<!-- Playfair Display for private screen serif typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap">
<!-- Plus Jakarta Sans + DM Sans for business screen typography -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:             #0E1016;
    --card:           #171A23;
    --card-inner:     #1F2330;
    --text-primary:   #E9EBF2;
    --text-secondary: #9AA1B5;
    --text-tertiary:  #5E6577;
    --border:         rgba(255,255,255,0.06);
    --shadow:         0 8px 24px rgba(0,0,0,0.32), 0 1px 3px rgba(0,0,0,0.25);
    --radius:         18px;
    --radius-sm:      13px;
    --accent-purple:  #8E84E8;
    --accent-green:   #5BBE8D;
    --accent-orange:  #D9A05B;
    --accent-blue:    #6BA3DC;
    --accent-red:     #E0716C;
    --grad-violet:    linear-gradient(135deg, #4A4290 0%, #6C5FBF 55%, #7E6FD0 100%);
    --grad-blue:      linear-gradient(135deg, #2E5B8F 0%, #4380B5 60%, #52A0BD 100%);
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', 'DM Sans', -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Haupt-Grid ── */
  .screen {
    width: 100vw;
    height: 100dvh;
    padding: 20px;
    display: grid;
    grid-template-rows: 96px 1fr;   /* Top-Reihe | Hauptbereich */
    gap: 12px;
    overflow: hidden;
    position: relative;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0);
    background-size: 24px 24px;
  }

  /* Hauptbereich: links Inhalt, rechts schmale Agenda-Spalte */
  .main-area {
    display: grid;
    grid-template-columns: 1fr 296px;
    gap: 12px;
    min-height: 0;
  }
  .main-left {
    display: grid;
    grid-template-rows: 1fr auto auto;  /* Revenue-Hero | KPIs | Fokus-Leiste */
    gap: 12px;
    min-height: 0;
  }
  .agenda-sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* ─────────────────────────────────────
     ROW 1: Zeit + Wetter
  ───────────────────────────────────── */
  .row-top {
    display: grid;
    grid-template-columns: 1fr 140px 148px; /* time | toggle-slot (empty) | weather */
    gap: 12px;
  }
  .card-time    { grid-column: 1; }
  .card-weather { grid-column: 3; }

  .card-time {
    padding: 14px 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .time-display {
    font-size: clamp(40px, 5.4vw, 54px);
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-date {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 5px;
    letter-spacing: -0.1px;
  }

  .card-weather {
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 2px;
  }

  .weather-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .weather-temp  { font-size: 36px; font-weight: 200; color: var(--text-primary); letter-spacing: -1.5px; line-height: 1; }
  .weather-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .weather-feel  { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .weather-city  { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  /* ─────────────────────────────────────
     ROW 2: Kalender + Pipeline
  ───────────────────────────────────── */
  .row-middle {
    display: grid;
    grid-template-columns: 1fr 298px;
    gap: 12px;
    min-height: 0;
  }

  /* Section-Header (wiederverwendbar) */
  .section-header {
    padding: 11px 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .section-badge {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  /* ── Agenda (eigener dunkler Kalender) ── */
  .card-agenda {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .agenda-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 12px;
    min-height: 0;
    scrollbar-width: none;
  }
  .agenda-body::-webkit-scrollbar { display: none; }
  .agenda-day { padding-top: 10px; }
  .agenda-day + .agenda-day { margin-top: 6px; border-top: 0.5px solid var(--border); }
  .agenda-day-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0 6px;
  }
  .agenda-day-bubble {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--card-inner);
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .agenda-day-bubble.today { background: var(--grad-violet); color: #fff; }
  .agenda-day-name {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 600;
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agenda-day-count { font-size: 10px; color: var(--text-tertiary); flex-shrink: 0; }
  .agenda-ev {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0 4px 6px;
  }
  .agenda-ev-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .agenda-ev-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .agenda-ev-title {
    font-size: 12.5px;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.25;
  }
  .agenda-ev-time {
    font-size: 10.5px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .agenda-ev.past { opacity: 0.35; }
  .agenda-free { font-size: 11.5px; color: var(--text-tertiary); padding: 0 0 6px 6px; }
  .agenda-login {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; height: 100%;
    color: var(--text-secondary); font-size: 13px;
    text-align: center; padding: 0 24px;
  }
  .agenda-login button {
    background: var(--grad-violet);
    color: #fff; border: none; border-radius: 999px;
    padding: 10px 22px;
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .agenda-login button:active { transform: scale(0.97); }
  .agenda-next {
    font-size: 11px;
    color: var(--accent-purple);
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    max-width: 50%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agenda-next-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-purple); flex-shrink: 0; }
  .agenda-next-dot.live { background: var(--accent-green); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  /* "Als Nächstes"-Chip sitzt im schmalen Sidebar-Header unter dem Label */
  .agenda-sidebar .section-header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .agenda-sidebar .agenda-next { max-width: 100%; font-size: 11px; }

  /* ═══════════════════════════════════════════════════════════════
     REVENUE HERO — großer Flächen-Chart (wie Referenz)
  ═══════════════════════════════════════════════════════════════ */
  .card-revenue {
    display: flex;
    flex-direction: column;
    padding: 16px 22px 10px;
    min-height: 0;
  }
  .rev-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-shrink: 0;
  }
  .rev-metrics { display: flex; gap: 40px; }
  .rev-metric { display: flex; flex-direction: column; gap: 4px; }
  .rev-metric-top { display: flex; align-items: center; gap: 9px; }
  .rev-value {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: -1.4px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .rev-value.accent { color: var(--accent-purple); }
  .rev-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }
  .rev-badge.up   { background: rgba(91,190,141,0.16); color: var(--accent-green); }
  .rev-badge.down { background: rgba(224,113,108,0.16); color: var(--accent-red); }
  .rev-badge.flat { background: rgba(255,255,255,0.07); color: var(--text-secondary); }
  .rev-metric-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
  }
  .rev-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .rev-exp-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card-inner);
    border: 0.5px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .rev-exp-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: background 0.2s;
  }
  .rev-exp-toggle.active {
    background: rgba(217,160,91,0.16);
    color: var(--accent-orange);
    border-color: rgba(217,160,91,0.42);
  }
  .rev-exp-toggle.active .rev-exp-dot { background: var(--accent-orange); }
  .rev-exp-toggle:active { transform: scale(0.97); }
  .rev-toggle {
    display: flex;
    gap: 2px;
    background: var(--card-inner);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .rev-toggle button {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .rev-toggle button.active { background: var(--grad-violet); color: #fff; }
  .rev-chart {
    flex: 1;
    min-height: 0;
    margin-top: 6px;
    position: relative;
  }
  .rev-chart svg { width: 100%; height: 100%; display: block; }

  /* Pipeline */
  .card-pipeline {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }


  .pipeline-list {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .pipeline-list::-webkit-scrollbar { display: none; }

  .pipeline-item {
    background: var(--card-inner);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
  }

  .pipeline-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .pipeline-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .pipeline-date {
    font-size: 11px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .pipeline-status {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pipeline-action {
    font-size: 11.5px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .pipeline-amount {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent-purple);
    margin-top: 3px;
  }

  /* Fehler / leer Zustand */
  .state-msg {
    padding: 16px;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }

  /* ─────────────────────────────────────
     ROW 2: KPI-Reihe (4 Karten)
  ───────────────────────────────────── */
  .row-kpi {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    min-height: 0;
  }
  .kpi-card {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
    min-width: 0;
    height: 96px;
    justify-content: center;
  }
  /* Mini-Statistik mit Icon (Drehtage etc.) */
  .kpi-row2 { display: flex; align-items: baseline; gap: 7px; }
  .kpi-chip {
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,0.07);
    color: var(--text-secondary);
  }
  .kpi-chip.up   { background: rgba(91,190,141,0.16); color: var(--accent-green); }
  .kpi-chip.amber{ background: rgba(217,160,91,0.16); color: var(--accent-orange); }
  .kpi-dotrow { display: flex; gap: 4px; margin: 4px 0 1px; flex-wrap: wrap; }
  .kpi-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.10); }
  .kpi-dot.on { background: var(--accent-purple); }
  .kpi-label {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .kpi-label .kpi-label-extra { font-weight: 500; letter-spacing: 0.02em; text-transform: none; }
  .kpi-value {
    font-size: 25px;
    font-weight: 300;
    letter-spacing: -0.8px;
    color: var(--text-primary);
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .kpi-value-sub { font-size: 14px; color: var(--text-secondary); font-weight: 300; }
  .kpi-sub {
    font-size: 10.5px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kpi-bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin: 3px 0 1px;
    flex-shrink: 0;
  }
  .kpi-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #5D54B8, #8A7FD6);
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
  }

  /* Gradient-Varianten (wie CRM-Vorbild, entsättigt) */
  .kpi-grad-violet { background: var(--grad-violet); border-color: rgba(255,255,255,0.10); }
  .kpi-grad-blue   { background: var(--grad-blue);   border-color: rgba(255,255,255,0.10); }
  .kpi-grad-violet .kpi-label, .kpi-grad-blue .kpi-label { color: rgba(255,255,255,0.60); }
  .kpi-grad-violet .kpi-value, .kpi-grad-blue .kpi-value { color: #FFFFFF; }
  .kpi-grad-violet .kpi-value-sub, .kpi-grad-blue .kpi-value-sub,
  .kpi-grad-violet .kpi-sub, .kpi-grad-blue .kpi-sub { color: rgba(255,255,255,0.70); }
  .kpi-grad-violet .kpi-bar, .kpi-grad-blue .kpi-bar { background: rgba(255,255,255,0.20); }
  .kpi-grad-violet .kpi-bar-fill, .kpi-grad-blue .kpi-bar-fill { background: rgba(255,255,255,0.92); }

  /* Lead-Anteils-Balken (Pipeline-KPI) */
  .kpi-segbar {
    display: flex;
    gap: 3px;
    height: 5px;
    margin: 3px 0 1px;
    flex-shrink: 0;
  }
  .kpi-segbar span {
    background: rgba(255,255,255,0.85);
    border-radius: 2px;
    min-width: 5px;
  }

  /* Umsatz-Mini-Balkenchart */
  .kpi-bars {
    display: flex;
    gap: 4px;
    flex: 1;
    align-items: stretch;
    min-height: 0;
  }
  .kpi-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .kpi-bar-track {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    min-height: 0;
  }
  .kpi-bar-v {
    width: 100%;
    background: #4A5066;
    border-radius: 3px 3px 0 0;
  }
  .kpi-bar-col.cur .kpi-bar-v { background: linear-gradient(180deg, #8A7FD6, #5D54B8); }
  .kpi-bar-col span {
    font-size: 8px;
    text-align: center;
    color: var(--text-tertiary);
    line-height: 1;
    flex-shrink: 0;
  }
  .kpi-bar-col.cur span { color: var(--accent-purple); font-weight: 700; }

  /* ─────────────────────────────────────
     ROW 4: Fokus + Status (Gmail/Rechnungen)
  ───────────────────────────────────── */
  .row-bottom {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 12px;
    height: 62px;
  }

  .card-fokus {
    padding: 9px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    border-left: 3px solid var(--accent-purple);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  /* Gmail-Chip (kompakt, in der Fokus-Leiste rechts) */
  .card-gmailchip {
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .fokus-text {
    font-size: clamp(15px, 1.8vw, 19px);
    font-weight: 400;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Kombinierte Status-Karte: Gmail + Rechnungen */
  .card-status {
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .status-seg {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
  }
  .status-div {
    width: 0.5px;
    align-self: stretch;
    margin: 8px 0;
    background: var(--border);
    flex-shrink: 0;
  }
  .status-item { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .status-num {
    font-size: 24px;
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .status-num.hot   { color: var(--accent-blue); }
  .status-num.amber { color: var(--accent-orange); }
  .status-ok {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(91,190,141,0.14);
    color: var(--accent-green);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
  }
  .status-text {
    font-size: 10.5px;
    color: var(--text-secondary);
    line-height: 1.3;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gmail-login-btn {
    font-size: 11.5px;
    font-family: inherit;
    font-weight: 600;
    background: var(--card-inner);
    border: 0.5px solid var(--border);
    color: var(--text-primary);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .gmail-login-btn:active { transform: scale(0.97); }

  /* ── Morning Report Button — circular icon button ── */
  .morning-btn {
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--grad-violet);
    color: #fff;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s, transform 0.12s;
    box-shadow: 0 4px 18px rgba(108,95,191,0.40);
  }
  .morning-btn .btn-label { display: none; } /* text hidden, icon only */
  .morning-btn:active   { transform: scale(0.93); }
  .morning-btn:disabled { opacity: 0.5; cursor: default; }
  .morning-btn.speaking { background: var(--accent-red); box-shadow: 0 4px 18px rgba(224,113,108,0.35); }
  .morning-btn svg      { flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.85s linear infinite; }

  /* ─────────────────────────────────────
     Skeleton / Loading
  ───────────────────────────────────── */
  .skel {
    display: block;
    background: linear-gradient(90deg, #20242F 25%, #2A2F3D 50%, #20242F 75%);
    background-size: 300% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
    border-radius: 5px;
  }

  @keyframes shimmer {
    0%   { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  .weather-skel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 4px;
  }

  /* ─────────────────────────────────────
     Animationen
  ───────────────────────────────────── */
  .fade-in {
    animation: fadeIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }


  /* ═══════════════════════════════════════════════════════════════
     VIEW SWITCH — single animated toggle, fixed position
     Sits left of weather card: right:178px clears weather (148+20+10)
  ═══════════════════════════════════════════════════════════════ */
  .time-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #view-toggle {
    position: fixed;
    top: 20px;
    right: 184px;  /* sits in the empty 140px slot, same height as weather card */
    width: 132px;
    height: 96px;
    z-index: 10000;
    background: #171A23;
    border: 0.5px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 11px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.38s cubic-bezier(0.22,1,0.36,1),
                border-color 0.38s cubic-bezier(0.22,1,0.36,1),
                box-shadow 0.38s cubic-bezier(0.22,1,0.36,1),
                transform 0.16s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.32), 0 1px 3px rgba(0,0,0,0.25);
  }
  #view-toggle:active { transform: scale(0.97); }
  #view-toggle.priv-mode {
    background: #FAF6EE;
    border-color: rgba(58,38,22,0.10);
    box-shadow: 0 2px 16px rgba(58,38,22,0.08), 0 1px 3px rgba(58,38,22,0.04);
  }
  #view-toggle.priv-mode .view-switch-label { color: #3A2616; }
  #view-toggle.priv-mode .view-switch-pill { background: #C7522A; }
  .view-switch-label {
    font-size: 13px;
    font-weight: 600;
    color: #E9EBF2;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    letter-spacing: 0.01em;
    width: auto;
    text-align: center;
    pointer-events: none;
    transition: color 0.35s;
  }
  #view-toggle.priv-mode .view-switch-label { color: #3A2616; }
  .view-switch-pill {
    width: 44px; height: 26px;
    border-radius: 13px;
    background: linear-gradient(135deg, #5D54B8, #8A7FD6);
    position: relative;
    flex-shrink: 0;
    pointer-events: none;
    transition: background 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #view-toggle.priv-mode .view-switch-pill { background: #F7B35A; }
  .view-switch-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,0.28), 0 0.5px 1px rgba(0,0,0,0.12);
    transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #view-toggle.priv-mode .view-switch-thumb { transform: translateX(18px); }

  /* ═══════════════════════════════════════════════════════════════
     PRIVATE SCREEN v2 — WARM LINEN
  ═══════════════════════════════════════════════════════════════ */
  :root {
    --pb:    #EFE5D2;            /* linen background */
    --pc:    #FAF6EE;            /* card cream — lighter */
    --pc2:   #FDF9F2;            /* card-hover / done */
    --pb2:   rgba(58,38,22,0.08);
    --pb3:   rgba(58,38,22,0.18);
    --ps:    none;
    --ps2:   none;
    --pt:    #3A2616;
    --pt2:   #8A6A42;
    --pt3:   #A88860;
    --pa:    #C7522A;            /* terracotta */
    --pa2:   #D86940;
    --pg:    #5A7A3F;            /* olive */
    --pg2:   #7A9258;
    --pg3:   #2D5A27;
    --phn:   #E5D8BD;            /* empty-state beige */
    --pyel:  #D4A24A;            /* yellow accent */
    --serif: 'Playfair Display', 'EB Garamond', Georgia, serif;
  }

  #screen-private {
    position: fixed;
    inset: 0;
    z-index: 9000;
    background:
      radial-gradient(ellipse at 50% 35%, #F4EBD8 0%, #E8D9BC 100%),
      #EFE5D2;
    background-attachment: fixed;
    overflow-y: auto;
    padding: 20px 20px 18px; /* match business screen padding so header aligns with fixed toggle */
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    color: var(--pt);
    -webkit-font-smoothing: antialiased;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
    -webkit-user-select: none;
  }
  #screen-private.active { opacity: 1; pointer-events: auto; }

  /* Subtle linen/canvas texture */
  .priv-texture {
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.45 0 0 0 0 0.32 0 0 0 0 0.2 0 0 0 0.07 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
    opacity: 0.85;
    pointer-events: none;
    z-index: 1;
  }
  /* Subtle dot grid overlay */
  .priv-dots {
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, rgba(139,87,42,0.15) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    pointer-events: none;
    z-index: 2;
  }
  #screen-private .priv-layout { position: relative; z-index: 5; }

  .priv-layout {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: auto;
    gap: 12px;
    min-height: 0;
  }

  /* ── Header row: same 3-col structure as business row-top ── */
  .priv-header {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 140px 148px; /* greeting | toggle-slot (empty) | date card */
    gap: 12px;
    height: 96px;                            /* match toggle / weather height */
    margin-bottom: 4px;
  }
  /* Greeting block — left column, transparent (no card) */
  .priv-greet-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 0 6px;
  }
  /* Middle column intentionally empty — toggle floats here */
  .priv-toggle-slot { /* placeholder, not rendered */ }

  .priv-greet-title {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 36px;
    color: var(--pt);
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .priv-greet-sub {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    color: var(--pa);
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-top: 2px;
  }
  /* Date card — column 3, same dimensions as weather card */
  .priv-date-pill {
    background: var(--pc);
    border: 0.5px solid var(--pb2);
    border-radius: 18px;
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    /* no margin — column 3 of grid handles positioning */
  }
  .priv-date-day {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 16px;
    color: var(--pt);
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .priv-date-meta {
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--pt3);
    text-transform: uppercase;
    margin-top: 2px;
    font-family: -apple-system, sans-serif;
  }

  /* ── Card base ── */
  .priv-card {
    background: var(--pc);
    border: 0.5px solid var(--pb2);
    border-radius: 14px;
    padding: 14px 18px;
    position: relative;
  }
  .priv-card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--pt3);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .priv-card-label::before {
    content: '✦';
    font-size: 10px;
    color: var(--pa);
    font-weight: 400;
  }

  /* ── Habit cards (row of 4) ── */
  .habit-mini {
    grid-column: span 3;
    background: var(--pc);
    border: 0.5px solid var(--pb2);
    border-radius: 14px;
    padding: 18px 22px 14px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.22,1,0.36,1), background 0.25s, border-color 0.25s;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 168px;
  }
  .habit-mini:active { transform: scale(0.985); }
  .habit-mini.done {
    background: var(--pc2);
    box-shadow:
      inset 0 0 0 1.5px rgba(240,150,40,0.50),
      inset 0 0 25px rgba(240,150,40,0.45),
      inset 0 0 60px rgba(240,150,40,0.32),
      inset 0 0 120px rgba(240,150,40,0.20);
  }
  .habit-mini-emoji {
    font-size: 22px;
    line-height: 1;
    align-self: flex-start;
    margin-bottom: 6px;
  }
  .habit-mini-name {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    color: var(--pt);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .habit-mini-name.placeholder { color: var(--pt3); font-weight: 500; }
  .habit-mini-goal {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.20em;
    color: var(--pt3);
    text-transform: uppercase;
    margin-top: 1px;
  }
  .habit-mini-bar {
    display: flex;
    gap: 3px;
    margin-top: 10px;
    margin-bottom: auto;
  }
  .habit-mini-bar-dot {
    flex: 1;
    height: 6px;
    border-radius: 1.5px;
    background: var(--phn);
  }
  .habit-mini-bar-dot.on { background: var(--pa); }
  .habit-mini-bar-dot.today { background: var(--pyel); }
  .habit-mini-foot {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .habit-mini-streak {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    font-weight: 600;
    color: var(--pa);
    letter-spacing: -0.01em;
  }
  .habit-mini-streak.zero {
    color: var(--pt3);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0;
  }
  .habit-mini-checkmark {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--pb3);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s, border-color 0.25s;
    flex-shrink: 0;
  }
  .habit-mini.done .habit-mini-checkmark {
    background: var(--pg);
    border-color: var(--pg);
  }
  .habit-mini.done .habit-mini-checkmark::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }

  /* ── Bottom row ── */
  .priv-bottom-row {
    grid-column: 1 / -1;
    display: flex;
    gap: 14px;
    align-items: stretch;
    min-height: 0;
  }
  .priv-ita-card  { flex: 6 0 0; display: flex; flex-direction: column; }
  .priv-life-card { flex: 3 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .priv-cal-mini  { flex: 3 0 0; display: flex; flex-direction: column; min-height: 0; }

  /* ── Italian Heatmap ── */
  .ita-grid { display: flex; gap: 4px; margin-top: 4px; }
  .ita-col { display: flex; flex-direction: column; gap: 4px; }
  .ita-cell {
    width: 19px; height: 19px;
    border-radius: 3px;
    cursor: pointer;
    background: var(--phn);
    transition: transform 0.12s;
    flex-shrink: 0;
  }
  .ita-cell:active { transform: scale(1.25); }
  .ita-cell.ita-today {
    outline: 1.5px solid var(--pa);
    outline-offset: 2px;
  }
  .ita-month-labels { display: flex; gap: 5px; margin-bottom: 5px; }
  .ita-month-span {
    font-size: 9.5px;
    font-weight: 600;
    color: var(--pt3);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }

  .ita-stats-rows {
    margin-top: 12px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
  }
  .ita-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-top: 0.5px solid var(--pb2);
  }
  .ita-stat-row:last-of-type { border-bottom: 0.5px solid var(--pb2); }
  .ita-stat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--pt3);
    text-transform: uppercase;
  }
  .ita-stat-val {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    color: var(--pt);
    letter-spacing: -0.01em;
  }
  .ita-log-btn-big {
    margin-top: auto;
    background: var(--pa);
    color: #FBF0DD;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background 0.2s, transform 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .ita-log-btn-big:hover { background: var(--pa2); }
  .ita-log-btn-big:active { transform: scale(0.99); }

  /* ── Life Weeks Card ── */
  .life-hero-week {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 56px;
    color: var(--pa);
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin-top: 2px;
  }
  .life-hero-total {
    font-size: 12px;
    color: var(--pt2);
    margin-top: 10px;
    line-height: 1.5;
  }
  .life-hero-total strong { color: var(--pt); font-weight: 700; }
  .life-hero-meta {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--pt2);
    margin-top: 4px;
  }
  .life-progress-bar {
    height: 4px;
    background: var(--phn);
    border-radius: 99px;
    overflow: hidden;
    margin: 14px 0 12px;
  }
  .life-progress-fill {
    height: 100%;
    background: var(--pa);
    border-radius: 99px;
    transition: width 0.9s cubic-bezier(0.22,1,0.36,1);
  }
  .life-grid {
    display: grid;
    grid-template-columns: repeat(52, 4px);
    grid-auto-rows: 4px;
    gap: 1.5px;
    justify-content: start;
    margin-top: auto;
    max-height: 200px;
    overflow: hidden;
  }
  .life-cell {
    width: 4px; height: 4px;
    background: var(--phn);
  }
  .life-cell.lived   { background: var(--pt); opacity: 0.55; }
  .life-cell.current { background: var(--pa) !important; opacity: 1 !important; }

  /* ── Mini Calendar ── */
  .priv-cal-mini-frame {
    width: 100%;
    flex: 1;
    min-height: 0;
    border: 0.5px solid var(--pb2);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,0.4);
  }
  .priv-cal-mini-frame iframe {
    width: 100%; height: 100%;
    border: none;
    pointer-events: auto;
  }

  /* ── Life birthday form (first-run) ── */
  .life-bd-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 6px 0;
  }
  .life-bd-form label { font-size: 12px; color: var(--pt2); font-weight: 500; }
  .life-bd-input {
    border: 1px solid var(--pb3);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    background: rgba(255,255,255,0.6);
    color: var(--pt);
    font-family: inherit;
    width: 100%;
    -webkit-appearance: none;
  }
  .life-bd-save {
    background: var(--pa);
    color: #FBF0DD;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

</style>
</head>
<body>



<!-- ── Single animated toggle — always at same position, z:10000 above everything ── -->
<div id="view-toggle" onclick="toggleView()">
  <span class="view-switch-label" id="view-toggle-label">Business</span>
  <div class="view-switch-pill"><div class="view-switch-thumb"></div></div>
</div>

<div class="screen" id="screen-business">

  <!-- ── ROW 1: Zeit + Wetter ── -->
  <div class="row-top">

    <div class="card card-time">
      <div>
        <div class="time-display" id="clock">00:00</div>
        <div class="time-date"    id="datestr">Laden…</div>
      </div>
      <div class="time-actions">
        <button class="morning-btn" id="morning-btn" onclick="startMorningReport()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/>
            <line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
            <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/>
            <line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/>
          </svg>
          <span class="btn-label">Morning Report</span>
        </button>
      </div><!-- /.time-actions -->
    </div>

    <div class="card card-weather" id="weather-card">
      <div class="weather-skel">
        <div>
          <span class="skel" style="width:28px;height:20px;margin-bottom:6px;"></span>
          <span class="skel" style="width:64px;height:34px;"></span>
        </div>
        <div>
          <span class="skel" style="width:80px;height:12px;margin-bottom:4px;"></span>
          <span class="skel" style="width:52px;height:11px;margin-bottom:2px;"></span>
          <span class="skel" style="width:44px;height:11px;"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── HAUPTBEREICH: links Inhalt, rechts Agenda+Pipeline ── -->
  <div class="main-area">

    <div class="main-left">

      <!-- Revenue Hero (großer Flächen-Chart) -->
      <div class="card card-revenue">
        <div class="rev-head">
          <div class="rev-metrics">
            <div class="rev-metric">
              <div class="rev-metric-top">
                <span class="rev-value" id="rev-month-value">—</span>
                <span class="rev-badge flat" id="rev-month-badge"></span>
              </div>
              <span class="rev-metric-label" id="rev-month-label">Umsatz · diesen Monat</span>
            </div>
            <div class="rev-metric">
              <div class="rev-metric-top">
                <span class="rev-value accent" id="rev-mrr-value">—</span>
              </div>
              <span class="rev-metric-label" id="rev-mrr-label">MRR · wiederkehrend</span>
            </div>
          </div>
          <div class="rev-controls">
            <button class="rev-exp-toggle" id="rev-exp-toggle" type="button">
              <span class="rev-exp-dot"></span>Ausgaben
            </button>

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n, unit) {
  if (n === null || n === undefined || isNaN(Number(n))) return '—';
  const formatted = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(Number(n));
  return unit ? formatted + '\u202F' + unit : formatted;
}

// ── Notion Blocks API ────────────────────────────────────────
// Liest eine einfache Notion-Tabelle (type: "table") per Blocks API
async function notionGetBlocks(blockId) {
  const res = await fetch(`/api/notion?endpoint=blocks/${blockId}/children&page_size=50`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Parst Notion table_row Blöcke → Array von Objekten
// Erste Zeile wird als Header-Zeile behandelt
function parseNotionTable(data) {
  const rows = (data.results || []).filter(b => b.type === 'table_row');
  if (rows.length < 2) return [];
  const cellText = cells => (cells || []).map(t => t.plain_text || t.text?.content || '').join('').trim();
  const headers  = rows[0].table_row.cells.map(cellText);
  return rows.slice(1).map(row => {
    const obj = {};
    row.table_row.cells.forEach((cell, i) => { if (headers[i]) obj[headers[i]] = cellText(cell); });
    return obj;
  });
}

// Zahl aus deutschem Format: "1.000,50" → 1000.5, "1000" → 1000
function parseNum(s) {
  if (typeof s === 'number') return s;
  if (!s) return 0;
  const str = String(s).trim();
  // Deutsches Format: Punkt = Tausender, Komma = Dezimal
  if (/\d\.\d{3}/.test(str)) return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  // Englisches Format oder plain
  return parseFloat(str.replace(',', '.').replace(/[^0-9.-]/g, '')) || 0;
}

  const calDateEl = document.getElementById('cal-date');

  agendaUpdateNext();   // "Als Nächstes"-Countdown live halten

// ── KPI: Jahresfortschritt ───────────────────────────────────
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}

function renderYearKpi() {
  const el = document.getElementById('kpi-year-inner');
  if (!el) return;
  const now  = new Date();
  const y0   = new Date(now.getFullYear(), 0, 1);
  const y1   = new Date(now.getFullYear() + 1, 0, 1);
  const doy  = Math.floor((now - y0) / 86400000) + 1;
  if (el._doy === doy) return; // nur bei Tageswechsel neu rendern
  el._doy = doy;
  const days = Math.round((y1 - y0) / 86400000);
  const pct  = Math.round((now - y0) / (y1 - y0) * 100);
  el.innerHTML = `
    <div class="kpi-value">KW ${isoWeek(now)}</div>
    <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pct}%"></div></div>
    <div class="kpi-sub">Tag ${doy} von ${days} · ${pct} % von ${now.getFullYear()}</div>`;
}

// ── Cashflow → Revenue-Hero + Jahresumsatz-KPI + Chart ───────
// Baut eine durchgehende Monatsreihe von BIZ_START bis aktueller Monat
function monthSeriesFromRows(rows) {
  const map = {};
  rows.forEach(r => {
    const label = String(r['Monat'] || r['Month'] || r['Name'] || '');
    const mIdx  = MONTHS.findIndex(mn => label.toLowerCase().includes(mn.toLowerCase()));
    const ym    = label.match(/(20\d{2})/);
    if (mIdx >= 0 && ym) {
      map[`${ym[1]}-${mIdx}`] = {
        rev:  parseNum(r['Einnahmen'] || r['Revenue'] || 0),
        exp:  parseNum(r['Ausgaben'] || r['Aufwendungen'] || r['Expenses'] || 0),
        goal: parseNum(r['Ziel'] || r['Goal'] || 0),
      };
    }
  });
  const now = new Date();
  const series = [];
  let y = BIZ_START.year, m = BIZ_START.month;
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) {
    const d = map[`${y}-${m}`] || { rev: null, exp: null, goal: null };
    series.push({ year: y, mIdx: m, rev: d.rev, exp: d.exp, goal: d.goal });
    if (++m > 11) { m = 0; y++; }
  }
  return series;
}

function renderTrendBadge(id, cur, prev) {
  const el = document.getElementById(id);
  if (!el) return;
  if (prev === null || prev === undefined) { el.className = 'rev-badge flat'; el.textContent = 'neu'; return; }
  if (prev === 0 && cur === 0)             { el.className = 'rev-badge flat'; el.textContent = '±0 %'; return; }
  if (prev === 0)                          { el.className = 'rev-badge up';   el.textContent = '↗ neu'; return; }
  const pct = Math.round((cur - prev) / prev * 100);
  el.className   = 'rev-badge ' + (pct === 0 ? 'flat' : pct > 0 ? 'up' : 'down');
  el.textContent = (pct > 0 ? '↗ +' : pct < 0 ? '↘ ' : '') + pct + ' %';
}

async function loadCashflow() {
  try {
    const rows = parseNotionTable(await notionGetBlocks(TABLE.cashflow));
    _cashflowRows = rows;
    const now    = new Date();
    const series = monthSeriesFromRows(rows);

    const cur  = series[series.length - 1] || { rev: 0 };
    const prev = series[series.length - 2];
    const curRev = cur.rev || 0;

    document.getElementById('rev-month-value').textContent = fmtNum(curRev) + ' €';
    document.getElementById('rev-month-label').textContent =
      'Umsatz · ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
    renderTrendBadge('rev-month-badge', curRev, prev ? prev.rev : null);

    // Jahresumsatz-KPI (laufendes Jahr)
    const ytdMonths = series.filter(s => s.year === now.getFullYear());
    const ytd       = ytdMonths.reduce((a, s) => a + (s.rev || 0), 0);
    const goalSum   = ytdMonths.reduce((a, s) => a + (s.goal || 0), 0);
    const goalPct   = goalSum > 0 ? Math.round(ytd / goalSum * 100) : 0;
    const yrEl = document.getElementById('kpi-yearrev-year');
    if (yrEl) yrEl.textContent = now.getFullYear();
    document.getElementById('kpi-yearrev-inner').innerHTML = `
      <div class="kpi-value fade-in">${fmtNum(ytd)} €</div>
      <div class="kpi-sub">${goalSum > 0 ? goalPct + ' % vom Jahresziel' : ytdMonths.length + ' Monate'}</div>`;

    renderRevenueChart();
  } catch (err) {
    console.error('Cashflow:', err);
    const v = document.getElementById('rev-month-value');
    if (v) v.textContent = '–';
  }
}

// ── Großer Revenue-Area-Chart (SVG, smooth, mit Ziel-Linie) ──
function smoothPath(pts) {
  if (!pts.length) return '';
  if (pts.length < 2) return `M${pts[0].x},${pts[0].y}`;
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

function renderRevenueChart() {
  const el = document.getElementById('rev-chart');
  if (!el || !_cashflowRows.length) return;
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 40 || H < 40) { requestAnimationFrame(renderRevenueChart); return; }

  let series = monthSeriesFromRows(_cashflowRows);
  if (_revRange !== 'max' && series.length > _revRange) series = series.slice(-_revRange);

  const showExp = _revShowExpenses;
  const padL = 12, padR = 14, padT = 16, padB = 22;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = series.length;
  const xAt = i => padL + (n <= 1 ? innerW / 2 : innerW * i / (n - 1));
  const maxV = Math.max(...series.map(s => Math.max(s.rev || 0, s.goal || 0, showExp ? (s.exp || 0) : 0)), 1);
  const yAt = v => padT + innerH * (1 - (v || 0) / maxV);

  const revPts  = series.map((s, i) => ({ x: xAt(i), y: yAt(s.rev || 0) }));
  const expPts  = series.map((s, i) => ({ x: xAt(i), y: yAt(s.exp || 0) }));
  const goalPts = series.map((s, i) => ({ x: xAt(i), y: yAt(s.goal || 0) }));
  const hasGoal = !showExp && series.every(s => s.goal);  // Ziel-Linie nur ohne Ausgaben-Overlay

  const revLine = smoothPath(revPts);
  const areaPath = revLine
    + ` L${xAt(n - 1).toFixed(1)},${(padT + innerH).toFixed(1)}`
    + ` L${padL.toFixed(1)},${(padT + innerH).toFixed(1)} Z`;

  // Ausgaben-Serie (orange) — hinter der Einnahmen-Linie
  let expSvg = '';
  if (showExp) {
    const expLine = smoothPath(expPts);
    const expArea = expLine
      + ` L${xAt(n - 1).toFixed(1)},${(padT + innerH).toFixed(1)}`
      + ` L${padL.toFixed(1)},${(padT + innerH).toFixed(1)} Z`;
    expSvg = `
      <path d="${expArea}" fill="url(#expGrad)"/>
      <path d="${expLine}" fill="none" stroke="#D9A05B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  // Legende (nur wenn Ausgaben aktiv)
  const legend = showExp ? `
    <g font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="600">
      <circle cx="${padL + 4}" cy="${padT - 4}" r="4" fill="#8E84E8"/>
      <text x="${padL + 12}" y="${padT - 1}" fill="rgba(255,255,255,0.7)">Einnahmen</text>
      <circle cx="${padL + 78}" cy="${padT - 4}" r="4" fill="#D9A05B"/>
      <text x="${padL + 86}" y="${padT - 1}" fill="rgba(255,255,255,0.7)">Ausgaben</text>
    </g>` : '';

  // Gridlines (3)
  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const gy = padT + innerH * g / 3;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  }

  // X-Labels (bei vielen Monaten ausdünnen)
  const stepLbl = n > 9 ? 2 : 1;
  let labels = '';
  series.forEach((s, i) => {
    if (i % stepLbl !== 0 && i !== n - 1) return;
    labels += `<text x="${xAt(i).toFixed(1)}" y="${H - 6}" fill="rgba(255,255,255,0.38)" font-size="9.5" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif">${MONTHS[s.mIdx].slice(0,3)}</text>`;
  });

  // Aktueller Monat (letzter Punkt): Marker + Pill
  const ci = n - 1, cx = xAt(ci), cy = revPts[ci].y, cVal = series[ci].rev || 0;
  const pillW = Math.max(44, (fmtNum(cVal) + ' €').length * 7 + 16);
  let pillX = cx - pillW / 2;
  pillX = Math.max(padL, Math.min(pillX, W - padR - pillW));
  const pillY = Math.max(2, cy - 30);
  const marker = `
    <line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${padT + innerH}" stroke="rgba(142,132,232,0.45)" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="8" fill="rgba(142,132,232,0.20)"/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="#8E84E8" stroke="#0E1016" stroke-width="1.5"/>
    <rect x="${pillX.toFixed(1)}" y="${pillY}" width="${pillW}" height="21" rx="7" fill="#26223A" stroke="rgba(142,132,232,0.4)" stroke-width="0.5"/>
    <text x="${(pillX + pillW/2).toFixed(1)}" y="${pillY + 14}" fill="#C9C2F2" font-size="11" font-weight="600" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif">${fmtNum(cVal)} €</text>`;

  const goalLine = hasGoal
    ? `<path d="${smoothPath(goalPts)}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-dasharray="4 4"/>`
    : '';

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#8E84E8" stop-opacity="0.42"/>
          <stop offset="55%" stop-color="#6C5FBF" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#6C5FBF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="expGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#D9A05B" stop-opacity="0.28"/>
          <stop offset="60%" stop-color="#D9A05B" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#D9A05B" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      ${expSvg}
      <path d="${areaPath}" fill="url(#revGrad)"/>
      ${goalLine}
      <path d="${revLine}" fill="none" stroke="#8E84E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${labels}
      ${marker}
      ${legend}
    </svg>`;
}

const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.readonly';

// ── Google Auth — Persistent Token mit proaktivem Refresh ─────
// Access Tokens leben 1h. Wir erneuern sie 5 Min vor Ablauf still
// im Hintergrund, solange die Google-Session aktiv ist (= immer auf iPad).

let _googleToken  = null;
let _refreshTimer = null;

function gmailTokenLoad() {
  try {
    const d = JSON.parse(localStorage.getItem('gmail_token') || 'null');
    if (d && Date.now() < d.expires) return { token: d.token, expires: d.expires };
  } catch {}
  return null;
}

function gmailTokenSave(token, expiresIn) {
  const expiresAt = Date.now() + (expiresIn || 3600) * 1000;
  localStorage.setItem('gmail_token', JSON.stringify({ token, expires: expiresAt }));
  _googleScheduleRefresh(expiresAt);
}

function gmailTokenClear() {
  localStorage.removeItem('gmail_token');
  if (_refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; }
}

// Planen: 5 Minuten vor Ablauf still neuen Token holen
function _googleScheduleRefresh(expiresAt) {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  const delay = expiresAt - Date.now() - 5 * 60_000; // 5 min vor Ablauf
  _refreshTimer = setTimeout(_googleSilentRefresh, Math.max(delay, 10_000));
  console.log('[Auth] Token refresh in', Math.round(Math.max(delay,10000)/60000), 'Min geplant');
}

// Stilles Re-Auth — kein Dialog, kein Reload
async function _googleSilentRefresh() {
  if (!window.google?.accounts?.oauth2) return;
  console.log('[Auth] Stilles Token-Refresh läuft…');
  const token = await new Promise(resolve => {
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => resolve(r?.access_token || null),
        error_callback: () => resolve(null),
      });
      client.requestAccessToken({ prompt: 'none' });
    } catch { resolve(null); }
    setTimeout(() => resolve(null), 10_000); // 10s Timeout (iOS braucht mehr Zeit)
  });

  if (token) {
    gmailTokenSave(token, 3600);
    _googleToken = token;
    console.log('[Auth] Token still erneuert ✓');
    // UI im Hintergrund aktualisieren
    try { gmailRenderCount(await gmailFetch(token)); } catch {}
    agendaLoad();
  } else {
    // Stilles Refresh fehlgeschlagen → dezenter Hinweis ohne UI zu brechen
    console.warn('[Auth] Stilles Refresh fehlgeschlagen');
    _gmailShowRefreshHint();
  }
}

async function gmailFetch(token) {
  const r = await fetch(
    'https://gmail.googleapis.com/gmail/v1/users/me/threads?q=is:unread+in:inbox+category:primary&maxResults=50',
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (r.status === 401) throw Object.assign(new Error('401'), { status: 401 });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return (d.threads || []).length;
}

// Prüft Calendar-Scope (nur einmal nach Fresh-Login aufgerufen)
async function hasCalendarScope(token) {
  const r = await fetch(
    'https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=1',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  return r.ok;
}

async function gmailLoad() {
  // 1. Gespeicherter, noch gültiger Token?
  const stored = gmailTokenLoad();
  if (stored) {
    _googleToken = stored.token;
    _googleScheduleRefresh(stored.expires); // Refresh-Timer (neu) starten
    try {
      gmailRenderCount(await gmailFetch(stored.token));
      agendaLoad();
      return;
    } catch (e) {
      if (e.status === 401) { gmailTokenClear(); _googleToken = null; }
      else return; // Netzwerk-Fehler, nicht ausloggen
    }
  }

  // 2. Kein/abgelaufener Token → stilles Re-Auth
  const token = await new Promise(resolve => {
    if (!window.google?.accounts?.oauth2) { resolve(null); return; }
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => resolve(r?.access_token || null),
        error_callback: () => resolve(null),
      });
      client.requestAccessToken({ prompt: 'none' });
    } catch { resolve(null); }
    setTimeout(() => resolve(null), 10_000);
  });

  if (token) {
    // Bei frischem Silent-Auth einmalig Calendar-Scope prüfen
    const calOk = await hasCalendarScope(token);
    if (!calOk) {
      // Scope fehlt → manueller Login mit consent nötig
      gmailRenderLogin(); agendaRenderLogin(); return;
    }
    gmailTokenSave(token, 3600);
    _googleToken = token;
    try { gmailRenderCount(await gmailFetch(token)); } catch { gmailRenderError(); }
    agendaLoad();
    return;
  }

  // 3. Alles fehlgeschlagen → Login-Button
  gmailRenderLogin();
  agendaRenderLogin();
}

function gmailLogin() {
  if (!window.google?.accounts?.oauth2) { gmailRenderError(); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: GMAIL_CLIENT_ID,
    scope: GMAIL_SCOPE,
    callback: async r => {
      if (!r.access_token) { gmailRenderError(); return; }
      gmailTokenSave(r.access_token, r.expires_in);
      _googleToken = r.access_token;
      try { gmailRenderCount(await gmailFetch(r.access_token)); }
      catch { gmailRenderError(); }
      agendaLoad();
    },
  }).requestAccessToken({ prompt: 'consent' });
}

function buildMorningText(d) {
  const now      = new Date();
  const hour     = now.getHours();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);

  const wochentag  = d.date.split(',')[0]?.trim() || 'Heute';
  const datumKurz  = d.date.split(', ').slice(1).join(', ').replace(/\s+\d{4}$/, '') || d.date;
  const greet      = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';
  const morgenTag  = DAYS[tomorrow.getDay()];

  const parts = [];

  // 1. Begrüßung
  parts.push(`${greet}, Simon! Es ist ${d.time} Uhr, ${wochentag} der ${datumKurz}.`);

  // 2. Wetter — Zeilen bereinigen, Emoji-Zeilen rausfiltern
  const wLines = d.weather.split('\n')
    .map(s => s.trim())
    .filter(s => s && s.length > 1 && !/^\p{Emoji_Presentation}$/u.test(s));
  const wTemp  = wLines.find(s => /^\d+°$/.test(s) || s.match(/^\d+°$/));
  const wDesc  = wLines.find(s => !/\d/.test(s) && !s.includes('Laubach') && !s.includes('Fühlt') && s.length > 3);
  const wFeels = wLines.find(s => s.includes('Fühlt'));
  if (wDesc || wTemp) {
    let w = 'Draußen in Laubach';
    if (wTemp) w += ` sind es ${wTemp}`;
    if (wDesc) w += `, ${wDesc.toLowerCase()}`;
    if (wFeels) w += `, ${wFeels.toLowerCase().replace('fühlt:', 'gefühlt').replace('fühlt: ', 'gefühlt ')}`;
    parts.push(w + '.');
  }

  // 3. Fokus
  const fokus = d.fokus.replace(/\n.*/s, '').trim();
  const fokusLeer = !fokus || ['—', 'Kein Fokus', 'Nicht verfügbar', 'Kein Fokus eingetragen'].some(s => fokus.includes(s));
  if (!fokusLeer) {
    parts.push(`Dein Fokus für heute: ${fokus}.`);
  } else {
    parts.push('Für heute ist noch kein Fokus eingetragen.');
  }

  // 4. Pipeline
  const leads = d.pipeline.filter(l => !l.includes('Nicht verfügbar'));
  if (leads.length) {
    const firstName = leads[0].split(' · ')[0].trim();
    if (leads.length === 1) {
      parts.push(`In deiner Pipeline läuft gerade ein aktiver Lead: ${firstName}.`);
    } else {
      const others = leads.slice(1).map(l => l.split(' · ')[0].trim());
      const list   = others.length === 1
        ? `${firstName} und ${others[0]}`
        : `${firstName}, ${others.slice(0, -1).join(', ')} und ${others.at(-1)}`;
      parts.push(`Du hast ${leads.length} aktive Leads in der Pipeline: ${list}.`);
    }
  }

  // 5. Cashflow
  const cfClean = d.cashflow.replace(/\s+/g, ' ').trim();
  const cfLeer  = !cfClean || ['Keine Daten', 'Nicht verfügbar'].some(s => cfClean.includes(s));
  if (!cfLeer) {
    // Nur Zahlen extrahieren: "400 / 1.000 € 40 % des Ziels" → lesbar machen
    const match = cfClean.match(/([\d.,]+)\s*\/\s*([\d.,]+)\s*€/);
    if (match) {
      parts.push(`Beim Cashflow stehst du diesen Monat bei ${match[1]} von ${match[2]} Euro Ziel.`);
    } else {
      parts.push(`Zum Cashflow: ${cfClean.split('\n')[0]}.`);
    }
  }

  // 6. Abschluss
  const closings = [
    `Morgen ist ${morgenTag} — noch ist heute, pack es an!`,
    `Einen produktiven ${wochentag} dir, mach was draus!`,
    `Morgen erwartet dich schon der ${morgenTag}, also nutze den heutigen Tag.`,
  ];
  parts.push(closings[now.getMinutes() % closings.length]);

  return parts.join(' ');
}

function setBtn(state) {
  const btn = document.getElementById('morning-btn');
  btn.classList.remove('speaking');
  switch (state) {
    case 'idle':
      btn.disabled = false;
      btn.innerHTML = SVG_SUN + ' Morning Report';
      btn.onclick = startMorningReport;
      break;
    case 'loading':
      btn.disabled = true;
      btn.innerHTML = SVG_SPIN + ' Lädt…';
      break;
    case 'speaking':
      btn.classList.add('speaking');
      btn.disabled = false;
      btn.innerHTML = SVG_STOP + ' Stop';
      btn.onclick = () => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
        setBtn('idle');
      };
      break;
  }
}

async function startMorningReport() {
  // iOS Audio-Unlock sofort in der User-Geste
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    setTimeout(() => ctx.close(), 500);
  } catch {}

  // Frische Heute-Termine laden (blockiert kurz, aber Loader im Overlay fängt das ab)
  if (_googleToken) await todayLoad();

  const now = new Date();
  const data = {
    time:    document.getElementById('clock')?.textContent?.trim() || '',
    weekday: DAYS[now.getDay()],
    date:    now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear(),
    events:  window._mrEvents  || [],
    leads:   window._mrLeads   || [],
    focus:   document.getElementById('fokus-text')?.innerText?.replace(/\n.*/s,'').trim() || '',
    weather: window._mrWeather || null,
    gmail:   window._mrGmail   ?? null,
    zoho:    window._mrZoho    || null,
  };
  if (typeof window.startMorningReportOverlay === 'function') {
    window.startMorningReportOverlay(data);
  }
}

async function _legacyTtsReport() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  setBtn('loading');

  const text = buildMorningText(collectDashboardData());

  try {
    const res = await fetch(
      `https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_TTS_KEY}`,
      {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input:       { text },
          voice:       { languageCode: 'de-DE', name: 'de-DE-Wavenet-F' },
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.95, pitch: 0 },
        }),
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    if (!audioContent) throw new Error('Keine Audio-Daten erhalten');

    currentAudio = new Audio('data:audio/mpeg;base64,' + audioContent);
    currentAudio.onended = () => { currentAudio = null; setBtn('idle'); };

// Hilfsfunktion: Events aus einem einzelnen Kalender holen
async function fetchEventsForDay(calId, start, end) {
  try {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?`
      + `timeMin=${encodeURIComponent(start.toISOString())}`
      + `&timeMax=${encodeURIComponent(end.toISOString())}`
      + `&singleEvents=true&orderBy=startTime&maxResults=30`;
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + _googleToken } });
    if (!r.ok) return [];
    const d = await r.json();
    return d.items || [];
  } catch { return []; }
}

// Kalender-ID aus dem Dashboard-Iframe (simon-raphael.moser@web.de)
const DASHBOARD_CAL_ID = 'simon-raphael.moser@web.de';

async function todayLoad() {
  if (!_googleToken) return;
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end   = new Date(); end.setHours(23, 59, 59, 999);

    // Dashboard-Kalender immer explizit + alle weiteren aus der Liste
    const listRes = await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
      { headers: { Authorization: 'Bearer ' + _googleToken } }
    );
    const calList = listRes.ok ? await listRes.json() : { items: [] };
    const calIds  = [...new Set([
      DASHBOARD_CAL_ID,
      'primary',
      ...(calList.items || []).map(c => c.id),
    ])];

    const allEvents = (await Promise.all(calIds.map(id => fetchEventsForDay(id, start, end)))).flat();

    // Sortieren + deduplizieren (nach eventId)
    const seen = new Set();
    const sorted = allEvents
      .filter(ev => { const k = ev.id; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => new Date(a.start?.dateTime || a.start?.date) - new Date(b.start?.dateTime || b.start?.date));

    window._mrEvents = sorted.map(ev => ({
      time:  ev.start?.dateTime
        ? new Date(ev.start.dateTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
        : 'Ganztags',
      title: ev.summary || '(ohne Titel)',
    }));
  } catch { /* ignorieren */ }
}

// ═════════════════════════════════════════════════════════════
// AGENDA — eigener dunkler Kalender (heute + 4 Folgetage)
// ═════════════════════════════════════════════════════════════
const AGENDA_DAYS   = 5;
const AGENDA_COLORS = ['#8E84E8', '#6BA3DC', '#5BBE8D', '#D9A05B', '#D777A8', '#7FC4CE'];
// _agendaEvents wird oben (vor updateClock) deklariert

function _agDateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function _agTime(d) {
  return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}
function _agDur(ms) {
  const m = Math.max(Math.round(ms / 60000), 1);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), rest = m % 60;
  return rest ? `${h} h ${rest} min` : `${h} h`;
}

async function agendaLoad() {
  if (!_googleToken) { agendaRenderLogin(); return; }
  todayLoad(); // Heute-Termine für Morning Report parallel laden
  const body = document.getElementById('agenda-body');
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end   = new Date(start);
    end.setDate(end.getDate() + AGENDA_DAYS);
    end.setMilliseconds(-1);

    const listRes = await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
      { headers: { Authorization: 'Bearer ' + _googleToken } }
    );
    if (listRes.status === 401) { gmailTokenClear(); _googleToken = null; agendaRenderLogin(); return; }
    const calList = listRes.ok ? await listRes.json() : { items: [] };
    const calIds  = [...new Set([DASHBOARD_CAL_ID, 'primary', ...(calList.items || []).map(c => c.id)])];

    const results = await Promise.all(calIds.map((id, i) =>
      fetchEventsForDay(id, start, end).then(evs =>
        evs.map(e => ({ ...e, _color: AGENDA_COLORS[i % AGENDA_COLORS.length] })))
    ));

    const seen = new Set();
    _agendaEvents = results.flat()
      .filter(e => { const k = e.id; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => new Date(a.start?.dateTime || a.start?.date) - new Date(b.start?.dateTime || b.start?.date));

// ── KPI: Drehtage diesen Monat (Stichwort „Shoot/Dreh" im Titel) ──
const SHOOT_RE = /shoot|dreh/i;
async function loadShoots() {
  const el  = document.getElementById('kpi-shoots-inner');
  const mEl = document.getElementById('kpi-shoots-month');
  const now = new Date();
  if (mEl) mEl.textContent = MONTHS[now.getMonth()].slice(0, 3) + '.';
  if (!el) return;
  if (!_googleToken) {
    el.innerHTML = `<div class="kpi-value">–</div><div class="kpi-sub">Google verbinden</div>`;
    return;
  }
  try {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end   = new Date(now.getFullYear(), now.getMonth() + 1, 0); end.setHours(23, 59, 59, 999);
    const listRes = await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
      { headers: { Authorization: 'Bearer ' + _googleToken } });
    const calList = listRes.ok ? await listRes.json() : { items: [] };
    const calIds  = [...new Set([DASHBOARD_CAL_ID, 'primary', ...(calList.items || []).map(c => c.id)])];
    const evs = (await Promise.all(calIds.map(id => fetchEventsForDay(id, start, end)))).flat();

    const seen = new Set();
    const shoots = evs.filter(e => {
      if (seen.has(e.id)) return false; seen.add(e.id);
      return SHOOT_RE.test(e.summary || '');
    });
    const days = new Set(shoots.map(e => {
      const d = e.start?.dateTime ? new Date(e.start.dateTime) : (e.start?.date ? new Date(e.start.date) : null);
      return d ? _agDateKey(d) : null;
    }).filter(Boolean));
    const count = days.size;

    const future = shoots
      .map(e => ({ s: new Date(e.start?.dateTime || e.start?.date) }))
      .filter(o => o.s >= now).sort((a, b) => a.s - b.s)[0];
    let sub = count === 0 ? 'keiner geplant' : (count === 1 ? '1 Drehtag' : count + ' Drehtage');
    if (future) {
      const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const d1 = new Date(future.s.getFullYear(), future.s.getMonth(), future.s.getDate());
      const diff = Math.round((d1 - d0) / 86400000);
      sub += diff <= 0 ? ' · heute' : diff === 1 ? ' · morgen' : ` · in ${diff} T`;
    }
    el.innerHTML = `<div class="kpi-value fade-in">${count}</div><div class="kpi-sub">${sub}</div>`;
  } catch (e) {
    console.error('Shoots:', e);
    el.innerHTML = `<div class="kpi-value">–</div>`;
  }
}

function agendaRender() {
  const body = document.getElementById('agenda-body');
  if (!body) return;
  const now = new Date();
  let html = '';

  for (let i = 0; i < AGENDA_DAYS; i++) {
    const d = new Date(now); d.setDate(now.getDate() + i); d.setHours(0, 0, 0, 0);
    const key = _agDateKey(d);

    const evs = _agendaEvents.filter(ev => {
      if (ev.start?.dateTime) return _agDateKey(new Date(ev.start.dateTime)) === key;
      return ev.start?.date === key;
    });

    const dayName = i === 0 ? 'Heute · ' + DAYS[d.getDay()]
                  : i === 1 ? 'Morgen · ' + DAYS[d.getDay()]
                  : DAYS[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()];
    const count = evs.length ? (evs.length === 1 ? '1 Termin' : evs.length + ' Termine') : '';

    const rows = evs.length ? evs.map(ev => {
      const allDay = !ev.start?.dateTime;
      const s  = allDay ? null : new Date(ev.start.dateTime);
      const e2 = ev.end?.dateTime ? new Date(ev.end.dateTime) : null;
      const time = allDay ? 'Ganztägig' : _agTime(s) + (e2 ? '–' + _agTime(e2) : '');
      const past = i === 0 && !allDay && ((e2 || s) < now);
      const shoot = /shoot|dreh/i.test(ev.summary || '');
      return `<div class="agenda-ev${past ? ' past' : ''}">
        <span class="agenda-ev-dot" style="background:${ev._color}"></span>
        <span class="agenda-ev-body">
          <span class="agenda-ev-title">${shoot ? '🎬 ' : ''}${esc(ev.summary || '(ohne Titel)')}</span>
          <span class="agenda-ev-time">${time}</span>
        </span>
      </div>`;
    }).join('') : '<div class="agenda-free">Frei</div>';

    html += `<div class="agenda-day">
      <div class="agenda-day-head">
        <span class="agenda-day-bubble${i === 0 ? ' today' : ''}">${d.getDate()}</span>
        <span class="agenda-day-name">${dayName}</span>
        <span class="agenda-day-count">${count}</span>
      </div>
      ${rows}
    </div>`;
  }
  body.innerHTML = html;
}

// "Als Nächstes"-Chip im Header — läuft gerade / startet in X
function agendaUpdateNext() {
  const el = document.getElementById('agenda-next');
  if (!el) return;
  const now = new Date();
  let running = null, next = null;
  for (const ev of _agendaEvents) {
    if (!ev.start?.dateTime) continue;
    const s = new Date(ev.start.dateTime);
    const e = ev.end?.dateTime ? new Date(ev.end.dateTime) : null;
    if (e && s <= now && now < e) { running = { ev, e }; break; }
    if (s > now) { next = { ev, s }; break; }
  }
  if (running) {
    el.innerHTML = `<span class="agenda-next-dot live"></span>${esc(running.ev.summary || 'Termin')} · noch ${_agDur(running.e - now)}`;
    el.style.display = '';
  } else if (next) {
    el.innerHTML = `<span class="agenda-next-dot"></span>${esc(next.ev.summary || 'Termin')} · in ${_agDur(next.s - now)}`;
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

function agendaRenderLogin() {
