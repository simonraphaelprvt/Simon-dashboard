<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard · Simon</title>
<!-- Google Identity Services für Gmail + Calendar OAuth -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<!-- Morning Report Slideshow -->
<link rel="stylesheet" href="morningReport.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:             #F2F2F7;
    --card:           #FFFFFF;
    --card-inner:     #F2F2F7;
    --text-primary:   #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary:  #C7C7CC;
    --border:         rgba(0,0,0,0.06);
    --shadow:         0 2px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
    --radius:         18px;
    --radius-sm:      13px;
    --accent-purple:  #5E5CE6;
    --accent-green:   #30D158;
    --accent-orange:  #FF9F0A;
    --accent-blue:    #0A84FF;
    --accent-red:     #FF453A;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Haupt-Grid ── */
  .screen {
    width: 100vw;
    height: 100dvh;
    padding: 20px;
    display: grid;
    grid-template-rows: 96px 1fr 90px;
    gap: 12px;
    overflow: hidden;
    position: relative;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* ─────────────────────────────────────
     ROW 1: Zeit + Spotify + Wetter
  ───────────────────────────────────── */
  .row-top {
    display: grid;
    grid-template-columns: 1fr 260px 148px;
    gap: 12px;
  }

  .card-time {
    padding: 16px 22px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .time-display {
    font-size: clamp(46px, 7vw, 66px);
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -2.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-date {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 5px;
    letter-spacing: -0.2px;
  }

  .card-weather {
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 2px;
  }

  .weather-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .weather-temp  { font-size: 36px; font-weight: 200; color: var(--text-primary); letter-spacing: -1.5px; line-height: 1; }
  .weather-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .weather-feel  { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .weather-city  { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  /* ─────────────────────────────────────
     ROW 2: Kalender + Pipeline
  ───────────────────────────────────── */
  .row-middle {
    display: grid;
    grid-template-columns: 1fr 298px;
    gap: 12px;
    min-height: 0;
  }

  /* Section-Header (wiederverwendbar) */
  .section-header {
    padding: 11px 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .section-badge {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  /* Kalender */
  .card-calendar {
    display: flex;
    flex-direction: column;
  }

  .calendar-iframe-wrap {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .calendar-iframe-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* ── Spotify Mini-Player ── */
  .card-spotify {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }
  .spotify-art {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: var(--card-inner) center/cover no-repeat;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .spotify-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .spotify-track {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.2px;
    line-height: 1.2;
  }
  .spotify-artist {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .spotify-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }
  .spotify-btn {
    background: none;
    border: none;
    padding: 3px;
    cursor: pointer;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  .spotify-btn:hover { color: var(--text-primary); background: var(--card-inner); }
  .spotify-btn:active { transform: scale(0.92); }
  .spotify-btn-play {
    color: var(--text-primary);
    background: var(--card-inner);
    width: 24px; height: 24px;
    border-radius: 50%;
  }
  .spotify-empty {
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text-tertiary);
    width: 100%;
    text-align: center;
  }
  .spotify-cta {
    background: #1DB954;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 6px 14px;
    font-size: 11.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.1px;
  }
  .spotify-cta:active { transform: scale(0.96); }

  /* Pipeline */
  .card-pipeline {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ── Morgen (Termine morgen) — unten in Pipeline-Spalte ── */
  .morgen-block {
    border-top: 0.5px solid var(--border);
    padding: 8px 12px 10px;
    flex-shrink: 0;
    max-height: 118px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .morgen-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .morgen-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .morgen-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 11.5px;
    line-height: 1.25;
  }
  .morgen-time {
    font-variant-numeric: tabular-nums;
    color: var(--text-tertiary);
    font-size: 10.5px;
    flex-shrink: 0;
    min-width: 40px;
  }
  .morgen-title {
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .morgen-empty {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 4px 0;
  }

  /* ── Heutiges Ziel Banner (in Fokus-Karte) ── */
  .ziel-banner {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-secondary);
    padding: 3px 8px;
    background: rgba(94, 92, 230, 0.08);
    border-radius: 8px;
    align-self: flex-start;
    margin-bottom: 2px;
    max-width: 100%;
  }
  .ziel-banner.show { display: inline-flex; }
  .ziel-banner-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-purple);
    flex-shrink: 0;
  }
  .ziel-banner-text {
    color: var(--text-primary);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Evening Goal Modal Overlay ── */
  .goal-modal {
    position: fixed;
    inset: 0;
    background: rgba(28, 28, 30, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .goal-modal.show { display: flex; }
  .goal-card {
    background: var(--card);
    border-radius: 22px;
    padding: 28px 26px 22px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: goalIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes goalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .goal-eyebrow {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .goal-title {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.25;
    margin-bottom: 16px;
  }
  .goal-input {
    width: 100%;
    background: var(--card-inner);
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    outline: none;
    margin-bottom: 14px;
  }
  .goal-input:focus { box-shadow: 0 0 0 2px var(--accent-purple); }
  .goal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .goal-btn {
    border: none;
    border-radius: 12px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .goal-btn-secondary {
    background: var(--card-inner);
    color: var(--text-secondary);
  }
  .goal-btn-primary {
    background: var(--accent-purple);
    color: #fff;
  }
  .goal-btn:active { transform: scale(0.97); }

  .pipeline-list {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 0;
    overflow: hidden;
  }

  .pipeline-item {
    background: var(--card-inner);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-height: 0;
  }

  .pipeline-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .pipeline-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .pipeline-date {
    font-size: 11px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .pipeline-status {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pipeline-action {
    font-size: 11.5px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .pipeline-amount {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent-purple);
    margin-top: 3px;
  }

  /* Fehler / leer Zustand */
  .state-msg {
    padding: 16px;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }

  /* ─────────────────────────────────────
     ROW 3: Fokus + Cashflow
  ───────────────────────────────────── */
  .row-bottom {
    display: grid;
    grid-template-columns: 1fr 175px 130px 200px;
    gap: 12px;
  }

  /* ── Gmail Widget ── */
  .card-gmail {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .gmail-count {
    font-size: 24px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -0.8px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .gmail-sub { font-size: 11px; color: var(--text-tertiary); }
  .gmail-login-btn {
    font-size: 11px;
    font-family: inherit;
    font-weight: 500;
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 5px 10px;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 2px;
  }

  /* ── Zoho Widget ── */
  .card-zoho {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .zoho-main {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zoho-amount {
    font-size: 18px;
    font-weight: 200;
    color: var(--accent-orange);
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .zoho-due {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-fokus {
    padding: 12px 20px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .fokus-text {
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-cashflow {
    padding: 12px 18px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .cashflow-row {
    display: flex;
    align-items: baseline;
    gap: 3px;
    margin-top: 2px;
  }

  .cashflow-value {
    font-size: 26px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .cashflow-sep {
    font-size: 16px;
    font-weight: 200;
    color: var(--text-tertiary);
  }

  .cashflow-goal {
    font-size: 16px;
    font-weight: 300;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .cashflow-sub {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .cashflow-bar-wrap {
    height: 3px;
    background: var(--card-inner);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }

  .cashflow-bar-fill {
    height: 100%;
    background: var(--accent-green);
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
  }

  /* ── Morning Report Button ── */
  .morning-btn {
    align-self: center;
    flex-shrink: 0;
    background: var(--accent-purple);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 15px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.12s;
    white-space: nowrap;
  }
  .morning-btn:active   { transform: scale(0.96); }
  .morning-btn:disabled { opacity: 0.5; cursor: default; }
  .morning-btn.speaking { background: var(--accent-red); }
  .morning-btn svg      { flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.85s linear infinite; }

  /* ─────────────────────────────────────
     Skeleton / Loading
  ───────────────────────────────────── */
  .skel {
    display: block;
    background: linear-gradient(90deg, #ebebf0 25%, #e2e2e8 50%, #ebebf0 75%);
    background-size: 300% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
    border-radius: 5px;
  }

  @keyframes shimmer {
    0%   { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  .weather-skel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 4px;
  }

  /* ─────────────────────────────────────
     Animationen
  ───────────────────────────────────── */
  .fade-in {
    animation: fadeIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="screen">

  <!-- ── ROW 1: Zeit + Wetter ── -->
  <div class="row-top">

    <div class="card card-time">
      <div>
        <div class="time-display" id="clock">00:00</div>
        <div class="time-date"    id="datestr">Laden…</div>
      </div>
      <button class="morning-btn" id="morning-btn" onclick="startMorningReport()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/>
          <line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/>
          <line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
          <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/>
          <line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/>
        </svg>
        Morning Report
      </button>
    </div>

    <div class="card card-spotify" id="spotify-card">
      <div class="spotify-empty" id="spotify-empty">
        <button class="spotify-cta" onclick="spotifyConnect()">Spotify verbinden</button>
      </div>
    </div>

    <div class="card card-weather" id="weather-card">
      <div class="weather-skel">
        <div>
          <span class="skel" style="width:28px;height:20px;margin-bottom:6px;"></span>
          <span class="skel" style="width:64px;height:34px;"></span>
        </div>
        <div>
          <span class="skel" style="width:80px;height:12px;margin-bottom:4px;"></span>
          <span class="skel" style="width:52px;height:11px;margin-bottom:2px;"></span>
          <span class="skel" style="width:44px;height:11px;"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── ROW 2: Kalender + Pipeline ── -->
  <div class="row-middle">

    <div class="card card-calendar">
      <div class="section-header">
        <span class="section-label">Kalender</span>
        <span class="section-badge" id="cal-date"></span>
      </div>
      <div class="calendar-iframe-wrap">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=simon-raphael.moser%40web.de&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=1&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%23FFFFFF&color=%235E5CE6"
          scrolling="no"
          allowtransparency="true">
        </iframe>
      </div>
    </div>

    <div class="card card-pipeline">
      <div class="section-header">
        <span class="section-label">Pipeline</span>
        <span class="section-badge" id="pipeline-badge"></span>
      </div>
      <div class="pipeline-list" id="pipeline-list">
        <!-- Skeleton -->
        <div class="pipeline-item">
          <span class="skel" style="width:72%;height:13px;"></span>
          <span class="skel" style="width:52%;height:12px;margin-top:5px;"></span>
          <span class="skel" style="width:84%;height:11px;margin-top:4px;"></span>
        </div>
        <div class="pipeline-item">
          <span class="skel" style="width:64%;height:13px;"></span>
          <span class="skel" style="width:44%;height:12px;margin-top:5px;"></span>
          <span class="skel" style="width:76%;height:11px;margin-top:4px;"></span>
        </div>
      </div>
      <div class="morgen-block">
        <div class="morgen-header">
          <span class="section-label">Morgen</span>
          <span class="section-badge" id="morgen-badge"></span>
        </div>
        <div class="morgen-list" id="morgen-list">
          <div class="morgen-empty">Lädt…</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── ROW 3: Fokus + Cashflow ── -->
  <div class="row-bottom">

    <div class="card card-fokus">
      <span class="section-label">Fokus heute</span>

// ── Hilfsfunktionen ───────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n, unit) {
  if (n === null || n === undefined || isNaN(Number(n))) return '—';
  const formatted = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(Number(n));
  return unit ? formatted + '\u202F' + unit : formatted;
}

// ── Notion Blocks API ────────────────────────────────────────
// Liest eine einfache Notion-Tabelle (type: "table") per Blocks API
async function notionGetBlocks(blockId) {
  const res = await fetch(`/api/notion?endpoint=blocks/${blockId}/children&page_size=50`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Parst Notion table_row Blöcke → Array von Objekten
// Erste Zeile wird als Header-Zeile behandelt
function parseNotionTable(data) {
  const rows = (data.results || []).filter(b => b.type === 'table_row');
  if (rows.length < 2) return [];
  const cellText = cells => (cells || []).map(t => t.plain_text || t.text?.content || '').join('').trim();
  const headers  = rows[0].table_row.cells.map(cellText);
  return rows.slice(1).map(row => {
    const obj = {};
    row.table_row.cells.forEach((cell, i) => { if (headers[i]) obj[headers[i]] = cellText(cell); });
    return obj;
  });
}

// Zahl aus deutschem Format: "1.000,50" → 1000.5, "1000" → 1000
function parseNum(s) {
  if (typeof s === 'number') return s;
  if (!s) return 0;
  const str = String(s).trim();
  // Deutsches Format: Punkt = Tausender, Komma = Dezimal
  if (/\d\.\d{3}/.test(str)) return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  // Englisches Format oder plain
  return parseFloat(str.replace(',', '.').replace(/[^0-9.-]/g, '')) || 0;
}

async function loadCashflow() {

      document.getElementById('cashflow-inner').innerHTML =

      const m = String(r['Monat'] || r['Month'] || r['Name'] || '').toLowerCase();
      return m.includes(curMonthName) || m.includes(curMonthNum);

    const einnahmen = parseNum(entry['Einnahmen'] || entry['Revenue'] || 0);
    const ziel      = parseNum(entry['Ziel']      || entry['Goal']    || 0);

    document.getElementById('cashflow-inner').innerHTML = `

    console.error('Cashflow:', err);
    document.getElementById('cashflow-inner').innerHTML =
      '<div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Nicht verfügbar</div>';

let _googleToken = null;

async function gmailLoad() {
  // 1. Gespeicherter Token vorhanden?
  const stored = gmailTokenLoad();

    _googleToken = stored;
    try {
      gmailRenderCount(await gmailFetch(stored));
      morgenLoad();
      return;
    } catch (e) { if (e.status === 401) { gmailTokenClear(); _googleToken = null; } }
  }
  // 2. Stilles Re-Auth versuchen (funktioniert wenn bereits autorisiert)
  if (window.google?.accounts?.oauth2) {
    const token = await new Promise(resolve => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => {
          if (r.access_token) { gmailTokenSave(r.access_token, r.expires_in); resolve(r.access_token); }
          else resolve(null);
        },
      });
      client.requestAccessToken({ prompt: 'none' });
      setTimeout(() => resolve(null), 4000);
    });
    if (token) {
      _googleToken = token;
      try {
        gmailRenderCount(await gmailFetch(token));
        morgenLoad();
        return;
      } catch { gmailTokenClear(); _googleToken = null; }
    }
  }
  // 3. Login-Button anzeigen
  gmailRenderLogin();
  morgenRenderLoginHint();
}

function gmailLogin() {
  if (!window.google?.accounts?.oauth2) { gmailRenderError(); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: GMAIL_CLIENT_ID,
    scope: GMAIL_SCOPE,
    callback: async r => {
      if (!r.access_token) { gmailRenderError(); return; }
      gmailTokenSave(r.access_token, r.expires_in);
      _googleToken = r.access_token;
      try { gmailRenderCount(await gmailFetch(r.access_token)); }
      catch { gmailRenderError(); }
      morgenLoad();
    },
  }).requestAccessToken({ prompt: 'consent' });
}

async function zohoGetToken() {
  if (_zohoToken && Date.now() < _zohoExpiry) return _zohoToken;
  const r = await fetch('/api/zoho', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'refresh', refreshToken: ZOHO_REFRESH_TOKEN }),
  });
  if (!r.ok) throw new Error(`Token HTTP ${r.status}`);
  const d = await r.json();
  if (!d.access_token) throw new Error(d.error || 'Kein Zoho-Token');
  _zohoToken  = d.access_token;
  _zohoExpiry = Date.now() + (d.expires_in || 3600) * 1000 - 60_000;
  return _zohoToken;
}

function collectDashboardData() {
  const pipelineItems = Array.from(document.querySelectorAll('.pipeline-item'))
    .map(el => el.innerText.replace(/\n+/g, ' · ').trim())
    .filter(Boolean);
  return {
    time:     document.getElementById('clock')?.textContent?.trim() || '',
    date:     document.getElementById('datestr')?.textContent?.trim() || '',
    weather:  document.getElementById('weather-card')?.innerText?.trim() || '',
    fokus:    document.getElementById('fokus-text')?.innerText?.trim() || '',
    pipeline: pipelineItems,
    cashflow: document.getElementById('cashflow-inner')?.innerText?.replace(/\n+/g, ' ').trim() || '',
  };
}

function buildMorningText(d) {
  const now      = new Date();
  const hour     = now.getHours();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);

  const wochentag  = d.date.split(',')[0]?.trim() || 'Heute';
  const datumKurz  = d.date.split(', ').slice(1).join(', ').replace(/\s+\d{4}$/, '') || d.date;
  const greet      = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';
  const morgenTag  = DAYS[tomorrow.getDay()];

  const parts = [];

  // 1. Begrüßung
  parts.push(`${greet}, Simon! Es ist ${d.time} Uhr, ${wochentag} der ${datumKurz}.`);

  // 2. Wetter — Zeilen bereinigen, Emoji-Zeilen rausfiltern
  const wLines = d.weather.split('\n')
    .map(s => s.trim())
    .filter(s => s && s.length > 1 && !/^\p{Emoji_Presentation}$/u.test(s));
  const wTemp  = wLines.find(s => /^\d+°$/.test(s) || s.match(/^\d+°$/));
  const wDesc  = wLines.find(s => !/\d/.test(s) && !s.includes('Laubach') && !s.includes('Fühlt') && s.length > 3);
  const wFeels = wLines.find(s => s.includes('Fühlt'));
  if (wDesc || wTemp) {
    let w = 'Draußen in Laubach';
    if (wTemp) w += ` sind es ${wTemp}`;
    if (wDesc) w += `, ${wDesc.toLowerCase()}`;
    if (wFeels) w += `, ${wFeels.toLowerCase().replace('fühlt:', 'gefühlt').replace('fühlt: ', 'gefühlt ')}`;
    parts.push(w + '.');
  }

  // 3. Fokus
  const fokus = d.fokus.replace(/\n.*/s, '').trim();
  const fokusLeer = !fokus || ['—', 'Kein Fokus', 'Nicht verfügbar', 'Kein Fokus eingetragen'].some(s => fokus.includes(s));
  if (!fokusLeer) {
    parts.push(`Dein Fokus für heute: ${fokus}.`);
  } else {
    parts.push('Für heute ist noch kein Fokus eingetragen.');
  }

  // 4. Pipeline
  const leads = d.pipeline.filter(l => !l.includes('Nicht verfügbar'));
  if (leads.length) {
    const firstName = leads[0].split(' · ')[0].trim();
    if (leads.length === 1) {
      parts.push(`In deiner Pipeline läuft gerade ein aktiver Lead: ${firstName}.`);
    } else {
      const others = leads.slice(1).map(l => l.split(' · ')[0].trim());
      const list   = others.length === 1
        ? `${firstName} und ${others[0]}`
        : `${firstName}, ${others.slice(0, -1).join(', ')} und ${others.at(-1)}`;
      parts.push(`Du hast ${leads.length} aktive Leads in der Pipeline: ${list}.`);
    }
  }

  // 5. Cashflow
  const cfClean = d.cashflow.replace(/\s+/g, ' ').trim();
  const cfLeer  = !cfClean || ['Keine Daten', 'Nicht verfügbar'].some(s => cfClean.includes(s));
  if (!cfLeer) {
    // Nur Zahlen extrahieren: "400 / 1.000 € 40 % des Ziels" → lesbar machen
    const match = cfClean.match(/([\d.,]+)\s*\/\s*([\d.,]+)\s*€/);
    if (match) {
      parts.push(`Beim Cashflow stehst du diesen Monat bei ${match[1]} von ${match[2]} Euro Ziel.`);
    } else {
      parts.push(`Zum Cashflow: ${cfClean.split('\n')[0]}.`);
    }
  }

  // 6. Abschluss
  const closings = [
    `Morgen ist ${morgenTag} — noch ist heute, pack es an!`,
    `Einen produktiven ${wochentag} dir, mach was draus!`,
    `Morgen erwartet dich schon der ${morgenTag}, also nutze den heutigen Tag.`,
  ];
  parts.push(closings[now.getMinutes() % closings.length]);

  return parts.join(' ');
}

function setBtn(state) {
  const btn = document.getElementById('morning-btn');
  btn.classList.remove('speaking');
  switch (state) {
    case 'idle':
      btn.disabled = false;
      btn.innerHTML = SVG_SUN + ' Morning Report';
      btn.onclick = startMorningReport;
      break;
    case 'loading':
      btn.disabled = true;
      btn.innerHTML = SVG_SPIN + ' Lädt…';
      break;
    case 'speaking':
      btn.classList.add('speaking');
      btn.disabled = false;
      btn.innerHTML = SVG_STOP + ' Stop';
      btn.onclick = () => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
        setBtn('idle');
      };
      break;
  }
}

function startMorningReport() {
  // Daten aus dem aktuellen Dashboard-Zustand sammeln
  const now     = new Date();
  const data = {
    time:    document.getElementById('clock')?.textContent?.trim() || '',
    weekday: DAYS[now.getDay()],
    date:    now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear(),
    events:  window._mrEvents || [],
    leads:   window._mrLeads  || [],
    focus:   document.getElementById('fokus-text')?.innerText?.replace(/\n.*/s,'').trim() || '',
  };
  // Neues Fullscreen-Slideshow-Overlay starten (morningReport.js)
  if (typeof window.startMorningReportOverlay === 'function') {
    window.startMorningReportOverlay(data);
  }
}

async function _legacyTtsReport() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  setBtn('loading');

  const text = buildMorningText(collectDashboardData());

  try {
    const res = await fetch(
      `https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_TTS_KEY}`,
      {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input:       { text },
          voice:       { languageCode: 'de-DE', name: 'de-DE-Wavenet-F' },
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.95, pitch: 0 },
        }),
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const { audioContent } = await res.json();
    if (!audioContent) throw new Error('Keine Audio-Daten erhalten');

    currentAudio = new Audio('data:audio/mpeg;base64,' + audioContent);
    currentAudio.onended = () => { currentAudio = null; setBtn('idle'); };
    currentAudio.onerror = () => { currentAudio = null; setBtn('idle'); };

    setBtn('speaking');
    spotifyDuck(true);
    currentAudio.addEventListener('ended', () => spotifyDuck(false));
    currentAudio.addEventListener('pause', () => spotifyDuck(false));
    await currentAudio.play();

  } catch (err) {
    console.error('TTS Fehler:', err);
    currentAudio = null;
    spotifyDuck(false);
    setBtn('idle');
    alert('Sprachausgabe fehlgeschlagen: ' + err.message);
  }
}

// ═════════════════════════════════════════════════════════════
// SPOTIFY INTEGRATION (PKCE OAuth + Web Playback SDK)
// ═════════════════════════════════════════════════════════════
// Setup:
// 1. https://developer.spotify.com/dashboard → Create App
// 2. Redirect URI = exakt diese Dashboard-URL (z.B. https://simon-dashboard-omega.vercel.app/)
// 3. Client ID + Playlist-URI hier eintragen
// 4. Spotify Premium-Konto erforderlich für Web Playback SDK
// ─────────────────────────────────────────────────────────────
const SPOTIFY_CLIENT_ID    = 'e8a56cb4bfa242e1a8f9b2ba8b7cab68';
const SPOTIFY_PLAYLIST_URI = 'spotify:playlist:37i9dQZF1EIfeeY1Nyg89M';
const SPOTIFY_VOLUME_NORMAL = 0.25;  // 25 %
const SPOTIFY_VOLUME_DUCK   = 0.10;  // 10 % während TTS
const SPOTIFY_SCOPE = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
const SPOTIFY_REDIRECT_URI = 'https://simon-dashboard-omega.vercel.app/';

let _spotifyPlayer    = null;
let _spotifyDeviceId  = null;
let _spotifyToken     = null;
let _spotifyDucking   = false;
let _spotifyAutoStarted = false;

// ── PKCE Helpers ──
function spRand(len = 64) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b % 62]).join('');
}
async function spChallenge(verifier) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// ── Token-Storage ──
function spTokenLoad() {
  try {
    const d = JSON.parse(localStorage.getItem('spotify_token') || 'null');
    if (d && Date.now() < d.expires) return d;
    return d; // ggf. expired → refresh
  } catch { return null; }
}
function spTokenSave(token, refresh, expiresIn) {
  localStorage.setItem('spotify_token', JSON.stringify({
    token, refresh,
    expires: Date.now() + (expiresIn || 3600) * 1000 - 60_000,
  }));
}
function spTokenClear() { localStorage.removeItem('spotify_token'); }

// ── OAuth Flow ──
async function spotifyConnect() {
  if (SPOTIFY_CLIENT_ID === 'DEINE_SPOTIFY_CLIENT_ID') {
    alert('Bitte SPOTIFY_CLIENT_ID in index.html eintragen.');
    return;
  }
  const verifier  = spRand(80);
  const challenge = await spChallenge(verifier);
  sessionStorage.setItem('spotify_verifier', verifier);
  const params = new URLSearchParams({
    client_id:             SPOTIFY_CLIENT_ID,
    response_type:         'code',
    redirect_uri:          SPOTIFY_REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge:        challenge,
    scope:                 SPOTIFY_SCOPE,
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params}`;
}

async function spotifyHandleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  if (!code) return null;
  const verifier = sessionStorage.getItem('spotify_verifier');
  if (!verifier) return null;
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id:     SPOTIFY_CLIENT_ID,
        grant_type:    'authorization_code',
        code,
        redirect_uri:  SPOTIFY_REDIRECT_URI,
        code_verifier: verifier,
      }),
    });
    const d = await r.json();
    if (d.access_token) {
      spTokenSave(d.access_token, d.refresh_token, d.expires_in);
      sessionStorage.removeItem('spotify_verifier');
      // URL säubern
      window.history.replaceState(null, '', window.location.pathname);
      return d.access_token;
    }
  } catch (e) { console.error('Spotify token exchange:', e); }
  return null;
}

async function spotifyRefresh(refreshToken) {
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id:     SPOTIFY_CLIENT_ID,
        grant_type:    'refresh_token',
        refresh_token: refreshToken,
      }),
    });
    const d = await r.json();
    if (d.access_token) {
      spTokenSave(d.access_token, d.refresh_token || refreshToken, d.expires_in);
      return d.access_token;
    }
  } catch (e) { console.error('Spotify refresh:', e); }
  return null;
}

async function spotifyEnsureToken() {
  const stored = spTokenLoad();
  if (!stored) return null;
  if (Date.now() < stored.expires) return stored.token;
  if (stored.refresh) return await spotifyRefresh(stored.refresh);
  return null;
}

// ── Web Playback SDK ──
window.onSpotifyWebPlaybackSDKReady = async () => {
  // Erst Redirect verarbeiten
  await spotifyHandleRedirect();
  const token = await spotifyEnsureToken();
  if (!token) { spotifyRenderEmpty(); return; }
  _spotifyToken = token;
  spotifyInitPlayer();
};

function spotifyInitPlayer() {
  _spotifyPlayer = new Spotify.Player({
    name: 'Simon Dashboard',
    getOAuthToken: cb => spotifyEnsureToken().then(t => { _spotifyToken = t; cb(t); }),
    volume: SPOTIFY_VOLUME_NORMAL,
  });

  _spotifyPlayer.addListener('ready', ({ device_id }) => {
    _spotifyDeviceId = device_id;
    spotifyRenderState({ paused: true, track_window: { current_track: null } });
    // Bei erstem User-Click Auto-Start
    document.addEventListener('pointerdown', spotifyAutoStart, { once: true });
  });

  _spotifyPlayer.addListener('not_ready', () => {
    _spotifyDeviceId = null;
  });

  _spotifyPlayer.addListener('player_state_changed', state => {
    if (state) spotifyRenderState(state);
  });

  _spotifyPlayer.addListener('authentication_error', async () => {
    spTokenClear();
    spotifyRenderEmpty();
  });

  _spotifyPlayer.addListener('initialization_error', e => console.error('Spotify init:', e));
  _spotifyPlayer.addListener('account_error', () => {
    spotifyRenderError('Spotify Premium erforderlich');
  });

  _spotifyPlayer.connect();
}

async function spotifyAutoStart() {
  if (_spotifyAutoStarted) return;
  _spotifyAutoStarted = true;
  if (!_spotifyDeviceId || !_spotifyToken) return;
  // Transfer + Play
  try {
    await fetch('https://api.spotify.com/v1/me/player', {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + _spotifyToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_ids: [_spotifyDeviceId], play: false }),
    });
    await new Promise(r => setTimeout(r, 400));
    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${_spotifyDeviceId}`, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + _spotifyToken, 'Content-Type': 'application/json' },
      body: JSON.stringify({ context_uri: SPOTIFY_PLAYLIST_URI }),
    });
    if (_spotifyPlayer) _spotifyPlayer.setVolume(SPOTIFY_VOLUME_NORMAL);
  } catch (e) { console.error('Spotify autostart:', e); }
}

  const playing = !state.paused && track;
  const playIcon = playing
    ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
    : `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>`;

          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="spotify-btn spotify-btn-play" onclick="spotifyToggle()" aria-label="Play">${playIcon}</button>
        <button class="spotify-btn" onclick="spotifyNext()" aria-label="Nächster">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
    </div>`;
}

async function spotifyToggle() {
  if (!_spotifyPlayer) return;
  const state = await _spotifyPlayer.getCurrentState();
  if (!state || !state.track_window?.current_track) {
    // Noch nichts geladen → Playlist starten
    spotifyAutoStart();
    return;
  }
  _spotifyPlayer.togglePlay();
}
function spotifyPrev() { _spotifyPlayer?.previousTrack(); }
function spotifyNext() { _spotifyPlayer?.nextTrack(); }

function spotifyDuck(on) {
  if (!_spotifyPlayer) return;
  _spotifyDucking = on;
  _spotifyPlayer.setVolume(on ? SPOTIFY_VOLUME_DUCK : SPOTIFY_VOLUME_NORMAL).catch(() => {});
}

setTimeout(() => {

  }
}, 5000);

// TOMORROW'S GOAL (Abend-Prompt + Morgens-Banner)
// ═════════════════════════════════════════════════════════════
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function goalKey(d) { return 'goal_for_' + dateKey(d); }

function goalCheckEvening() {
  const now = new Date();
  const hour = now.getHours();
  // Zwischen 20:00 und 23:59 — und nur einmal pro Abend
  if (hour < 20 || hour > 23) return;

  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  const key = goalKey(tomorrow);

  // Wenn heute schon gespeichert oder geskipped → nicht erneut zeigen
  if (localStorage.getItem(key) !== null) return;
  // Nicht erneut zeigen, wenn Modal bereits offen
  if (document.getElementById('goal-modal').classList.contains('show')) return;

  goalShowModal(tomorrow);
}

function goalShowModal(tomorrow) {
  document.getElementById('goal-modal-day').textContent = DAYS[tomorrow.getDay()];
  document.getElementById('goal-input').value = '';
  document.getElementById('goal-modal').classList.add('show');
  setTimeout(() => document.getElementById('goal-input').focus(), 200);
}

function goalSave() {
  const val = document.getElementById('goal-input').value.trim();
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (val) localStorage.setItem(goalKey(tomorrow), val);
  else     localStorage.setItem(goalKey(tomorrow), ''); // leer = bewusst übersprungen
  document.getElementById('goal-modal').classList.remove('show');
  goalRenderToday();
}

function goalSkip() {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  // Markieren als "heute nicht mehr fragen", aber leer lassen
  localStorage.setItem(goalKey(tomorrow), '');
  document.getElementById('goal-modal').classList.remove('show');
}

function goalRenderToday() {
  const today = new Date();
  const stored = localStorage.getItem(goalKey(today));
  const banner = document.getElementById('ziel-banner');
  if (stored && stored.trim()) {
    document.getElementById('ziel-banner-text').textContent = stored;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

// Initial + jede Minute prüfen
goalRenderToday();
goalCheckEvening();
setInterval(() => {
  goalCheckEvening();
  goalRenderToday(); // nach Mitternacht aktualisiert sich der Banner
}, 60_000);

// ═════════════════════════════════════════════════════════════
// CALENDAR — TERMINE MORGEN
// ═════════════════════════════════════════════════════════════
// Hilfsfunktion: Events aus einem einzelnen Kalender holen
async function fetchEventsForDay(calId, start, end) {
  try {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?`
      + `timeMin=${encodeURIComponent(start.toISOString())}`
      + `&timeMax=${encodeURIComponent(end.toISOString())}`
      + `&singleEvents=true&orderBy=startTime&maxResults=30`;
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + _googleToken } });
    if (!r.ok) return [];
    const d = await r.json();
    return d.items || [];
  } catch { return []; }
}

async function todayLoad() {
  if (!_googleToken) return;
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end   = new Date(); end.setHours(23, 59, 59, 999);

    // Alle Kalender des Users abrufen, dann parallel Events holen
    const listRes = await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
      { headers: { Authorization: 'Bearer ' + _googleToken } }
    );
    const calList = listRes.ok ? await listRes.json() : { items: [{ id: 'primary' }] };
    const calIds  = (calList.items || [{ id: 'primary' }]).map(c => c.id);

    const allEvents = (await Promise.all(calIds.map(id => fetchEventsForDay(id, start, end)))).flat();

    // Sortieren + deduplizieren (nach eventId)
    const seen = new Set();
    const sorted = allEvents
      .filter(ev => { const k = ev.id; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => new Date(a.start?.dateTime || a.start?.date) - new Date(b.start?.dateTime || b.start?.date));

    window._mrEvents = sorted.map(ev => ({
      time:  ev.start?.dateTime
        ? new Date(ev.start.dateTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
        : 'Ganztags',
      title: ev.summary || '(ohne Titel)',
    }));
  } catch { /* ignorieren */ }
}

async function morgenLoad() {
  if (!_googleToken) { morgenRenderLoginHint(); return; }
  todayLoad(); // Heute-Termine für Morning Report parallel laden
  try {
    const start = new Date();
    start.setDate(start.getDate() + 1);
    start.setHours(0, 0, 0, 0);
    const end = new Date(start);
    end.setHours(23, 59, 59, 999);

    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?`
      + `timeMin=${encodeURIComponent(start.toISOString())}`
      + `&timeMax=${encodeURIComponent(end.toISOString())}`
      + `&singleEvents=true&orderBy=startTime&maxResults=10`;

    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + _googleToken } });
    if (r.status === 401) { gmailTokenClear(); _googleToken = null; morgenRenderLoginHint(); return; }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    morgenRender(d.items || []);
  } catch (e) {
    console.error('Morgen:', e);
    document.getElementById('morgen-list').innerHTML =
      '<div class="morgen-empty">Nicht verfügbar</div>';
  }
}

function morgenRender(items) {
  const badge = document.getElementById('morgen-badge');
  const list  = document.getElementById('morgen-list');
  if (!items.length) {
    badge.textContent = '';
    list.innerHTML = '<div class="morgen-empty">Frei</div>';
    return;
  }
  badge.textContent = items.length === 1 ? '1 Termin' : items.length + ' Termine';
  const visible = items.slice(0, 3);
  const more    = items.length - visible.length;
  list.innerHTML = visible.map(ev => {
    const time = ev.start?.dateTime
      ? new Date(ev.start.dateTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
      : 'Ganztags';
    const title = ev.summary || '(ohne Titel)';
    return `<div class="morgen-item"><span class="morgen-time">${time}</span><span class="morgen-title">${esc(title)}</span></div>`;
  }).join('') + (more > 0 ? `<div class="morgen-empty">+${more} weitere</div>` : '');
}

function morgenRenderLoginHint() {
  document.getElementById('morgen-list').innerHTML =
    '<div class="morgen-empty">Mit Gmail anmelden, um Termine zu sehen</div>';
}

// Aktualisiere Morgen-Termine alle 15 Min
setInterval(() => { if (_googleToken) morgenLoad(); }, 15 * 60_000);
