<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard · Simon</title>
<!-- Google Identity Services für Gmail + Calendar OAuth -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Morning Report Slideshow -->
<link rel="stylesheet" href="morningReport.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:             #F2F2F7;
    --card:           #FFFFFF;
    --card-inner:     #F2F2F7;
    --text-primary:   #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary:  #C7C7CC;
    --border:         rgba(0,0,0,0.06);
    --shadow:         0 2px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
    --radius:         18px;
    --radius-sm:      13px;
    --accent-purple:  #5E5CE6;
    --accent-green:   #30D158;
    --accent-orange:  #FF9F0A;
    --accent-blue:    #0A84FF;
    --accent-red:     #FF453A;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Haupt-Grid ── */
  .screen {
    width: 100vw;
    height: 100dvh;
    padding: 20px;
    display: grid;
    grid-template-rows: 96px 1fr 90px;
    gap: 12px;
    overflow: hidden;
    position: relative;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* ─────────────────────────────────────
     ROW 1: Zeit + Wetter
  ───────────────────────────────────── */
  .row-top {
    display: grid;
    grid-template-columns: 1fr 148px;
    gap: 12px;
  }

  .card-time {
    padding: 16px 22px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .time-display {
    font-size: clamp(46px, 7vw, 66px);
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -2.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-date {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 5px;
    letter-spacing: -0.2px;
  }

  .card-weather {
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 2px;
  }

  .weather-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .weather-temp  { font-size: 36px; font-weight: 200; color: var(--text-primary); letter-spacing: -1.5px; line-height: 1; }
  .weather-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .weather-feel  { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .weather-city  { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  /* ─────────────────────────────────────
     ROW 2: Kalender + Pipeline
  ───────────────────────────────────── */
  .row-middle {
    display: grid;
    grid-template-columns: 1fr 298px;
    gap: 12px;
    min-height: 0;
  }

  /* Section-Header (wiederverwendbar) */
  .section-header {
    padding: 11px 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .section-badge {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  /* Kalender */
  .card-calendar {
    display: flex;
    flex-direction: column;
  }

  .calendar-iframe-wrap {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .calendar-iframe-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Pipeline */
  .card-pipeline {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ── Morgen (Termine morgen) — unten in Pipeline-Spalte ── */
  .morgen-block {
    border-top: 0.5px solid var(--border);
    padding: 8px 12px 10px;
    flex-shrink: 0;
    max-height: 118px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .morgen-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .morgen-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .morgen-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 11.5px;
    line-height: 1.25;
  }
  .morgen-time {
    font-variant-numeric: tabular-nums;
    color: var(--text-tertiary);
    font-size: 10.5px;
    flex-shrink: 0;
    min-width: 40px;
  }
  .morgen-title {
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .morgen-empty {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 4px 0;
  }

  /* ── Heutiges Ziel Banner (in Fokus-Karte) ── */
  .ziel-banner {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-secondary);
    padding: 3px 8px;
    background: rgba(94, 92, 230, 0.08);
    border-radius: 8px;
    align-self: flex-start;
    margin-bottom: 2px;
    max-width: 100%;
  }
  .ziel-banner.show { display: inline-flex; }
  .ziel-banner-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-purple);
    flex-shrink: 0;
  }
  .ziel-banner-text {
    color: var(--text-primary);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Evening Goal Modal Overlay ── */
  .goal-modal {
    position: fixed;
    inset: 0;
    background: rgba(28, 28, 30, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .goal-modal.show { display: flex; }
  .goal-card {
    background: var(--card);
    border-radius: 22px;
    padding: 28px 26px 22px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: goalIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes goalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .goal-eyebrow {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .goal-title {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.25;
    margin-bottom: 16px;
  }
  .goal-input {
    width: 100%;
    background: var(--card-inner);
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    outline: none;
    margin-bottom: 14px;
  }
  .goal-input:focus { box-shadow: 0 0 0 2px var(--accent-purple); }
  .goal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .goal-btn {
    border: none;
    border-radius: 12px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .goal-btn-secondary {
    background: var(--card-inner);
    color: var(--text-secondary);
  }
  .goal-btn-primary {
    background: var(--accent-purple);
    color: #fff;
  }
  .goal-btn:active { transform: scale(0.97); }

  .pipeline-list {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 0;
    overflow: hidden;
  }

  .pipeline-item {
    background: var(--card-inner);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-height: 0;
  }

  .pipeline-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .pipeline-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .pipeline-date {
    font-size: 11px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .pipeline-status {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pipeline-action {
    font-size: 11.5px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .pipeline-amount {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent-purple);
    margin-top: 3px;
  }

  /* Fehler / leer Zustand */
  .state-msg {
    padding: 16px;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }

  /* ─────────────────────────────────────
     ROW 3: Fokus + Cashflow
  ───────────────────────────────────── */
  .row-bottom {
    display: grid;
    grid-template-columns: 1fr 175px 130px 200px;
    gap: 12px;
  }

  /* ── Gmail Widget ── */
  .card-gmail {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .gmail-count {
    font-size: 24px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -0.8px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .gmail-sub { font-size: 11px; color: var(--text-tertiary); }
  .gmail-login-btn {
    font-size: 11px;
    font-family: inherit;
    font-weight: 500;
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 5px 10px;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 2px;
  }

  /* ── Zoho Widget ── */
  .card-zoho {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .zoho-main {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zoho-amount {
    font-size: 18px;
    font-weight: 200;
    color: var(--accent-orange);
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .zoho-due {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-fokus {
    padding: 12px 20px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .fokus-text {
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-cashflow {
    padding: 12px 18px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .cashflow-row {
    display: flex;
    align-items: baseline;
    gap: 3px;
    margin-top: 2px;
  }

  .cashflow-value {
    font-size: 26px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .cashflow-sep {
    font-size: 16px;
    font-weight: 200;
    color: var(--text-tertiary);
  }

  .cashflow-goal {
    font-size: 16px;
    font-weight: 300;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .cashflow-sub {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .cashflow-bar-wrap {
    height: 3px;
    background: var(--card-inner);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }

  .cashflow-bar-fill {
    height: 100%;
    background: var(--accent-green);
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
  }

  /* ── Morning Report Button ── */
  .morning-btn {
    align-self: center;
    flex-shrink: 0;
    background: var(--accent-purple);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 15px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.12s;
    white-space: nowrap;
  }
  .morning-btn:active   { transform: scale(0.96); }
  .morning-btn:disabled { opacity: 0.5; cursor: default; }
  .morning-btn.speaking { background: var(--accent-red); }
  .morning-btn svg      { flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.85s linear infinite; }

  /* ─────────────────────────────────────
     Skeleton / Loading
  ───────────────────────────────────── */
  .skel {
    display: block;
    background: linear-gradient(90deg, #ebebf0 25%, #e2e2e8 50%, #ebebf0 75%);
    background-size: 300% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
    border-radius: 5px;
  }

  @keyframes shimmer {
    0%   { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  .weather-skel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 4px;
  }

  /* ─────────────────────────────────────
     Animationen
  ───────────────────────────────────── */
  .fade-in {
    animation: fadeIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }


  /* ═══════════════════════════════════════════════════════════════
     PRIVATE SCREEN — VARS + CONTAINER
  ═══════════════════════════════════════════════════════════════ */
  :root {
    --pb:  #FAF6EF;
    --pc:  #FFFDF8;
    --pb2: rgba(180,145,100,0.15);
    --ps:  0 2px 18px rgba(150,100,50,0.07), 0 1px 4px rgba(150,100,50,0.04);
    --pt:  #3A2E24;
    --pt2: #8C7B6B;
    --pt3: #C4B09A;
    --pa:  #C4713A;
    --pg:  #5B8A52;
    --pg2: #AEDD9C;
    --pg3: #2D5A27;
    --phn: #E0D8CD;
  }

  #screen-private {
    position: fixed;
    inset: 0;
    z-index: 9000;
    background: var(--pb);
    overflow-y: auto;
    padding: 20px;
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    color: var(--pt);
    -webkit-font-smoothing: antialiased;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
    -webkit-user-select: none;
  }
  #screen-private.active { opacity: 1; pointer-events: auto; }

  .priv-layout {
    display: grid;
    grid-template-columns: 1fr 350px;
    grid-template-rows: auto 1fr;
    gap: 14px;
    min-height: calc(100dvh - 40px);
  }
  .priv-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 4px 0 2px;
  }
  .priv-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--pt);
    letter-spacing: -0.03em;
  }
  .priv-date-label { font-size: 13px; color: var(--pt2); font-weight: 400; }

  .priv-col-left  { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .priv-col-right { display: flex; flex-direction: column; gap: 14px; }

  .priv-card {
    background: var(--pc);
    border-radius: var(--radius);
    border: 0.5px solid var(--pb2);
    box-shadow: var(--ps);
    padding: 17px 19px;
  }
  .priv-card-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--pt2);
    margin-bottom: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ── Habit Check List ── */
  .habit-check-list { display: flex; flex-direction: column; gap: 1px; }
  .habit-row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 8px;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .habit-row:active { background: rgba(180,145,100,0.08); }
  .habit-check {
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 1.5px solid rgba(180,145,100,0.35);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .habit-check.done { background: var(--pg); border-color: var(--pg); }
  .habit-check.done::after {
    content: '';
    display: block;
    width: 11px; height: 7px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--pt);
    letter-spacing: -0.01em;
  }
  .habit-name.placeholder { color: var(--pt3); font-style: italic; }
  .habit-goal-label { font-size: 10.5px; color: var(--pt3); margin-top: 1px; }
  .habit-streak-col { text-align: right; flex-shrink: 0; }
  .habit-streak-val { font-size: 13px; font-weight: 600; color: var(--pa); }
  .habit-streak-rec { font-size: 10px; color: var(--pt3); margin-top: 1px; }

  /* 30-Day mini heatmap */
  .habit-hmap-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--pb2);
  }
  .habit-hmap-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pt3);
    margin-bottom: 9px;
  }
  .habit-hmap-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .habit-hmap-lbl {
    font-size: 9px;
    font-weight: 600;
    color: var(--pt3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    width: 30px;
    flex-shrink: 0;
  }
  .habit-hmap-dots { display: flex; gap: 2.5px; }
  .habit-hmap-dot {
    width: 7px; height: 7px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ── Italian Heatmap ── */
  .ita-log-btn {
    font-size: 9.5px;
    font-weight: 600;
    color: var(--pa);
    cursor: pointer;
    padding: 3px 9px;
    border-radius: 6px;
    border: 1px solid rgba(196,113,58,0.3);
    background: transparent;
    font-family: inherit;
    letter-spacing: 0.02em;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ita-log-btn:active { background: rgba(196,113,58,0.1); }
  .ita-grid { display: flex; gap: 3px; margin-bottom: 8px; }
  .ita-col  { display: flex; flex-direction: column; gap: 3px; }
  .ita-cell {
    width: 11px; height: 11px;
    border-radius: 2.5px;
    cursor: pointer;
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .ita-cell:active { transform: scale(1.35); }
  .ita-cell.ita-today { outline: 2px solid var(--pa); outline-offset: 1.5px; }
  .ita-month-labels { display: flex; gap: 3px; margin-bottom: 4px; }
  .ita-month-span { font-size: 8.5px; color: var(--pt3); white-space: nowrap; overflow: hidden; }
  .ita-legend {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 9.5px;
    color: var(--pt3);
    flex-wrap: wrap;
  }
  .ita-leg-dot {

<script>
'use strict';

// ── Konstanten ────────────────────────────────────────────────
const WEATHER_KEY = '1f71b21255f6c1acd98a8f8406770053';
const WEATHER_CITY = 'Laubach,DE';

// Echte Table-Block-IDs (aus /api/notion?debug= ermittelt)
const TABLE = {
  pipeline: '9971f418-7f5f-4989-b815-c971bb65215a',
  fokus:    'e7ca1761-15c1-4791-84af-1c3320cec475',
  cashflow: 'ffae9691-2a24-4c15-87c1-41cda34db9fd',
};

const DAYS   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const WEATHER_ICONS = {
  '01d':'☀️','01n':'🌙','02d':'⛅️','02n':'⛅️',
  '03d':'☁️','03n':'☁️','04d':'☁️','04n':'☁️',
  '09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧',
  '11d':'⛈','11n':'⛈','13d':'❄️','13n':'❄️',
  '50d':'🌫','50n':'🌫',
};

const WEATHER_DE = {
  'clear sky':'Klarer Himmel','few clouds':'Leicht bewölkt',
  'scattered clouds':'Bewölkt','broken clouds':'Stark bewölkt',
  'overcast clouds':'Bedeckt','light rain':'Leichter Regen',
  'moderate rain':'Regen','heavy intensity rain':'Starker Regen',
  'very heavy rain':'Starker Regen','extreme rain':'Starker Regen',
  'light snow':'Leichter Schnee','snow':'Schnee','heavy snow':'Starker Schnee',
  'mist':'Nebel','fog':'Nebel','haze':'Dunst',
  'thunderstorm':'Gewitter','drizzle':'Nieselregen',
  'light intensity drizzle':'Nieselregen','shower rain':'Schauer',
  'light intensity shower rain':'Leichter Schauer',
};

// ── Hilfsfunktionen ───────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n, unit) {
  if (n === null || n === undefined || isNaN(Number(n))) return '—';
  const formatted = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(Number(n));
  return unit ? formatted + '\u202F' + unit : formatted;
}

// ── Notion Blocks API ────────────────────────────────────────
// Liest eine einfache Notion-Tabelle (type: "table") per Blocks API
async function notionGetBlocks(blockId) {
  const res = await fetch(`/api/notion?endpoint=blocks/${blockId}/children&page_size=50`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Parst Notion table_row Blöcke → Array von Objekten
// Erste Zeile wird als Header-Zeile behandelt
function parseNotionTable(data) {
  const rows = (data.results || []).filter(b => b.type === 'table_row');
  if (rows.length < 2) return [];
  const cellText = cells => (cells || []).map(t => t.plain_text || t.text?.content || '').join('').trim();
  const headers  = rows[0].table_row.cells.map(cellText);
  return rows.slice(1).map(row => {
    const obj = {};
    row.table_row.cells.forEach((cell, i) => { if (headers[i]) obj[headers[i]] = cellText(cell); });
    return obj;
  });
}

// Zahl aus deutschem Format: "1.000,50" → 1000.5, "1000" → 1000
function parseNum(s) {
  if (typeof s === 'number') return s;
  if (!s) return 0;
  const str = String(s).trim();
  // Deutsches Format: Punkt = Tausender, Komma = Dezimal
  if (/\d\.\d{3}/.test(str)) return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  // Englisches Format oder plain
  return parseFloat(str.replace(',', '.').replace(/[^0-9.-]/g, '')) || 0;
}

// ── Uhrzeit ──────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent   = h + ':' + m;
  document.getElementById('datestr').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  document.getElementById('cal-date').textContent =
    now.getDate() + '. ' + MONTHS[now.getMonth()];
}
updateClock();
setInterval(updateClock, 10_000);

// ── Wetter ───────────────────────────────────────────────────
async function fetchWeather() {
  try {
    const res  = await fetch(
      `https://api.openweathermap.org/data/2.5/weather?q=${WEATHER_CITY}&appid=${WEATHER_KEY}&units=metric&lang=de`
    );
    const d    = await res.json();
    if (d.cod !== 200) throw new Error('API error');

    const temp  = Math.round(d.main.temp);
    const feels = Math.round(d.main.feels_like);
    const icon  = WEATHER_ICONS[d.weather[0].icon] || '🌤';
    const desc  = WEATHER_DE[d.weather[0].description.toLowerCase()] || d.weather[0].description;
    window._mrWeather = { temp, feels, icon, desc };

    document.getElementById('weather-card').innerHTML = `
      <div class="fade-in" style="display:flex;flex-direction:column;justify-content:space-between;height:100%;">
        <div>
          <div class="weather-icon">${icon}</div>
          <div class="weather-temp">${temp}°</div>
        </div>
        <div>
          <div class="weather-desc">${esc(desc)}</div>
          <div class="weather-feel">Fühlt: ${feels}°</div>
          <div class="weather-city">Laubach</div>
        </div>
      </div>`;
  } catch {
    document.getElementById('weather-card').innerHTML = `
      <div style="display:flex;flex-direction:column;justify-content:center;height:100%;gap:5px;">
        <div style="font-size:20px;">🌤</div>
        <div style="font-size:11px;color:var(--text-tertiary);">Nicht<br>verfügbar</div>
      </div>`;
  }
}
fetchWeather();
setInterval(fetchWeather, 10 * 60_000);

// Globale Dash-Daten für Morning Report
window._mrLeads  = [];
window._mrEvents = [];

// ── Pipeline ─────────────────────────────────────────────────
async function loadPipeline() {
  try {
    const data  = await notionGetBlocks(TABLE.pipeline);
    const rows  = parseNotionTable(data);

    document.getElementById('pipeline-badge').textContent =
      rows.length ? rows.length + (rows.length === 1 ? ' Lead' : ' Leads') : '';

    if (!rows.length) {
      document.getElementById('pipeline-list').innerHTML =
        '<div class="state-msg">Keine Einträge in der Pipeline</div>';
      return;
    }

    // Global für Morning Report speichern
    window._mrLeads = rows.map(row => ({
      name:   row['Name']   || row['Titel']   || 'Unbenannt',
      status: row['Status'] || 'KALT',
      detail: row['Nächste Aktion'] || row['Aktion'] || '',
    }));

    document.getElementById('pipeline-list').innerHTML = rows.map(row => {
      const name   = row['Name']   || row['Titel']         || 'Unbenannt';
      const status = row['Status'] || '';
      const action = row['Nächste Aktion'] || row['Aktion'] || '';
      const date   = row['Datum']  || row['Date']           || '';
      const amount = row['Betrag'] || row['Amount']         || '';
      return `
        <div class="pipeline-item fade-in">
          <div class="pipeline-row">
            <span class="pipeline-name">${esc(name)}</span>
            ${date ? `<span class="pipeline-date">${esc(date)}</span>` : ''}
          </div>
          ${status ? `<div class="pipeline-status">${esc(status)}</div>` : ''}
          ${action ? `<div class="pipeline-action">${esc(action)}</div>` : ''}
          ${amount ? `<div class="pipeline-amount">${esc(amount)}</div>` : ''}
        </div>`;
    }).join('');

  } catch (err) {
    console.error('Pipeline:', err);
    document.getElementById('pipeline-list').innerHTML =
      '<div class="state-msg">Nicht verfügbar</div>';
  }
}

// ── Fokus heute ───────────────────────────────────────────────
async function loadFokus() {
  try {
    const data = await notionGetBlocks(TABLE.fokus);
    const rows = parseNotionTable(data);

    if (!rows.length) {
      document.getElementById('fokus-text').textContent = 'Kein Fokus eingetragen.';
      return;
    }

    // Neueste Zeile (letzte Zeile = aktuellster Eintrag bei chronologischer Reihenfolge)
    const entry = rows[rows.length - 1];
    // Ersten nicht-leeren Wert nehmen der nicht "Datum" heißt
    const text = entry['Fokus'] || entry['Fokus-Satz'] || entry['Text'] || entry['Satz']
      || Object.entries(entry).find(([k, v]) => v && !k.toLowerCase().includes('datum'))?.[1]
      || '—';
    document.getElementById('fokus-text').innerHTML =
      `<span class="fade-in">${esc(text)}</span>`;

  } catch (err) {
    console.error('Fokus:', err);
    document.getElementById('fokus-text').textContent = 'Nicht verfügbar';
  }
}

// ── Cashflow ──────────────────────────────────────────────────
async function loadCashflow() {
  try {
    const now  = new Date();
    const data = await notionGetBlocks(TABLE.cashflow);
    const rows = parseNotionTable(data);

    if (!rows.length) {
      document.getElementById('cashflow-inner').innerHTML =
        '<div class="state-msg" style="padding:0;margin-top:4px;">Keine Daten</div>';
      return;
    }

    // Aktuellen Monat suchen, sonst letzte Zeile
    const curMonthName = MONTHS[now.getMonth()].toLowerCase();
    const curMonthNum  = String(now.getMonth() + 1).padStart(2, '0');
    let entry = rows.find(r => {
      const m = String(r['Monat'] || r['Month'] || r['Name'] || '').toLowerCase();
      return m.includes(curMonthName) || m.includes(curMonthNum);
    }) || rows[rows.length - 1];

    const einnahmen = parseNum(entry['Einnahmen'] || entry['Revenue'] || 0);
    const ziel      = parseNum(entry['Ziel']      || entry['Goal']    || 0);
    const offen     = entry['Offene Rechnungen']  || entry['Offen']   || null;
    const pct       = ziel > 0 ? Math.min(Math.round((einnahmen / ziel) * 100), 100) : 0;

    document.getElementById('cashflow-inner').innerHTML = `
      <div class="fade-in">
        <div class="cashflow-row">
          <span class="cashflow-value">${fmtNum(einnahmen)}</span>
          <span class="cashflow-sep"> / </span>
          <span class="cashflow-goal">${fmtNum(ziel)} €</span>
        </div>
        <div class="cashflow-bar-wrap">
          <div class="cashflow-bar-fill" style="width:${pct}%;"></div>
        </div>
        <div class="cashflow-sub" style="margin-top:4px;">
          ${pct} % des Ziels${offen ? ' · ' + esc(offen) + ' € offen' : ''}
        </div>
      </div>`;

  } catch (err) {
    console.error('Cashflow:', err);
    document.getElementById('cashflow-inner').innerHTML =
      '<div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Nicht verfügbar</div>';
  }
}

// ── Alle Notion-Daten laden ───────────────────────────────────
function refreshNotion() {
  loadPipeline();
  loadFokus();
  loadCashflow();
}
refreshNotion();
setInterval(refreshNotion, 5 * 60_000);

// ── Wake Lock (iPad-Display bleibt an) ───────────────────────
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }

// im Hintergrund, solange die Google-Session aktiv ist (= immer auf iPad).

let _googleToken  = null;
let _refreshTimer = null;

function gmailTokenLoad() {
  try {
    const d = JSON.parse(localStorage.getItem('gmail_token') || 'null');
    if (d && Date.now() < d.expires) return { token: d.token, expires: d.expires };
  } catch {}
  return null;
}

function gmailTokenSave(token, expiresIn) {
  const expiresAt = Date.now() + (expiresIn || 3600) * 1000;
  localStorage.setItem('gmail_token', JSON.stringify({ token, expires: expiresAt }));
  _googleScheduleRefresh(expiresAt);
}

function gmailTokenClear() {
  localStorage.removeItem('gmail_token');
  if (_refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; }
}

// Planen: 5 Minuten vor Ablauf still neuen Token holen
function _googleScheduleRefresh(expiresAt) {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  const delay = expiresAt - Date.now() - 5 * 60_000; // 5 min vor Ablauf
  _refreshTimer = setTimeout(_googleSilentRefresh, Math.max(delay, 10_000));
  console.log('[Auth] Token refresh in', Math.round(Math.max(delay,10000)/60000), 'Min geplant');
}

// Stilles Re-Auth — kein Dialog, kein Reload
async function _googleSilentRefresh() {
  if (!window.google?.accounts?.oauth2) return;
  console.log('[Auth] Stilles Token-Refresh läuft…');
  const token = await new Promise(resolve => {
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => resolve(r?.access_token || null),
        error_callback: () => resolve(null),
      });
      client.requestAccessToken({ prompt: 'none' });
    } catch { resolve(null); }
    setTimeout(() => resolve(null), 10_000); // 10s Timeout (iOS braucht mehr Zeit)
  });

  if (token) {
    gmailTokenSave(token, 3600);
    _googleToken = token;
    console.log('[Auth] Token still erneuert ✓');
    // UI im Hintergrund aktualisieren
    try { gmailRenderCount(await gmailFetch(token)); } catch {}
    morgenLoad();
  } else {
    // Stilles Refresh fehlgeschlagen → dezenter Hinweis ohne UI zu brechen
    console.warn('[Auth] Stilles Refresh fehlgeschlagen');
    _gmailShowRefreshHint();
  }
}

async function gmailFetch(token) {
  const r = await fetch(
    'https://gmail.googleapis.com/gmail/v1/users/me/threads?q=is:unread+in:inbox+category:primary&maxResults=50',
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (r.status === 401) throw Object.assign(new Error('401'), { status: 401 });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return (d.threads || []).length;
}

// Prüft Calendar-Scope (nur einmal nach Fresh-Login aufgerufen)
async function hasCalendarScope(token) {
  const r = await fetch(
    'https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=1',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  return r.ok;
}

async function gmailLoad() {
  // 1. Gespeicherter, noch gültiger Token?
  const stored = gmailTokenLoad();
  if (stored) {
    _googleToken = stored.token;
    _googleScheduleRefresh(stored.expires); // Refresh-Timer (neu) starten
    try {
      gmailRenderCount(await gmailFetch(stored.token));
      morgenLoad();
      return;
    } catch (e) {
      if (e.status === 401) { gmailTokenClear(); _googleToken = null; }
      else return; // Netzwerk-Fehler, nicht ausloggen
    }
  }

  // 2. Kein/abgelaufener Token → stilles Re-Auth
  const token = await new Promise(resolve => {
    if (!window.google?.accounts?.oauth2) { resolve(null); return; }
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => resolve(r?.access_token || null),
        error_callback: () => resolve(null),
      });
      client.requestAccessToken({ prompt: 'none' });
    } catch { resolve(null); }
    setTimeout(() => resolve(null), 10_000);
  });

  if (token) {
    // Bei frischem Silent-Auth einmalig Calendar-Scope prüfen
    const calOk = await hasCalendarScope(token);
    if (!calOk) {
      // Scope fehlt → manueller Login mit consent nötig
      gmailRenderLogin(); morgenRenderLoginHint(); return;
    }
    gmailTokenSave(token, 3600);
    _googleToken = token;
    try { gmailRenderCount(await gmailFetch(token)); } catch { gmailRenderError(); }
    morgenLoad();
    return;
  }

  // 3. Alles fehlgeschlagen → Login-Button
  gmailRenderLogin();
  morgenRenderLoginHint();
}

function gmailLogin() {
  if (!window.google?.accounts?.oauth2) { gmailRenderError(); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: GMAIL_CLIENT_ID,
    scope: GMAIL_SCOPE,
    callback: async r => {
      if (!r.access_token) { gmailRenderError(); return; }
      gmailTokenSave(r.access_token, r.expires_in);
      _googleToken = r.access_token;
      try { gmailRenderCount(await gmailFetch(r.access_token)); }
      catch { gmailRenderError(); }
      morgenLoad();
    },
  }).requestAccessToken({ prompt: 'consent' });
}

function buildMorningText(d) {
  const now      = new Date();
  const hour     = now.getHours();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);

  const wochentag  = d.date.split(',')[0]?.trim() || 'Heute';
  const datumKurz  = d.date.split(', ').slice(1).join(', ').replace(/\s+\d{4}$/, '') || d.date;
  const greet      = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';
  const morgenTag  = DAYS[tomorrow.getDay()];

  const parts = [];

  // 1. Begrüßung
  parts.push(`${greet}, Simon! Es ist ${d.time} Uhr, ${wochentag} der ${datumKurz}.`);

  // 2. Wetter — Zeilen bereinigen, Emoji-Zeilen rausfiltern
  const wLines = d.weather.split('\n')
    .map(s => s.trim())
    .filter(s => s && s.length > 1 && !/^\p{Emoji_Presentation}$/u.test(s));
  const wTemp  = wLines.find(s => /^\d+°$/.test(s) || s.match(/^\d+°$/));
  const wDesc  = wLines.find(s => !/\d/.test(s) && !s.includes('Laubach') && !s.includes('Fühlt') && s.length > 3);
  const wFeels = wLines.find(s => s.includes('Fühlt'));
  if (wDesc || wTemp) {
    let w = 'Draußen in Laubach';
    if (wTemp) w += ` sind es ${wTemp}`;
    if (wDesc) w += `, ${wDesc.toLowerCase()}`;
    if (wFeels) w += `, ${wFeels.toLowerCase().replace('fühlt:', 'gefühlt').replace('fühlt: ', 'gefühlt ')}`;
    parts.push(w + '.');
  }

  // 3. Fokus
  const fokus = d.fokus.replace(/\n.*/s, '').trim();
  const fokusLeer = !fokus || ['—', 'Kein Fokus', 'Nicht verfügbar', 'Kein Fokus eingetragen'].some(s => fokus.includes(s));
  if (!fokusLeer) {
    parts.push(`Dein Fokus für heute: ${fokus}.`);
  } else {
    parts.push('Für heute ist noch kein Fokus eingetragen.');
  }

  // 4. Pipeline
  const leads = d.pipeline.filter(l => !l.includes('Nicht verfügbar'));
  if (leads.length) {
    const firstName = leads[0].split(' · ')[0].trim();
    if (leads.length === 1) {
      parts.push(`In deiner Pipeline läuft gerade ein aktiver Lead: ${firstName}.`);
    } else {
      const others = leads.slice(1).map(l => l.split(' · ')[0].trim());
      const list   = others.length === 1
        ? `${firstName} und ${others[0]}`
        : `${firstName}, ${others.slice(0, -1).join(', ')} und ${others.at(-1)}`;
      parts.push(`Du hast ${leads.length} aktive Leads in der Pipeline: ${list}.`);
    }
  }

  // 5. Cashflow
  const cfClean = d.cashflow.replace(/\s+/g, ' ').trim();
  const cfLeer  = !cfClean || ['Keine Daten', 'Nicht verfügbar'].some(s => cfClean.includes(s));
  if (!cfLeer) {
    // Nur Zahlen extrahieren: "400 / 1.000 € 40 % des Ziels" → lesbar machen
    const match = cfClean.match(/([\d.,]+)\s*\/\s*([\d.,]+)\s*€/);
    if (match) {
      parts.push(`Beim Cashflow stehst du diesen Monat bei ${match[1]} von ${match[2]} Euro Ziel.`);
    } else {
      parts.push(`Zum Cashflow: ${cfClean.split('\n')[0]}.`);
    }
  }

  // 6. Abschluss
  const closings = [
    `Morgen ist ${morgenTag} — noch ist heute, pack es an!`,
    `Einen produktiven ${wochentag} dir, mach was draus!`,
    `Morgen erwartet dich schon der ${morgenTag}, also nutze den heutigen Tag.`,
  ];
  parts.push(closings[now.getMinutes() % closings.length]);

  return parts.join(' ');
}

function dateKey(d) {

function goalKey(d) { return 'goal_for_' + dateKey(d); }

function goalCheckEvening() {
  const now = new Date();
  const hour = now.getHours();
  // Zwischen 20:00 und 23:59 — und nur einmal pro Abend
  if (hour < 20 || hour > 23) return;

  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  const key = goalKey(tomorrow);

  // Wenn heute schon gespeichert oder geskipped → nicht erneut zeigen
  if (localStorage.getItem(key) !== null) return;
  // Nicht erneut zeigen, wenn Modal bereits offen
  if (document.getElementById('goal-modal').classList.contains('show')) return;

  goalShowModal(tomorrow);

function goalShowModal(tomorrow) {
  document.getElementById('goal-modal-day').textContent = DAYS[tomorrow.getDay()];
  document.getElementById('goal-input').value = '';
  document.getElementById('goal-modal').classList.add('show');
  setTimeout(() => document.getElementById('goal-input').focus(), 200);

function goalSave() {
  const val = document.getElementById('goal-input').value.trim();
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (val) localStorage.setItem(goalKey(tomorrow), val);
  else     localStorage.setItem(goalKey(tomorrow), ''); // leer = bewusst übersprungen
  document.getElementById('goal-modal').classList.remove('show');
  goalRenderToday();
}

function goalSkip() {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  // Markieren als "heute nicht mehr fragen", aber leer lassen
  localStorage.setItem(goalKey(tomorrow), '');
  document.getElementById('goal-modal').classList.remove('show');
}

function goalRenderToday() {
  const today = new Date();
  const stored = localStorage.getItem(goalKey(today));
  const banner = document.getElementById('ziel-banner');
  if (stored && stored.trim()) {
    document.getElementById('ziel-banner-text').textContent = stored;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

async function fetchEventsForDay(calId, start, end) {
  try {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?`
      + `timeMin=${encodeURIComponent(start.toISOString())}`
      + `&timeMax=${encodeURIComponent(end.toISOString())}`
      + `&singleEvents=true&orderBy=startTime&maxResults=30`;
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + _googleToken } });
    if (!r.ok) return [];
    const d = await r.json();
    return d.items || [];
  } catch { return []; }
}

// Kalender-ID aus dem Dashboard-Iframe (simon-raphael.moser@web.de)
const DASHBOARD_CAL_ID = 'simon-raphael.moser@web.de';

async function todayLoad() {
  if (!_googleToken) return;
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end   = new Date(); end.setHours(23, 59, 59, 999);

    // Dashboard-Kalender immer explizit + alle weiteren aus der Liste
    const listRes = await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
      { headers: { Authorization: 'Bearer ' + _googleToken } }
    );
    const calList = listRes.ok ? await listRes.json() : { items: [] };
    const calIds  = [...new Set([
      DASHBOARD_CAL_ID,
      'primary',
      ...(calList.items || []).map(c => c.id),
    ])];

    const allEvents = (await Promise.all(calIds.map(id => fetchEventsForDay(id, start, end)))).flat();

    // Sortieren + deduplizieren (nach eventId)
    const seen = new Set();
    const sorted = allEvents
      .filter(ev => { const k = ev.id; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => new Date(a.start?.dateTime || a.start?.date) - new Date(b.start?.dateTime || b.start?.date));

    window._mrEvents = sorted.map(ev => ({
      time:  ev.start?.dateTime
        ? new Date(ev.start.dateTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
        : 'Ganztags',
      title: ev.summary || '(ohne Titel)',
    }));
  } catch { /* ignorieren */ }
}

async function morgenLoad() {
  if (!_googleToken) { morgenRenderLoginHint(); return; }
  todayLoad(); // Heute-Termine für Morning Report parallel laden
  try {
    const start = new Date();
    start.setDate(start.getDate() + 1);
    start.setHours(0, 0, 0, 0);
    const end = new Date(start);
    end.setHours(23, 59, 59, 999);

    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?`
      + `timeMin=${encodeURIComponent(start.toISOString())}`
      + `&timeMax=${encodeURIComponent(end.toISOString())}`
      + `&singleEvents=true&orderBy=startTime&maxResults=10`;

    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + _googleToken } });
    if (r.status === 401) { gmailTokenClear(); _googleToken = null; morgenRenderLoginHint(); return; }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    morgenRender(d.items || []);
  } catch (e) {
    console.error('Morgen:', e);
    document.getElementById('morgen-list').innerHTML =
      '<div class="morgen-empty">Nicht verfügbar</div>';
  }
}

function morgenRender(items) {
  const badge = document.getElementById('morgen-badge');
  const list  = document.getElementById('morgen-list');
  if (!items.length) {
    badge.textContent = '';
    list.innerHTML = '<div class="morgen-empty">Frei</div>';
    return;
  }
  badge.textContent = items.length === 1 ? '1 Termin' : items.length + ' Termine';
  const visible = items.slice(0, 3);
  const more    = items.length - visible.length;
  list.innerHTML = visible.map(ev => {
    const time = ev.start?.dateTime
      ? new Date(ev.start.dateTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
      : 'Ganztags';
    const title = ev.summary || '(ohne Titel)';
    return `<div class="morgen-item"><span class="morgen-time">${time}</span><span class="morgen-title">${esc(title)}</span></div>`;
  }).join('') + (more > 0 ? `<div class="morgen-empty">+${more} weitere</div>` : '');
}

function morgenRenderLoginHint() {
  document.getElementById('morgen-list').innerHTML =
    '<div class="morgen-empty">Mit Gmail anmelden, um Termine zu sehen</div>';
}

// Aktualisiere Morgen-Termine alle 15 Min
setInterval(() => { if (_googleToken) morgenLoad(); }, 15 * 60_000);

// KALENDER-DEBUG — URL: ?debug
// Zeigt alle gefundenen Kalender + heutige Events direkt auf dem iPad
// ═════════════════════════════════════════════════════════════
if (new URLSearchParams(window.location.search).has('debug')) {
  async function runCalDebug() {
    // Warte bis Token vorhanden (max 8 Sek)
    for (let i = 0; i < 16; i++) {
      if (_googleToken) break;
      await new Promise(r => setTimeout(r, 500));
    }

    const overlay = document.createElement('div');
    overlay.style.cssText = [
      'position:fixed','inset:0','z-index:99999','background:#fff',
      'overflow:auto','padding:20px 16px','font-family:-apple-system,monospace',
      'font-size:13px','color:#1c1c1e','line-height:1.5',
    ].join(';');

    if (!_googleToken) {
      overlay.innerHTML = '<h2>Kein Google-Token</h2><p>Zuerst Gmail anmelden, dann ?debug aufrufen.</p>';
      document.body.appendChild(overlay);
      return;
    }

    overlay.innerHTML = '<h2 style="margin-bottom:12px">⏳ Lade Kalender…</h2>';
    document.body.appendChild(overlay);

    try {
      // 1. Alle Kalender auflisten
      const listRes = await fetch(
        'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
        { headers: { Authorization: 'Bearer ' + _googleToken } }
      );
      const listStatus = listRes.status;
      const listBody = await listRes.text();
      let calList = { items: [] };
      try { calList = JSON.parse(listBody); } catch {}
      const cals = calList.items || [];

      // Scope-Fehler anzeigen
      if (!listRes.ok) {
        const reAuthBtn = `<button onclick="gmailTokenClear();gmailLogin();" style="margin-top:12px;background:#0A84FF;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:15px;cursor:pointer;font-weight:600;">Neu anmelden (mit Kalender-Zugriff)</button>`;
        overlay.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:18px;font-weight:700;">Kalender Debug</h2>
            <button onclick="this.closest('div[style]').remove()" style="background:#f2f2f7;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;">Schließen</button>
          </div>
          <div style="background:#fff3f3;border:1px solid #ffcdd2;border-radius:10px;padding:14px;margin-bottom:12px;">
            <div style="font-weight:700;color:#d32f2f;margin-bottom:6px;">⚠️ calendarList API Fehler ${listStatus}</div>
            <pre style="font-size:11px;color:#555;white-space:pre-wrap;word-break:break-all;">${listBody.slice(0,400)}</pre>
          </div>
          <p style="color:#3c3c43;margin-bottom:4px;">Das Token hat keinen Kalender-Scope. Du musst dich neu einloggen:</p>
          ${reAuthBtn}
          <div style="margin-top:14px;font-size:11px;color:#8e8e93;">Token: ${_googleToken.slice(0,20)}…</div>`;
        return;
      }

      // 2. Heute-Events aus jedem Kalender
      const start = new Date(); start.setHours(0, 0, 0, 0);
      const end   = new Date(); end.setHours(23, 59, 59, 999);

      const calResults = await Promise.all(cals.map(async cal => {
        const evs = await fetchEventsForDay(cal.id, start, end);
        return { id: cal.id, name: cal.summary || cal.id, color: cal.backgroundColor || '#888', evs };
      }));

      // Auch explizit den Dashboard-Kalender testen
      const dashEvs = await fetchEventsForDay(DASHBOARD_CAL_ID, start, end);

      // 3. HTML bauen
      const rows = calResults.map(c => {
        const evHtml = c.evs.length
          ? c.evs.map(e => {
              const t = e.start?.dateTime
                ? new Date(e.start.dateTime).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' })
                : 'Ganztags';
              return `<div style="padding:2px 0 2px 16px;color:#3c3c43">⏱ ${t} — ${e.summary || '?'}</div>`;
            }).join('')
          : '<div style="padding:2px 0 2px 16px;color:#aeaeb2">keine Events heute</div>';
        return `
          <div style="margin-bottom:14px;border:1px solid #eee;border-radius:10px;padding:10px 12px;">
            <div style="font-weight:600;margin-bottom:4px;">
              <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color};margin-right:6px;vertical-align:middle;"></span>
              ${c.name}
            </div>
            <div style="font-size:11px;color:#8e8e93;margin-bottom:6px;">${c.id}</div>
            ${evHtml}
          </div>`;
      }).join('');

      const dashSection = dashEvs.length
        ? dashEvs.map(e => {
            const t = e.start?.dateTime
              ? new Date(e.start.dateTime).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' })
              : 'Ganztags';
            return `<div>⏱ ${t} — ${e.summary || '?'}</div>`;
          }).join('')
        : '<div style="color:#aeaeb2">Keine Events gefunden</div>';

      const totalEvs = calResults.reduce((s, c) => s + c.evs.length, 0);

      overlay.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="font-size:18px;font-weight:700;">Kalender Debug</h2>
          <button onclick="this.closest('div[style]').remove()" style="background:#f2f2f7;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;">Schließen</button>
        </div>

        <div style="background:#f9f9fb;border-radius:10px;padding:12px;margin-bottom:16px;">
          <div style="font-weight:600;margin-bottom:6px;">📋 Dashboard-Kalender (simon-raphael.moser@web.de)</div>
          ${dashSection}
        </div>

        <div style="font-weight:600;margin-bottom:10px;">
          Alle ${cals.length} Kalender — ${totalEvs} Events heute total
        </div>
        ${rows || '<div style="color:#aeaeb2">Keine Kalender gefunden</div>'}

        <div style="margin-top:16px;font-size:11px;color:#8e8e93;">
          Token: ${_googleToken ? _googleToken.slice(0,20) + '…' : 'fehlt'}
        </div>`;

    } catch (err) {
      overlay.innerHTML = `<h2>Fehler</h2><pre>${err.message}</pre>
        <button onclick="this.closest('div[style]').remove()">Schließen</button>`;
    }
  }
  // Kurz nach Load starten (Token braucht einen Moment)
  window.addEventListener('load', () => setTimeout(runCalDebug, 2000));
}

<script>
'use strict';
// ═════════════════════════════════════════════════════════════
// PRIVATE VIEW
// ═════════════════════════════════════════════════════════════

let _currentView = 'business';

function switchView(target) {
  if (target === _currentView) return;
  _currentView = target;
  const priv  = document.getElementById('screen-private');
  const card  = document.getElementById('view-switch-card');
  const pill  = document.getElementById('view-switch-pill');
  const label = document.getElementById('view-switch-label');
  const isPriv = _currentView === 'private';
  if (isPriv) { priv.classList.add('active'); renderPrivate(); }
  else { priv.classList.remove('active'); }
  if (card)  card.classList.toggle('priv-mode', isPriv);
  if (pill)  pill.classList.toggle('priv-mode', isPriv);  // thumb moves via card class
  if (label) label.textContent = isPriv ? 'Privat' : 'Business';
}
function toggleView() { switchView(_currentView === 'business' ? 'private' : 'business'); }

// ── Helpers ──
function privDateKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── Habits ──
const HABITS_CFG = [
  { id:'gym',    name:'Gym',               goal:'2× / Woche', short:'Gym'  },
  { id:'ita',    name:'Italiano',           goal:'täglich',    short:'Ita'  },
  { id:'nodoom', name:'Kein Doomscrolling', goal:'täglich',    short:'Doom' },
  { id:'custom', name:null,                 goal:'täglich',    short:'----' },
];

function habitsLoad() { try { return JSON.parse(localStorage.getItem('priv_habits')||'{}'); } catch { return {}; } }
function habitsSave(d) { localStorage.setItem('priv_habits', JSON.stringify(d)); }

function habitToggle(hid, ds) {
  const d = habitsLoad();
  if (!d[hid]) d[hid] = {};
  d[hid][ds] = !d[hid][ds];
  habitsSave(d);
  renderHabits();
}

function habitStreak(hid, all) {
  const days = all[hid]||{};
  let streak=0, d=new Date();
  if (!days[privDateKey(d)]) d.setDate(d.getDate()-1);
  while (days[privDateKey(d)]) { streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function habitRecord(hid, all) {
  const days = all[hid]||{};
  const keys = Object.keys(days).filter(k=>days[k]).sort();
  if (!keys.length) return 0;
  let max=1, cur=1;
  for (let i=1;i<keys.length;i++) {
    const diff=Math.round((new Date(keys[i])-new Date(keys[i-1]))/86400000);
    if (diff===1){cur++;if(cur>max)max=cur;}else{cur=1;}
  }
  return max;
}

function habitEditCustom() {
  const name = prompt('Name für diese Habit:', localStorage.getItem('priv_habit_custom_name')||'');
  if (name===null) return;
  localStorage.setItem('priv_habit_custom_name', name.trim());
  renderHabits();
}

// ── Life Weeks ──
function lifeSaveBirthdate() {
  const val = document.getElementById('life-bd-input').value;
  if (!val) return;
  localStorage.setItem('priv_birthdate', val);
  renderLifeWeeks();
}

// ── Italian Minutes ──
function itaLoad() { try { return JSON.parse(localStorage.getItem('priv_ita_min')||'{}'); } catch { return {}; } }
function itaMinsToColor(m) {
  if (!m) return 'var(--phn)';
  if (m<10) return '#8DC49A';
  if (m<=30) return '#4A7C59';
  return '#2D5A3A';
}
function itaLogDay(ds) {
  const data=itaLoad(), cur=data[ds]||0;
  const raw=prompt('Lernminuten ('+ds+', aktuell '+cur+' Min):', cur||'');
  if (raw===null) return;
  data[ds]=Math.max(0,parseInt(raw)||0);
  localStorage.setItem('priv_ita_min',JSON.stringify(data));
  renderItaHeatmap();
}

// ── Master render ──
function renderPrivate() {
  const now=new Date();
  const lbl=document.getElementById('priv-date-label');
  if (lbl) lbl.textContent=DAYS[now.getDay()]+', '+now.getDate()+'. '+MONTHS[now.getMonth()];
  renderHabits(); renderLifeWeeks(); renderItaHeatmap();
}

function renderHabits() {
  const all=habitsLoad(), today=privDateKey(new Date());
  const tilesEl=document.getElementById('habit-tiles');
  const hmapEl=document.getElementById('habit-heatmaps');
  if (!tilesEl||!hmapEl) return;

  tilesEl.innerHTML=HABITS_CFG.map(h=>{
    const done=(all[h.id]||{})[today]||false;
    const streak=habitStreak(h.id,all), record=habitRecord(h.id,all);
    const isCustom=h.id==='custom';
    const customName=localStorage.getItem('priv_habit_custom_name')||null;
    const displayName=isCustom?customName:h.name;
    const isPlaceholder=isCustom&&!displayName;
    const editAttr=isCustom?' ondblclick="event.stopPropagation();habitEditCustom()"':'';
    return '<div class="habit-tile'+(done?' done':'')+'" onclick="habitToggle(''+h.id+'',''+today+'')"+editAttr+">'
      +'<div class="habit-tile-circle"><div class="habit-tile-check"></div></div>'
      +'<div class="habit-tile-name'+(isPlaceholder?' placeholder':'')+'">'+( isPlaceholder?'Habit<br>hinzufügen':esc(displayName||'') )+'</div>'
      +'<div class="habit-tile-goal">'+h.goal+'</div>'
      +'<div class="habit-tile-streak">'+(streak>0?streak+' 🔥':(record>0?'Rek: '+record:'—'))+'</div>'
      +'</div>';
  }).join('');

  hmapEl.innerHTML=HABITS_CFG.map(h=>{
    const days=all[h.id]||{};
    const lbl=h.id==='custom'?(localStorage.getItem('priv_habit_custom_name')||'----').substring(0,4):h.short;
    let dots='';
    for (let i=29;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const k=privDateKey(d), isToday=i===0;
      dots+='<div class="habit-hmap-dot" style="background:'+(days[k]?'var(--pg)':'var(--phn)')+';'+(isToday?'outline:1.5px solid var(--pa);outline-offset:1px':'')+'"></div>';
    }
    return '<div class="habit-hmap-row"><span class="habit-hmap-lbl">'+esc(lbl)+'</span><div class="habit-hmap-dots">'+dots+'</div></div>';
  }).join('');
}

function renderLifeWeeks() {
  const bdStr=localStorage.getItem('priv_birthdate');
  const bdForm=document.getElementById('life-bd-form');
  const content=document.getElementById('life-content');
  if (!bdForm||!content) return;
  if (!bdStr){ bdForm.style.display='flex'; content.style.display='none'; return; }
  bdForm.style.display='none'; content.style.display='block';

  const birth=new Date(bdStr), now=new Date();
  const TOTAL=85*52;
  const weeksLived=Math.floor((now-birth)/(7*24*60*60*1000));
  const weeksLeft=Math.max(0,TOTAL-weeksLived);
  const currentWk=Math.min(weeksLived,TOTAL-1);
  const pct=Math.min(100,weeksLived/TOTAL*100).toFixed(1);
  const age=Math.floor((now-birth)/(365.25*24*60*60*1000));

  const heroWk=document.getElementById('life-hero-week');
  const heroTt=document.getElementById('life-hero-total');
  const progFill=document.getElementById('life-progress-fill');
  if (heroWk) heroWk.textContent=weeksLived.toLocaleString('de-DE');
  if (heroTt) heroTt.innerHTML='<strong>'+weeksLeft.toLocaleString('de-DE')+'</strong> von 4.420 verbleiben · '+age+' Jahre';
  if (progFill) setTimeout(()=>{ progFill.style.width=pct+'%'; }, 80);

  const gridEl=document.getElementById('life-grid');
  if (gridEl){
    let html='';
    for (let i=0;i<TOTAL;i++){
      html+='<div class="life-cell'+(i===currentWk?' current':i<weeksLived?' lived':'')+'"></div>';
    }
    gridEl.innerHTML=html;
  }
  const statsEl=document.getElementById('life-stats');
  if (statsEl) statsEl.textContent=pct+'% des Lebens erlebt';
}

function renderItaHeatmap() {
  const container=document.getElementById('ita-heatmap');
  if (!container) return;
  const data=itaLoad(), today=new Date(), todayStr=privDateKey(today), WEEKS=26;

  const startDate=new Date(today);
  startDate.setDate(today.getDate()-WEEKS*7);
  const dow=startDate.getDay();
  startDate.setDate(startDate.getDate()-(dow===0?6:dow-1));

  const cur=new Date(startDate), columns=[], monthBreaks=[];
  let prevMonth=-1;
  for (let w=0;w<=WEEKS;w++){
    const cells=[], colMonth=cur.getMonth();
    if (colMonth!==prevMonth){ monthBreaks.push({w,label:MONTHS[colMonth].substring(0,3)}); prevMonth=colMonth; }
    for (let day=0;day<7;day++){
      const k=privDateKey(cur), isFuture=cur>today, isToday=k===todayStr;
      cells.push({k,isFuture,isToday,color:isFuture?'transparent':itaMinsToColor(data[k]||0),mins:data[k]||0});
      cur.setDate(cur.getDate()+1);
    }
    columns.push(cells);
  }

  let monthRow='<div class="ita-month-labels">';
  let lastLblW=-6;
  columns.forEach((_,w)=>{
    const mb=monthBreaks.find(m=>m.w===w);
    if (mb&&w-lastLblW>=3){ monthRow+='<div class="ita-month-span" style="width:14px;min-width:14px;">'+mb.label+'</div>'; lastLblW=w; }
    else { monthRow+='<div style="width:14px;min-width:14px;"></div>'; }
  });
  monthRow+='</div>';

  let gridHtml='<div class="ita-grid">';
  columns.forEach(cells=>{
    gridHtml+='<div class="ita-col">';
    cells.forEach(c=>{
      if (c.isFuture) gridHtml+='<div class="ita-cell" style="background:transparent;cursor:default;pointer-events:none;"></div>';
      else gridHtml+='<div class="ita-cell'+(c.isToday?' ita-today':'')+'" style="background:'+c.color+'" title="'+c.k+': '+c.mins+' Min" onclick="itaLogDay(''+c.k+'')"></div>';
    });
    gridHtml+='</div>';
  });
  gridHtml+='</div>';

  container.innerHTML=monthRow+gridHtml;
}
</script>
