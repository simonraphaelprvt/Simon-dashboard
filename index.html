<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard · Simon</title>
<!-- Google Identity Services für Gmail + Calendar OAuth -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Morning Report Slideshow -->
<link rel="stylesheet" href="morningReport.css">
<!-- Playfair Display for private screen serif typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap">
<!-- Plus Jakarta Sans + DM Sans for business screen typography -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:             #F2F2F7;
    --card:           #FFFFFF;
    --card-inner:     #F2F2F7;
    --text-primary:   #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary:  #C7C7CC;
    --border:         rgba(0,0,0,0.06);
    --shadow:         0 2px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
    --radius:         18px;
    --radius-sm:      13px;
    --accent-purple:  #5E5CE6;
    --accent-green:   #30D158;
    --accent-orange:  #FF9F0A;
    --accent-blue:    #0A84FF;
    --accent-red:     #FF453A;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Haupt-Grid ── */
  .screen {
    width: 100vw;
    height: 100dvh;
    padding: 20px;
    display: grid;
    grid-template-rows: 96px 1fr 90px;
    gap: 12px;
    overflow: hidden;
    position: relative;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* ─────────────────────────────────────
     ROW 1: Zeit + Wetter
  ───────────────────────────────────── */
  .row-top {
    display: grid;
    grid-template-columns: 1fr 140px 148px; /* time | toggle-slot (empty) | weather */
    gap: 12px;
  }
  .card-time    { grid-column: 1; }
  .card-weather { grid-column: 3; }

  .card-time {
    padding: 16px 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .time-display {
    font-size: clamp(46px, 7vw, 66px);
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -2.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-date {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 5px;
    letter-spacing: -0.2px;
  }

  .card-weather {
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 2px;
  }

  .weather-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .weather-temp  { font-size: 36px; font-weight: 200; color: var(--text-primary); letter-spacing: -1.5px; line-height: 1; }
  .weather-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .weather-feel  { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .weather-city  { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  /* ─────────────────────────────────────
     ROW 2: Kalender + Pipeline
  ───────────────────────────────────── */
  .row-middle {
    display: grid;
    grid-template-columns: 1fr 298px;
    gap: 12px;
    min-height: 0;
  }

  /* Section-Header (wiederverwendbar) */
  .section-header {
    padding: 11px 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .section-badge {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  /* Kalender */
  .card-calendar {
    display: flex;
    flex-direction: column;
  }

  .calendar-iframe-wrap {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .calendar-iframe-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Pipeline */
  .card-pipeline {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ── Morgen (Termine morgen) — unten in Pipeline-Spalte ── */
  .morgen-block {
    border-top: 0.5px solid var(--border);
    padding: 8px 12px 10px;
    flex-shrink: 0;
    max-height: 118px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .morgen-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .morgen-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .morgen-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 11.5px;
    line-height: 1.25;
  }
  .morgen-time {
    font-variant-numeric: tabular-nums;
    color: var(--text-tertiary);
    font-size: 10.5px;
    flex-shrink: 0;
    min-width: 40px;
  }
  .morgen-title {
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .morgen-empty {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 4px 0;
  }

  /* ── Heutiges Ziel Banner (in Fokus-Karte) ── */
  .ziel-banner {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-secondary);
    padding: 3px 8px;
    background: rgba(94, 92, 230, 0.08);
    border-radius: 8px;
    align-self: flex-start;
    margin-bottom: 2px;
    max-width: 100%;
  }
  .ziel-banner.show { display: inline-flex; }
  .ziel-banner-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-purple);
    flex-shrink: 0;
  }
  .ziel-banner-text {
    color: var(--text-primary);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Evening Goal Modal Overlay ── */
  .goal-modal {
    position: fixed;
    inset: 0;
    background: rgba(28, 28, 30, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .goal-modal.show { display: flex; }
  .goal-card {
    background: var(--card);
    border-radius: 22px;
    padding: 28px 26px 22px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    animation: goalIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes goalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .goal-eyebrow {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-purple);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .goal-title {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    line-height: 1.25;
    margin-bottom: 16px;
  }
  .goal-input {
    width: 100%;
    background: var(--card-inner);
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    outline: none;
    margin-bottom: 14px;
  }
  .goal-input:focus { box-shadow: 0 0 0 2px var(--accent-purple); }
  .goal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .goal-btn {
    border: none;
    border-radius: 12px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .goal-btn-secondary {
    background: var(--card-inner);
    color: var(--text-secondary);
  }
  .goal-btn-primary {
    background: var(--accent-purple);
    color: #fff;
  }
  .goal-btn:active { transform: scale(0.97); }

  .pipeline-list {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 0;
    overflow: hidden;
  }

  .pipeline-item {
    background: var(--card-inner);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-height: 0;
  }

  .pipeline-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .pipeline-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .pipeline-date {
    font-size: 11px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .pipeline-status {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pipeline-action {
    font-size: 11.5px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .pipeline-amount {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent-purple);
    margin-top: 3px;
  }

  /* Fehler / leer Zustand */
  .state-msg {
    padding: 16px;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }

  /* ─────────────────────────────────────
     ROW 3: Fokus + Cashflow
  ───────────────────────────────────── */
  .row-bottom {
    display: grid;
    grid-template-columns: 1fr 175px 130px 200px;
    gap: 12px;
  }

  /* ── Gmail Widget ── */
  .card-gmail {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .gmail-count {
    font-size: 24px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -0.8px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .gmail-sub { font-size: 11px; color: var(--text-tertiary); }
  .gmail-login-btn {
    font-size: 11px;
    font-family: inherit;
    font-weight: 500;
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 5px 10px;
    cursor: pointer;
    align-self: flex-start;
    margin-top: 2px;
  }

  /* ── Zoho Widget ── */
  .card-zoho {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .zoho-main {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zoho-amount {
    font-size: 18px;
    font-weight: 200;
    color: var(--accent-orange);
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .zoho-due {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-fokus {
    padding: 12px 20px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .fokus-text {
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-cashflow {
    padding: 12px 18px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .cashflow-row {
    display: flex;
    align-items: baseline;
    gap: 3px;
    margin-top: 2px;
  }

  .cashflow-value {
    font-size: 26px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .cashflow-sep {
    font-size: 16px;
    font-weight: 200;
    color: var(--text-tertiary);
  }

  .cashflow-goal {
    font-size: 16px;
    font-weight: 300;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .cashflow-sub {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .cashflow-bar-wrap {
    height: 3px;
    background: var(--card-inner);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }

  .cashflow-bar-fill {
    height: 100%;
    background: var(--accent-green);
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
  }

  /* ── Morning Report Button — circular icon button ── */
  .morning-btn {
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent-purple);
    color: #fff;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s, transform 0.12s;
    box-shadow: 0 4px 16px rgba(94,92,230,0.30);
  }
  .morning-btn .btn-label { display: none; } /* text hidden, icon only */
  .morning-btn:active   { transform: scale(0.93); }
  .morning-btn:disabled { opacity: 0.5; cursor: default; }
  .morning-btn.speaking { background: var(--accent-red); box-shadow: 0 4px 16px rgba(255,69,58,0.30); }
  .morning-btn svg      { flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.85s linear infinite; }

  /* ─────────────────────────────────────
     Skeleton / Loading
  ───────────────────────────────────── */
  .skel {
    display: block;
    background: linear-gradient(90deg, #ebebf0 25%, #e2e2e8 50%, #ebebf0 75%);
    background-size: 300% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
    border-radius: 5px;
  }

  @keyframes shimmer {
    0%   { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  .weather-skel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 4px;
  }

  /* ─────────────────────────────────────
     Animationen
  ───────────────────────────────────── */
  .fade-in {
    animation: fadeIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }


  /* ═══════════════════════════════════════════════════════════════
     VIEW SWITCH — single animated toggle, fixed position
     Sits left of weather card: right:178px clears weather (148+20+10)
  ═══════════════════════════════════════════════════════════════ */
  .time-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #view-toggle {
    position: fixed;
    top: 20px;
    right: 184px;  /* sits in the empty 140px slot, same height as weather card */
    width: 132px;
    height: 96px;
    z-index: 10000;
    background: #FFFFFF;
    border: 0.5px solid rgba(0,0,0,0.06);
    border-radius: 18px;
    padding: 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 11px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.38s cubic-bezier(0.22,1,0.36,1),
                border-color 0.38s cubic-bezier(0.22,1,0.36,1),
                box-shadow 0.38s cubic-bezier(0.22,1,0.36,1),
                transform 0.16s;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
  }
  #view-toggle:active { transform: scale(0.97); }
  #view-toggle.priv-mode {
    background: #FAF6EE;
    border-color: rgba(58,38,22,0.10);
    box-shadow: 0 2px 16px rgba(58,38,22,0.08), 0 1px 3px rgba(58,38,22,0.04);
  }
  #view-toggle.priv-mode .view-switch-label { color: #3A2616; }
  #view-toggle.priv-mode .view-switch-pill { background: #C7522A; }
  .view-switch-label {
    font-size: 13px;
    font-weight: 600;
    color: #1C1C1E;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    letter-spacing: 0.01em;
    width: auto;
    text-align: center;
    pointer-events: none;
    transition: color 0.35s;
  }
  #view-toggle.priv-mode .view-switch-label { color: #3A2616; }
  .view-switch-pill {
    width: 44px; height: 26px;
    border-radius: 13px;
    background: #0A84FF;
    position: relative;
    flex-shrink: 0;
    pointer-events: none;
    transition: background 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #view-toggle.priv-mode .view-switch-pill { background: #F7B35A; }
  .view-switch-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,0.28), 0 0.5px 1px rgba(0,0,0,0.12);
    transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #view-toggle.priv-mode .view-switch-thumb { transform: translateX(18px); }

  /* ═══════════════════════════════════════════════════════════════
     PRIVATE SCREEN v2 — WARM LINEN
  ═══════════════════════════════════════════════════════════════ */
  :root {
    --pb:    #EFE5D2;            /* linen background */
    --pc:    #FAF6EE;            /* card cream — lighter */
    --pc2:   #FDF9F2;            /* card-hover / done */
    --pb2:   rgba(58,38,22,0.08);
    --pb3:   rgba(58,38,22,0.18);
    --ps:    none;
    --ps2:   none;
    --pt:    #3A2616;
    --pt2:   #8A6A42;
    --pt3:   #A88860;
    --pa:    #C7522A;            /* terracotta */
    --pa2:   #D86940;
    --pg:    #5A7A3F;            /* olive */
    --pg2:   #7A9258;
    --pg3:   #2D5A27;
    --phn:   #E5D8BD;            /* empty-state beige */
    --pyel:  #D4A24A;            /* yellow accent */
    --serif: 'Playfair Display', 'EB Garamond', Georgia, serif;
  }

  #screen-private {
    position: fixed;
    inset: 0;
    z-index: 9000;
    background:
      radial-gradient(ellipse at 50% 35%, #F4EBD8 0%, #E8D9BC 100%),
      #EFE5D2;
    background-attachment: fixed;
    overflow-y: auto;
    padding: 20px 20px 18px; /* match business screen padding so header aligns with fixed toggle */
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    color: var(--pt);
    -webkit-font-smoothing: antialiased;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
    -webkit-user-select: none;
  }
  #screen-private.active { opacity: 1; pointer-events: auto; }

  /* Subtle linen/canvas texture */
  .priv-texture {
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.45 0 0 0 0 0.32 0 0 0 0 0.2 0 0 0 0.07 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
    opacity: 0.85;
    pointer-events: none;
    z-index: 1;
  }
  /* Subtle dot grid overlay */
  .priv-dots {
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, rgba(139,87,42,0.15) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    pointer-events: none;
    z-index: 2;
  }
  #screen-private .priv-layout { position: relative; z-index: 5; }

  .priv-layout {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: auto;
    gap: 12px;
    min-height: 0;
  }

  /* ── Header row: same 3-col structure as business row-top ── */
  .priv-header {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 140px 148px; /* greeting | toggle-slot (empty) | date card */
    gap: 12px;
    height: 96px;                            /* match toggle / weather height */
    margin-bottom: 4px;
  }
  /* Greeting block — left column, transparent (no card) */
  .priv-greet-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 0 6px;
  }
  /* Middle column intentionally empty — toggle floats here */
  .priv-toggle-slot { /* placeholder, not rendered */ }

  .priv-greet-title {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 36px;
    color: var(--pt);
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .priv-greet-sub {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 15px;
    color: var(--pa);
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-top: 2px;
  }
  /* Date card — column 3, same dimensions as weather card */
  .priv-date-pill {
    background: var(--pc);
    border: 0.5px solid var(--pb2);
    border-radius: 18px;
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    /* no margin — column 3 of grid handles positioning */
  }
  .priv-date-day {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 16px;
    color: var(--pt);
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .priv-date-meta {
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--pt3);
    text-transform: uppercase;
    margin-top: 2px;
    font-family: -apple-system, sans-serif;
  }

  /* ── Card base ── */
  .priv-card {
    background: var(--pc);
    border: 0.5px solid var(--pb2);
    border-radius: 14px;
    padding: 14px 18px;
    position: relative;
  }
  .priv-card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--pt3);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .priv-card-label::before {
    content: '✦';
    font-size: 10px;
    color: var(--pa);
    font-weight: 400;
  }

  /* ── Habit cards (row of 4) ── */
  .habit-mini {
    grid-column: span 3;
    background: var(--pc);
    border: 0.5px solid var(--pb2);
    border-radius: 14px;
    padding: 18px 22px 14px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.22,1,0.36,1), background 0.25s, border-color 0.25s;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 168px;
  }
  .habit-mini:active { transform: scale(0.985); }
  .habit-mini.done { background: var(--pc2); }
  .habit-mini-emoji {
    font-size: 22px;
    line-height: 1;
    align-self: flex-start;
    margin-bottom: 6px;
  }
  .habit-mini-name {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    color: var(--pt);
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .habit-mini-name.placeholder { color: var(--pt3); font-weight: 500; }
  .habit-mini-goal {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.20em;
    color: var(--pt3);
    text-transform: uppercase;
    margin-top: 1px;
  }
  .habit-mini-bar {
    display: flex;
    gap: 3px;
    margin-top: 10px;
    margin-bottom: auto;
  }
  .habit-mini-bar-dot {
    flex: 1;
    height: 6px;
    border-radius: 1.5px;
    background: var(--phn);
  }
  .habit-mini-bar-dot.on { background: var(--pa); }
  .habit-mini-bar-dot.today { background: var(--pyel); }
  .habit-mini-foot {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .habit-mini-streak {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    font-weight: 600;
    color: var(--pa);
    letter-spacing: -0.01em;
  }
  .habit-mini-streak.zero {
    color: var(--pt3);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0;
  }
  .habit-mini-checkmark {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--pb3);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s, border-color 0.25s;
    flex-shrink: 0;
  }
  .habit-mini.done .habit-mini-checkmark {
    background: var(--pg);
    border-color: var(--pg);
  }
  .habit-mini.done .habit-mini-checkmark::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }

  /* ── Bottom row ── */
  .priv-bottom-row {
    grid-column: 1 / -1;
    display: flex;
    gap: 14px;
    align-items: stretch;
    min-height: 0;
  }
  .priv-ita-card  { flex: 6 0 0; display: flex; flex-direction: column; }
  .priv-life-card { flex: 3 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .priv-cal-mini  { flex: 3 0 0; display: flex; flex-direction: column; min-height: 0; }

  /* ── Italian Heatmap ── */
  .ita-grid { display: flex; gap: 4px; margin-top: 4px; }
  .ita-col { display: flex; flex-direction: column; gap: 4px; }
  .ita-cell {
    width: 19px; height: 19px;
    border-radius: 3px;
    cursor: pointer;
    background: var(--phn);
    transition: transform 0.12s;
    flex-shrink: 0;
  }
  .ita-cell:active { transform: scale(1.25); }
  .ita-cell.ita-today {
    outline: 1.5px solid var(--pa);
    outline-offset: 2px;
  }
  .ita-month-labels { display: flex; gap: 5px; margin-bottom: 5px; }
  .ita-month-span {
    font-size: 9.5px;
    font-weight: 600;
    color: var(--pt3);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }

  .ita-stats-rows {
    margin-top: 12px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
  }
  .ita-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-top: 0.5px solid var(--pb2);
  }
  .ita-stat-row:last-of-type { border-bottom: 0.5px solid var(--pb2); }
  .ita-stat-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--pt3);
    text-transform: uppercase;
  }
  .ita-stat-val {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    color: var(--pt);
    letter-spacing: -0.01em;
  }
  .ita-log-btn-big {
    margin-top: auto;
    background: var(--pa);
    color: #FBF0DD;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background 0.2s, transform 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .ita-log-btn-big:hover { background: var(--pa2); }
  .ita-log-btn-big:active { transform: scale(0.99); }

  /* ── Life Weeks Card ── */
  .life-hero-week {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 56px;
    color: var(--pa);
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin-top: 2px;
  }
  .life-hero-total {
    font-size: 12px;
    color: var(--pt2);
    margin-top: 10px;
    line-height: 1.5;
  }
  .life-hero-total strong { color: var(--pt); font-weight: 700; }
  .life-hero-meta {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--pt2);
    margin-top: 4px;
  }
  .life-progress-bar {
    height: 4px;
    background: var(--phn);
    border-radius: 99px;
    overflow: hidden;
    margin: 14px 0 12px;
  }
  .life-progress-fill {
    height: 100%;
    background: var(--pa);
    border-radius: 99px;
    transition: width 0.9s cubic-bezier(0.22,1,0.36,1);
  }
  .life-grid {
    display: grid;
    grid-template-columns: repeat(52, 4px);
    grid-auto-rows: 4px;
    gap: 1.5px;
    justify-content: start;
    margin-top: auto;
    max-height: 200px;
    overflow: hidden;
  }
  .life-cell {
    width: 4px; height: 4px;
    background: var(--phn);
  }
  .life-cell.lived   { background: var(--pt); opacity: 0.55; }
  .life-cell.current { background: var(--pa) !important; opacity: 1 !important; }

  /* ── Mini Calendar ── */
  .priv-cal-mini-frame {
    width: 100%;
    flex: 1;
    min-height: 0;
    border: 0.5px solid var(--pb2);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,0.4);
  }
  .priv-cal-mini-frame iframe {
    width: 100%; height: 100%;
    border: none;
    pointer-events: auto;
  }

  /* ── Life birthday form (first-run) ── */
  .life-bd-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 6px 0;
  }
  .life-bd-form label { font-size: 12px; color: var(--pt2); font-weight: 500; }
  .life-bd-input {
    border: 1px solid var(--pb3);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    background: rgba(255,255,255,0.6);
    color: var(--pt);
    font-family: inherit;
    width: 100%;
    -webkit-appearance: none;
  }
  .life-bd-save {
    background: var(--pa);
    color: #FBF0DD;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }


  /* ═══════════════════════════════════════════════════════════════
     BUSINESS SCREEN v3 — BLUE EDITORIAL (Lora + DM Sans)
     Toggle position untouched (top:20 right:184 width:132 height:96)
  ═══════════════════════════════════════════════════════════════ */
  :root {
    --biz-bg:        #EEF4FB;
    --biz-card:      #FFFFFF;
    --biz-card-soft: #F4F9FF;
    --biz-text:      #1A3050;
    --biz-text-mid:  #5B87B8;
    --biz-text-soft: #8AB5D8;
    --biz-accent:    #3E7EC4;
    --biz-border:        rgba(120,170,220,0.30);
    --biz-border-soft:   rgba(120,170,220,0.18);
    --biz-shadow:        0 2px 12px rgba(80,140,210,0.06);
    --biz-shadow-strong: 0 4px 16px rgba(80,140,210,0.10);
    --serif-biz: 'Plus Jakarta Sans', 'DM Sans', sans-serif; /* no actual serif — clean modern */
    --sans-biz:  'Plus Jakarta Sans', 'DM Sans', sans-serif;
  }

  body { background: var(--biz-bg); }

  #screen-business {
    background: var(--biz-bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(160,190,230,0.32) 1px, transparent 0);
    background-size: 22px 22px;
    font-family: var(--sans-biz);
    color: var(--biz-text);
  }

  /* All cards inside business → white, blue-tinted border */
  #screen-business .card {
    background: var(--biz-card);
    border: 0.5px solid var(--biz-border);
    border-radius: 18px;
    box-shadow: var(--biz-shadow);
  }

  /* Time card → transparent, large Lora italic clock */
  #screen-business .card-time {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 8px 8px 0 6px;
    align-items: flex-end;
  }
  #screen-business .time-display {
    font-family: var(--sans-biz);
    font-weight: 300;
    font-size: clamp(40px, 5.6vw, 58px);
    letter-spacing: -2px;
    color: var(--biz-text);
  }
  #screen-business .time-date {
    font-family: var(--sans-biz);
    font-size: 13px;
    color: var(--biz-text-mid);
    letter-spacing: 0.01em;
    margin-top: 4px;
    font-weight: 400;
  }
  #screen-business .morning-btn {
    background: var(--biz-accent);
    box-shadow: 0 4px 16px rgba(62,126,196,0.32);
  }
  #screen-business .morning-btn.speaking { background: #E05C5C; box-shadow: 0 4px 16px rgba(224,92,92,0.30); }

  /* Weather card */
  #screen-business .weather-temp {
    font-family: var(--sans-biz);
    font-weight: 300;
    color: var(--biz-text);
    letter-spacing: -1.5px;
  }
  #screen-business .weather-desc { color: var(--biz-text-mid); font-family: var(--sans-biz); }
  #screen-business .weather-feel,
  #screen-business .weather-city { color: var(--biz-text-soft); }

  /* Section labels — uppercase tracked tag with + glyph */
  #screen-business .section-header {
    border-bottom: 0.5px solid var(--biz-border-soft);
  }
  #screen-business .section-label {
    font-family: var(--sans-biz);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--biz-text-soft);
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  #screen-business .section-label::before {
    content: '+';
    font-size: 10px;
    color: var(--biz-text-soft);
    font-weight: 400;
  }
  #screen-business .section-badge {
    font-size: 10px;
    background: rgba(62,126,196,0.10);
    color: var(--biz-accent);
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* Pipeline */
  #screen-business .pipeline-list { padding: 10px; gap: 8px; }
  #screen-business .pipeline-item {
    background: var(--biz-card-soft);
    border: 0.5px solid var(--biz-border-soft);
    border-radius: 12px;
    padding: 12px 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #screen-business .pipeline-item:hover {
    transform: translateY(-1px);
    box-shadow: var(--biz-shadow-strong);
  }
  #screen-business .pipeline-name {
    font-family: var(--sans-biz);
    font-weight: 600;
    color: var(--biz-text);
    font-size: 13.5px;
    letter-spacing: -0.2px;
  }
  #screen-business .pipeline-status,
  #screen-business .pipeline-action {
    color: var(--biz-text-mid);
    font-size: 12px;
    font-family: var(--sans-biz);
  }
  #screen-business .pipeline-amount {
    color: var(--biz-accent);
    font-weight: 500;
    font-size: 12.5px;
    font-family: var(--sans-biz);
  }
  #screen-business .pipeline-date {
    color: var(--biz-text-soft);
    font-family: var(--sans-biz);
  }

  /* Morgen-Block */
  #screen-business .morgen-block { border-top: 0.5px solid var(--biz-border-soft); }
  #screen-business .morgen-time { color: var(--biz-text-soft); }
  #screen-business .morgen-title { color: var(--biz-text); }

  /* Fokus card */
  #screen-business .card-fokus {
    border-left: 3px solid var(--biz-accent);
    border-radius: 0 18px 18px 0;
  }
  #screen-business .fokus-text {
    font-family: var(--sans-biz);
    font-weight: 500;
    color: var(--biz-text);
    font-size: clamp(15px, 1.8vw, 18px);
    letter-spacing: -0.3px;
    line-height: 1.3;
  }
  #screen-business .ziel-banner {
    background: rgba(62,126,196,0.08);
    color: var(--biz-text-mid);
  }
  #screen-business .ziel-banner-dot { background: var(--biz-accent); }
  #screen-business .ziel-banner-text { color: var(--biz-text); }

  /* Cashflow */
  #screen-business .cashflow-value {
    font-family: var(--sans-biz);
    font-weight: 300;
    color: var(--biz-text);
    font-size: 28px;
    letter-spacing: -1px;
  }
  #screen-business .cashflow-sep,
  #screen-business .cashflow-goal {
    color: var(--biz-text-soft);
    font-family: var(--sans-biz);
    font-weight: 300;
  }
  #screen-business .cashflow-sub { color: var(--biz-text-soft); }
  #screen-business .cashflow-bar-wrap { background: rgba(120,170,220,0.14); height: 4px; }
  #screen-business .cashflow-bar-fill { background: var(--biz-accent); }

  /* Gmail / Zoho mini cards */
  #screen-business .gmail-count {
    font-family: var(--sans-biz);
    font-weight: 300;
    color: var(--biz-text);
    letter-spacing: -0.8px;
  }
  #screen-business .gmail-sub { color: var(--biz-text-soft); }
  #screen-business .gmail-login-btn {
    background: var(--biz-accent);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: var(--sans-biz);
  }
  #screen-business .zoho-main { color: var(--biz-text); }
  #screen-business .zoho-amount {
    font-family: var(--sans-biz);
    font-weight: 300;
    color: #D88A3C;
    letter-spacing: -0.8px;
  }
  #screen-business .zoho-due { color: var(--biz-text-soft); }

  /* Calendar iframe — softer container */
  #screen-business .card-calendar { background: var(--biz-card); }
  #screen-business .calendar-iframe-wrap iframe { background: var(--biz-card); }

  /* Skeleton loader → blue-tinted */
  #screen-business .skel {
    background: linear-gradient(90deg, #E5EEF7 25%, #D5E2EF 50%, #E5EEF7 75%);
    background-size: 300% 100%;
  }

  /* Goal modal — match blue editorial */
  #screen-business .goal-eyebrow { color: var(--biz-accent); }
  #screen-business .goal-input:focus { box-shadow: 0 0 0 2px var(--biz-accent); }
  #screen-business .goal-btn-primary { background: var(--biz-accent); }

</style>
</head>
<body>



<!-- ── Single animated toggle — always at same position, z:10000 above everything ── -->
<div id="view-toggle" onclick="toggleView()">
  <span class="view-switch-label" id="view-toggle-label">Business</span>
  <div class="view-switch-pill"><div class="view-switch-thumb"></div></div>
</div>

<div class="screen" id="screen-business">

  <!-- ── ROW 1: Zeit + Wetter ── -->
  <div class="row-top">

    <div class="card card-time">
      <div>
        <div class="time-display" id="clock">00:00</div>
        <div class="time-date"    id="datestr">Laden…</div>
      </div>
      <div class="time-actions">
        <button class="morning-btn" id="morning-btn" onclick="startMorningReport()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/>
            <line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
            <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/>
            <line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/>
          </svg>
          <span class="btn-label">Morning Report</span>
        </button>
      </div><!-- /.time-actions -->
    </div>

    <div class="card card-weather" id="weather-card">
      <div class="weather-skel">
        <div>
          <span class="skel" style="width:28px;height:20px;margin-bottom:6px;"></span>
          <span class="skel" style="width:64px;height:34px;"></span>
        </div>
        <div>
          <span class="skel" style="width:80px;height:12px;margin-bottom:4px;"></span>
          <span class="skel" style="width:52px;height:11px;margin-bottom:2px;"></span>
          <span class="skel" style="width:44px;height:11px;"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── ROW 2: Kalender + Pipeline ── -->
  <div class="row-middle">

    <div class="card card-calendar">
      <div class="section-header">
        <span class="section-label">Kalender</span>
        <span class="section-badge" id="cal-date"></span>
      </div>
      <div class="calendar-iframe-wrap">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=simon-raphael.moser%40web.de&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=1&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%23FFFFFF&color=%230A84FF"
          scrolling="no"
          allowtransparency="true">
        </iframe>
      </div>
    </div>

    <div class="card card-pipeline">
      <div class="section-header">
        <span class="section-label">Pipeline</span>
        <span class="section-badge" id="pipeline-badge"></span>
      </div>
      <div class="pipeline-list" id="pipeline-list">
        <!-- Skeleton -->
        <div class="pipeline-item">

  '03d':'☁️','03n':'☁️','04d':'☁️','04n':'☁️',

// ── Hilfsfunktionen ───────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n, unit) {
  if (n === null || n === undefined || isNaN(Number(n))) return '—';
  const formatted = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(Number(n));
  return unit ? formatted + '\u202F' + unit : formatted;
}

// ── Notion Blocks API ────────────────────────────────────────
// Liest eine einfache Notion-Tabelle (type: "table") per Blocks API
async function notionGetBlocks(blockId) {
  const res = await fetch(`/api/notion?endpoint=blocks/${blockId}/children&page_size=50`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Parst Notion table_row Blöcke → Array von Objekten
// Erste Zeile wird als Header-Zeile behandelt
function parseNotionTable(data) {
  const rows = (data.results || []).filter(b => b.type === 'table_row');
  if (rows.length < 2) return [];
  const cellText = cells => (cells || []).map(t => t.plain_text || t.text?.content || '').join('').trim();
  const headers  = rows[0].table_row.cells.map(cellText);
  return rows.slice(1).map(row => {
    const obj = {};
    row.table_row.cells.forEach((cell, i) => { if (headers[i]) obj[headers[i]] = cellText(cell); });
    return obj;
  });
}

// Zahl aus deutschem Format: "1.000,50" → 1000.5, "1000" → 1000
function parseNum(s) {
  if (typeof s === 'number') return s;
  if (!s) return 0;
  const str = String(s).trim();
  // Deutsches Format: Punkt = Tausender, Komma = Dezimal
  if (/\d\.\d{3}/.test(str)) return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  // Englisches Format oder plain
  return parseFloat(str.replace(',', '.').replace(/[^0-9.-]/g, '')) || 0;
}

// ── Fokus heute ───────────────────────────────────────────────
async function loadFokus() {

    if (!rows.length) {
      document.getElementById('fokus-text').textContent = 'Kein Fokus eingetragen.';

    // Neueste Zeile (letzte Zeile = aktuellster Eintrag bei chronologischer Reihenfolge)
    const entry = rows[rows.length - 1];

    const text = entry['Fokus'] || entry['Fokus-Satz'] || entry['Text'] || entry['Satz']

// ── Cashflow ──────────────────────────────────────────────────
async function loadCashflow() {
  try {
    const now  = new Date();
    const data = await notionGetBlocks(TABLE.cashflow);
    const rows = parseNotionTable(data);

    if (!rows.length) {
      document.getElementById('cashflow-inner').innerHTML =
        '<div class="state-msg" style="padding:0;margin-top:4px;">Keine Daten</div>';
      return;
    }

    // Aktuellen Monat suchen, sonst letzte Zeile
    const curMonthName = MONTHS[now.getMonth()].toLowerCase();
    const curMonthNum  = String(now.getMonth() + 1).padStart(2, '0');
    let entry = rows.find(r => {
      const m = String(r['Monat'] || r['Month'] || r['Name'] || '').toLowerCase();
      return m.includes(curMonthName) || m.includes(curMonthNum);
    }) || rows[rows.length - 1];

    const einnahmen = parseNum(entry['Einnahmen'] || entry['Revenue'] || 0);
    const ziel      = parseNum(entry['Ziel']      || entry['Goal']    || 0);
    const offen     = entry['Offene Rechnungen']  || entry['Offen']   || null;
    const pct       = ziel > 0 ? Math.min(Math.round((einnahmen / ziel) * 100), 100) : 0;

    document.getElementById('cashflow-inner').innerHTML = `
      <div class="fade-in">
        <div class="cashflow-row">
          <span class="cashflow-value">${fmtNum(einnahmen)}</span>
          <span class="cashflow-sep"> / </span>
          <span class="cashflow-goal">${fmtNum(ziel)} €</span>
        </div>
        <div class="cashflow-bar-wrap">
          <div class="cashflow-bar-fill" style="width:${pct}%;"></div>

        <div class="cashflow-sub" style="margin-top:4px;">
          ${pct} % des Ziels${offen ? ' · ' + esc(offen) + ' € offen' : ''}

      </div>`;

  } catch (err) {
    console.error('Cashflow:', err);
    document.getElementById('cashflow-inner').innerHTML =
      '<div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Nicht verfügbar</div>';
  }
}

const GMAIL_CLIENT_ID = '149854563695-aed5l06t838g3squp8kd3c8bf9k8looi.apps.googleusercontent.com';

// ── Gmail Widget ──────────────────────────────────────────────
// Scope umfasst Gmail + Calendar — ein OAuth-Flow für beide
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.readonly';

// ── Google Auth — Persistent Token mit proaktivem Refresh ─────
// Access Tokens leben 1h. Wir erneuern sie 5 Min vor Ablauf still
// im Hintergrund, solange die Google-Session aktiv ist (= immer auf iPad).

let _googleToken  = null;
let _refreshTimer = null;

function gmailTokenLoad() {
  try {
    const d = JSON.parse(localStorage.getItem('gmail_token') || 'null');
    if (d && Date.now() < d.expires) return { token: d.token, expires: d.expires };
  } catch {}
  return null;
}

function gmailTokenSave(token, expiresIn) {
  const expiresAt = Date.now() + (expiresIn || 3600) * 1000;
  localStorage.setItem('gmail_token', JSON.stringify({ token, expires: expiresAt }));
  _googleScheduleRefresh(expiresAt);
}

function gmailTokenClear() {
  localStorage.removeItem('gmail_token');
  if (_refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; }
}

// Planen: 5 Minuten vor Ablauf still neuen Token holen
function _googleScheduleRefresh(expiresAt) {
  if (_refreshTimer) clearTimeout(_refreshTimer);
  const delay = expiresAt - Date.now() - 5 * 60_000; // 5 min vor Ablauf
  _refreshTimer = setTimeout(_googleSilentRefresh, Math.max(delay, 10_000));
  console.log('[Auth] Token refresh in', Math.round(Math.max(delay,10000)/60000), 'Min geplant');
}

// Stilles Re-Auth — kein Dialog, kein Reload
async function _googleSilentRefresh() {
  if (!window.google?.accounts?.oauth2) return;
  console.log('[Auth] Stilles Token-Refresh läuft…');
  const token = await new Promise(resolve => {
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => resolve(r?.access_token || null),
        error_callback: () => resolve(null),
      });
      client.requestAccessToken({ prompt: 'none' });
    } catch { resolve(null); }
    setTimeout(() => resolve(null), 10_000); // 10s Timeout (iOS braucht mehr Zeit)
  });

  if (token) {
    gmailTokenSave(token, 3600);
    _googleToken = token;
    console.log('[Auth] Token still erneuert ✓');
    // UI im Hintergrund aktualisieren
    try { gmailRenderCount(await gmailFetch(token)); } catch {}
    morgenLoad();
  } else {
    // Stilles Refresh fehlgeschlagen → dezenter Hinweis ohne UI zu brechen
    console.warn('[Auth] Stilles Refresh fehlgeschlagen');
    _gmailShowRefreshHint();
  }
}

  hint.textContent = 'Tippen zum Verlängern';
  hint.style.cssText = 'font-size:9.5px;color:var(--accent-blue);margin-top:4px;cursor:pointer;';
  hint.onclick = () => gmailLogin();
  el.appendChild(hint);
}

    <div class="fade-in">

async function gmailFetch(token) {
  const r = await fetch(
    'https://gmail.googleapis.com/gmail/v1/users/me/threads?q=is:unread+in:inbox+category:primary&maxResults=50',
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (r.status === 401) throw Object.assign(new Error('401'), { status: 401 });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return (d.threads || []).length;
}

async function gmailLoad() {
  // 1. Gespeicherter, noch gültiger Token?
  const stored = gmailTokenLoad();
  if (stored) {
    _googleToken = stored.token;
    _googleScheduleRefresh(stored.expires); // Refresh-Timer (neu) starten
    try {
      gmailRenderCount(await gmailFetch(stored.token));
      morgenLoad();
      return;
    } catch (e) {
      if (e.status === 401) { gmailTokenClear(); _googleToken = null; }
      else return; // Netzwerk-Fehler, nicht ausloggen
    }
  }

  // 2. Kein/abgelaufener Token → stilles Re-Auth
  const token = await new Promise(resolve => {
    if (!window.google?.accounts?.oauth2) { resolve(null); return; }
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPE,
        callback: r => resolve(r?.access_token || null),
        error_callback: () => resolve(null),
      });
      client.requestAccessToken({ prompt: 'none' });
    } catch { resolve(null); }
    setTimeout(() => resolve(null), 10_000);
  });

  if (token) {
    // Bei frischem Silent-Auth einmalig Calendar-Scope prüfen
    const calOk = await hasCalendarScope(token);
    if (!calOk) {
      // Scope fehlt → manueller Login mit consent nötig
      gmailRenderLogin(); morgenRenderLoginHint(); return;
    }
    gmailTokenSave(token, 3600);
    _googleToken = token;
    try { gmailRenderCount(await gmailFetch(token)); } catch { gmailRenderError(); }
    morgenLoad();
    return;
  }

  // 3. Alles fehlgeschlagen → Login-Button
  gmailRenderLogin();
  morgenRenderLoginHint();
}

function gmailLogin() {
  if (!window.google?.accounts?.oauth2) { gmailRenderError(); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: GMAIL_CLIENT_ID,
    scope: GMAIL_SCOPE,
    callback: async r => {
      if (!r.access_token) { gmailRenderError(); return; }
      gmailTokenSave(r.access_token, r.expires_in);
      _googleToken = r.access_token;
      try { gmailRenderCount(await gmailFetch(r.access_token)); }
      catch { gmailRenderError(); }
      morgenLoad();
    },
  }).requestAccessToken({ prompt: 'consent' });
}

function buildMorningText(d) {
  const now      = new Date();
  const hour     = now.getHours();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);

  const wochentag  = d.date.split(',')[0]?.trim() || 'Heute';
  const datumKurz  = d.date.split(', ').slice(1).join(', ').replace(/\s+\d{4}$/, '') || d.date;
  const greet      = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';
  const morgenTag  = DAYS[tomorrow.getDay()];

  const parts = [];

  // 1. Begrüßung
  parts.push(`${greet}, Simon! Es ist ${d.time} Uhr, ${wochentag} der ${datumKurz}.`);

  // 2. Wetter — Zeilen bereinigen, Emoji-Zeilen rausfiltern
  const wLines = d.weather.split('\n')
    .map(s => s.trim())
    .filter(s => s && s.length > 1 && !/^\p{Emoji_Presentation}$/u.test(s));
  const wTemp  = wLines.find(s => /^\d+°$/.test(s) || s.match(/^\d+°$/));
  const wDesc  = wLines.find(s => !/\d/.test(s) && !s.includes('Laubach') && !s.includes('Fühlt') && s.length > 3);
  const wFeels = wLines.find(s => s.includes('Fühlt'));
  if (wDesc || wTemp) {
    let w = 'Draußen in Laubach';
    if (wTemp) w += ` sind es ${wTemp}`;
    if (wDesc) w += `, ${wDesc.toLowerCase()}`;
    if (wFeels) w += `, ${wFeels.toLowerCase().replace('fühlt:', 'gefühlt').replace('fühlt: ', 'gefühlt ')}`;
    parts.push(w + '.');
  }

  // 3. Fokus
  const fokus = d.fokus.replace(/\n.*/s, '').trim();
  const fokusLeer = !fokus || ['—', 'Kein Fokus', 'Nicht verfügbar', 'Kein Fokus eingetragen'].some(s => fokus.includes(s));
  if (!fokusLeer) {
    parts.push(`Dein Fokus für heute: ${fokus}.`);
  } else {
    parts.push('Für heute ist noch kein Fokus eingetragen.');
  }

  // 4. Pipeline
  const leads = d.pipeline.filter(l => !l.includes('Nicht verfügbar'));
  if (leads.length) {
    const firstName = leads[0].split(' · ')[0].trim();
    if (leads.length === 1) {
      parts.push(`In deiner Pipeline läuft gerade ein aktiver Lead: ${firstName}.`);
    } else {
      const others = leads.slice(1).map(l => l.split(' · ')[0].trim());
      const list   = others.length === 1
        ? `${firstName} und ${others[0]}`
        : `${firstName}, ${others.slice(0, -1).join(', ')} und ${others.at(-1)}`;
      parts.push(`Du hast ${leads.length} aktive Leads in der Pipeline: ${list}.`);
    }
  }

  // 5. Cashflow
  const cfClean = d.cashflow.replace(/\s+/g, ' ').trim();
  const cfLeer  = !cfClean || ['Keine Daten', 'Nicht verfügbar'].some(s => cfClean.includes(s));
  if (!cfLeer) {
    // Nur Zahlen extrahieren: "400 / 1.000 € 40 % des Ziels" → lesbar machen
    const match = cfClean.match(/([\d.,]+)\s*\/\s*([\d.,]+)\s*€/);
    if (match) {
      parts.push(`Beim Cashflow stehst du diesen Monat bei ${match[1]} von ${match[2]} Euro Ziel.`);
    } else {
      parts.push(`Zum Cashflow: ${cfClean.split('\n')[0]}.`);
    }
  }

  // 6. Abschluss
  const closings = [
    `Morgen ist ${morgenTag} — noch ist heute, pack es an!`,
    `Einen produktiven ${wochentag} dir, mach was draus!`,
    `Morgen erwartet dich schon der ${morgenTag}, also nutze den heutigen Tag.`,
  ];
  parts.push(closings[now.getMinutes() % closings.length]);

  return parts.join(' ');
}

function dateKey(d) {

function goalKey(d) { return 'goal_for_' + dateKey(d); }

function goalCheckEvening() {
  const now = new Date();
  const hour = now.getHours();
  // Zwischen 20:00 und 23:59 — und nur einmal pro Abend
  if (hour < 20 || hour > 23) return;

  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);
  const key = goalKey(tomorrow);

  // Wenn heute schon gespeichert oder geskipped → nicht erneut zeigen
  if (localStorage.getItem(key) !== null) return;
  // Nicht erneut zeigen, wenn Modal bereits offen
  if (document.getElementById('goal-modal').classList.contains('show')) return;

  goalShowModal(tomorrow);

function goalShowModal(tomorrow) {

function goalSave() {
  const val = document.getElementById('goal-input').value.trim();
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (val) localStorage.setItem(goalKey(tomorrow), val);
  else     localStorage.setItem(goalKey(tomorrow), ''); // leer = bewusst übersprungen
  document.getElementById('goal-modal').classList.remove('show');
  goalRenderToday();
}

function goalSkip() {
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  // Markieren als "heute nicht mehr fragen", aber leer lassen
  localStorage.setItem(goalKey(tomorrow), '');
  document.getElementById('goal-modal').classList.remove('show');

function goalRenderToday() {
  const today = new Date();

    document.getElementById('ziel-banner-text').textContent = stored;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

// Hilfsfunktion: Events aus einem einzelnen Kalender holen
async function fetchEventsForDay(calId, start, end) {
  try {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?`
      + `timeMin=${encodeURIComponent(start.toISOString())}`
      + `&timeMax=${encodeURIComponent(end.toISOString())}`
      + `&singleEvents=true&orderBy=startTime&maxResults=30`;
    const r = await fetch(url, { headers: { Authorization: 'Bearer ' + _googleToken } });
    if (!r.ok) return [];
    const d = await r.json();
    return d.items || [];
  } catch { return []; }
}

// Kalender-ID aus dem Dashboard-Iframe (simon-raphael.moser@web.de)
const DASHBOARD_CAL_ID = 'simon-raphael.moser@web.de';

async function todayLoad() {
  if (!_googleToken) return;
  try {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end   = new Date(); end.setHours(23, 59, 59, 999);

    // Dashboard-Kalender immer explizit + alle weiteren aus der Liste
    const listRes = await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
      { headers: { Authorization: 'Bearer ' + _googleToken } }
    );
    const calList = listRes.ok ? await listRes.json() : { items: [] };
    const calIds  = [...new Set([
      DASHBOARD_CAL_ID,
      'primary',
      ...(calList.items || []).map(c => c.id),
    ])];

    const allEvents = (await Promise.all(calIds.map(id => fetchEventsForDay(id, start, end)))).flat();

    // Sortieren + deduplizieren (nach eventId)
    const seen = new Set();
    const sorted = allEvents
      .filter(ev => { const k = ev.id; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => new Date(a.start?.dateTime || a.start?.date) - new Date(b.start?.dateTime || b.start?.date));

    window._mrEvents = sorted.map(ev => ({
      time:  ev.start?.dateTime
        ? new Date(ev.start.dateTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
        : 'Ganztags',
      title: ev.summary || '(ohne Titel)',
    }));
  } catch { /* ignorieren */ }
}

    const overlay = document.createElement('div');
    overlay.style.cssText = [
      'position:fixed','inset:0','z-index:99999','background:#fff',
      'overflow:auto','padding:20px 16px','font-family:-apple-system,monospace',
      'font-size:13px','color:#1c1c1e','line-height:1.5',
    ].join(';');

    if (!_googleToken) {
      overlay.innerHTML = '<h2>Kein Google-Token</h2><p>Zuerst Gmail anmelden, dann ?debug aufrufen.</p>';
      document.body.appendChild(overlay);
      return;
    }

    overlay.innerHTML = '<h2 style="margin-bottom:12px">⏳ Lade Kalender…</h2>';
    document.body.appendChild(overlay);

    try {
      // 1. Alle Kalender auflisten
      const listRes = await fetch(
        'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',
        { headers: { Authorization: 'Bearer ' + _googleToken } }
      );
      const listStatus = listRes.status;
      const listBody = await listRes.text();
      let calList = { items: [] };
      try { calList = JSON.parse(listBody); } catch {}
      const cals = calList.items || [];

      // Scope-Fehler anzeigen
      if (!listRes.ok) {
        const reAuthBtn = `<button onclick="gmailTokenClear();gmailLogin();" style="margin-top:12px;background:#0A84FF;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:15px;cursor:pointer;font-weight:600;">Neu anmelden (mit Kalender-Zugriff)</button>`;
        overlay.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:18px;font-weight:700;">Kalender Debug</h2>
            <button onclick="this.closest('div[style]').remove()" style="background:#f2f2f7;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;">Schließen</button>
          </div>
          <div style="background:#fff3f3;border:1px solid #ffcdd2;border-radius:10px;padding:14px;margin-bottom:12px;">
            <div style="font-weight:700;color:#d32f2f;margin-bottom:6px;">⚠️ calendarList API Fehler ${listStatus}</div>
            <pre style="font-size:11px;color:#555;white-space:pre-wrap;word-break:break-all;">${listBody.slice(0,400)}</pre>
          </div>
          <p style="color:#3c3c43;margin-bottom:4px;">Das Token hat keinen Kalender-Scope. Du musst dich neu einloggen:</p>
          ${reAuthBtn}
          <div style="margin-top:14px;font-size:11px;color:#8e8e93;">Token: ${_googleToken.slice(0,20)}…</div>`;
        return;
      }

      // 2. Heute-Events aus jedem Kalender
      const start = new Date(); start.setHours(0, 0, 0, 0);
      const end   = new Date(); end.setHours(23, 59, 59, 999);

      const calResults = await Promise.all(cals.map(async cal => {
        const evs = await fetchEventsForDay(cal.id, start, end);
        return { id: cal.id, name: cal.summary || cal.id, color: cal.backgroundColor || '#888', evs };
      }));

      // Auch explizit den Dashboard-Kalender testen
      const dashEvs = await fetchEventsForDay(DASHBOARD_CAL_ID, start, end);

      // 3. HTML bauen
      const rows = calResults.map(c => {
        const evHtml = c.evs.length
          ? c.evs.map(e => {
              const t = e.start?.dateTime
                ? new Date(e.start.dateTime).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' })
                : 'Ganztags';
              return `<div style="padding:2px 0 2px 16px;color:#3c3c43">⏱ ${t} — ${e.summary || '?'}</div>`;
            }).join('')
          : '<div style="padding:2px 0 2px 16px;color:#aeaeb2">keine Events heute</div>';
        return `
          <div style="margin-bottom:14px;border:1px solid #eee;border-radius:10px;padding:10px 12px;">
            <div style="font-weight:600;margin-bottom:4px;">
              <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color};margin-right:6px;vertical-align:middle;"></span>
              ${c.name}
            </div>
            <div style="font-size:11px;color:#8e8e93;margin-bottom:6px;">${c.id}</div>
            ${evHtml}
          </div>`;
      }).join('');

      const dashSection = dashEvs.length
        ? dashEvs.map(e => {
            const t = e.start?.dateTime
              ? new Date(e.start.dateTime).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' })
              : 'Ganztags';
            return `<div>⏱ ${t} — ${e.summary || '?'}</div>`;
          }).join('')
        : '<div style="color:#aeaeb2">Keine Events gefunden</div>';

      const totalEvs = calResults.reduce((s, c) => s + c.evs.length, 0);

      overlay.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="font-size:18px;font-weight:700;">Kalender Debug</h2>
          <button onclick="this.closest('div[style]').remove()" style="background:#f2f2f7;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;">Schließen</button>
        </div>

        <div style="background:#f9f9fb;border-radius:10px;padding:12px;margin-bottom:16px;">
          <div style="font-weight:600;margin-bottom:6px;">📋 Dashboard-Kalender (simon-raphael.moser@web.de)</div>
          ${dashSection}
        </div>

        <div style="font-weight:600;margin-bottom:10px;">
          Alle ${cals.length} Kalender — ${totalEvs} Events heute total
        </div>
        ${rows || '<div style="color:#aeaeb2">Keine Kalender gefunden</div>'}

        <div style="margin-top:16px;font-size:11px;color:#8e8e93;">
          Token: ${_googleToken ? _googleToken.slice(0,20) + '…' : 'fehlt'}
        </div>`;

    } catch (err) {
      overlay.innerHTML = `<h2>Fehler</h2><pre>${err.message}</pre>
        <button onclick="this.closest('div[style]').remove()">Schließen</button>`;
    }
  }
  // Kurz nach Load starten (Token braucht einen Moment)
  window.addEventListener('load', () => setTimeout(runCalDebug, 2000));
}
</script>
<script src="morningReport.js"></script>

<script>
'use strict';
// ═════════════════════════════════════════════════════════════
// PRIVATE VIEW
// ═════════════════════════════════════════════════════════════

let _currentView = 'business';

function switchView(target) {
  if (target === _currentView) return;
  _currentView = target;
  const priv   = document.getElementById('screen-private');
  const toggle = document.getElementById('view-toggle');
  const label  = document.getElementById('view-toggle-label');
  const isPriv = _currentView === 'private';
  if (isPriv) { priv.classList.add('active'); renderPrivate(); }
  else         { priv.classList.remove('active'); }
  // Animate the single toggle: thumb slides, colour + label change
  if (toggle) toggle.classList.toggle('priv-mode', isPriv);
  if (label)  label.textContent = isPriv ? 'Privat' : 'Business';
  scheduleAutoSwitch();
}
function toggleView() { switchView(_currentView === 'business' ? 'private' : 'business'); }

// ── Auto-Switch: 20 min Business → 5 min Privat → loop ──────
const _AUTO_DELAY = { business: 20 * 60_000, private: 5 * 60_000 };
let _autoTimer = null;

function scheduleAutoSwitch() {
  if (_autoTimer) clearTimeout(_autoTimer);
  const delay = _AUTO_DELAY[_currentView];
  _autoTimer = setTimeout(() => {
    switchView(_currentView === 'business' ? 'private' : 'business');
  }, delay);
}
scheduleAutoSwitch(); // Start loop on page load

// ── Helpers ──
function privDateKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── Habits ──
const HABITS_CFG = [
  { id:'gym',     name:'Gym',                              goal:'2× / Woche', short:'Gym',  emoji:'💪' },
  { id:'ita',     name:'Italiano',                         goal:'täglich',    short:'Ita',  emoji:'🇮🇹' },
  { id:'nodoom',  name:'Kein Doomscrolling vor dem Aufstehen', goal:'täglich', short:'Doom', emoji:'🌿' },
  { id:'kreatin', name:'Kreatin',                          goal:'täglich',    short:'Krea', emoji:'🥛' },
];

function privGreeting() {
  const h=new Date().getHours();
  if (h<5)  return 'Gute Nacht';
  if (h<11) return 'Guten Morgen';
  if (h<14) return 'Hallo';
  if (h<18) return 'Schönen Nachmittag';
  if (h<22) return 'Guten Abend';
  return 'Späte Stunde';
}

function habitsLoad() { try { return JSON.parse(localStorage.getItem('priv_habits')||'{}'); } catch { return {}; } }
function habitsSave(d) { localStorage.setItem('priv_habits', JSON.stringify(d)); }

function habitToggle(hid) {
  // Always use TODAY's date key — never embedded from render-time
  const today = privDateKey(new Date());
  const d = habitsLoad();
  if (!d[hid]) d[hid] = {};
  d[hid][today] = !d[hid][today];
  habitsSave(d);
  renderHabits();
}

function habitStreak(hid, all) {
  const days = all[hid]||{};
  let streak=0, d=new Date();
  if (!days[privDateKey(d)]) d.setDate(d.getDate()-1);
  while (days[privDateKey(d)]) { streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function habitRecord(hid, all) {
  const days = all[hid]||{};
  const keys = Object.keys(days).filter(k=>days[k]).sort();
  if (!keys.length) return 0;
  let max=1, cur=1;
  for (let i=1;i<keys.length;i++) {
    const diff=Math.round((new Date(keys[i])-new Date(keys[i-1]))/86400000);
    if (diff===1){cur++;if(cur>max)max=cur;}else{cur=1;}
  }
  return max;
}

function habitEditCustom() {
  const name = prompt('Name für diese Habit:', localStorage.getItem('priv_habit_custom_name')||'');
  if (name===null) return;
  localStorage.setItem('priv_habit_custom_name', name.trim());
  renderHabits();
}

// ── Life Weeks ──
function lifeSaveBirthdate() {
  const val = document.getElementById('life-bd-input').value;
  if (!val) return;
  localStorage.setItem('priv_birthdate', val);
  renderLifeWeeks();
}

// ── Italian Minutes ──
function itaLoad() { try { return JSON.parse(localStorage.getItem('priv_ita_min')||'{}'); } catch { return {}; } }
function itaMinsToColor(m) {
  if (!m)    return '#E5D8BD';   // empty beige
  if (m<10)  return '#B8C99F';   // light olive
  if (m<=30) return '#7A9258';   // mid olive
  return '#5A7A3F';              // strong olive
}
function itaLogDay(ds) {
  const data=itaLoad(), cur=data[ds]||0;
  const raw=prompt('Lernminuten ('+ds+', aktuell '+cur+' Min):', cur||'');
  if (raw===null) return;
  data[ds]=Math.max(0,parseInt(raw)||0);
  localStorage.setItem('priv_ita_min',JSON.stringify(data));
  renderItaHeatmap();
}

// ── Master render ──
function _privWeekNumber(d) {
  // ISO week number
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  return 1 + Math.ceil((firstThursday - target) / (7 * 86400000));
}
function _privDayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function renderPrivate() {
  const now = new Date();
  const greetTitle = document.getElementById('priv-greet-title');
  const greetSub   = document.getElementById('priv-greet-sub');
  const dateDay    = document.getElementById('priv-date-day');
  const dateMeta   = document.getElementById('priv-date-meta');

  if (greetTitle) greetTitle.textContent = privGreeting() + ', Simon.';
  if (greetSub)   greetSub.textContent   = 'Schön, dich zu sehen.';
  if (dateDay)    dateDay.textContent    = DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()];
  if (dateMeta)   dateMeta.textContent   = 'KW ' + _privWeekNumber(now) + ' · TAG ' + _privDayOfYear(now);

  renderHabits(); renderLifeWeeks(); renderItaHeatmap();
}

function renderHabits() {
  const all=habitsLoad(), today=privDateKey(new Date());
  const tilesEl=document.getElementById('habit-tiles');
  if (!tilesEl) return;

  tilesEl.innerHTML=HABITS_CFG.map(h=>{
    const days=all[h.id]||{};
    const done=days[today]||false;
    const streak=habitStreak(h.id,all), record=habitRecord(h.id,all);

    // 14-day mini bar
    let bar='';
    for (let i=13;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const k=privDateKey(d), isToday=i===0, on=days[k];
      bar+='<span class="habit-mini-bar-dot'+(on?' on':'')+(isToday?' today':'')+'"></span>';
    }

    const streakHtml = streak>0
      ? '<span class="habit-mini-streak">'+streak+' '+(streak===1?'Tag':'Tage')+' 🔥</span>'
      : '<span class="habit-mini-streak zero">—</span>';

    return '<div class="habit-mini'+(done?' done':'')+'" onclick="habitToggle(\''+h.id+'\')">'
      +'<div class="habit-mini-emoji">'+h.emoji+'</div>'
      +'<div class="habit-mini-name">'+esc(h.name)+'</div>'
      +'<div class="habit-mini-goal">'+h.goal+'</div>'
      +'<div class="habit-mini-bar">'+bar+'</div>'
      +'<div class="habit-mini-foot">'+streakHtml+'<div class="habit-mini-checkmark"></div></div>'
      +'</div>';
  }).join('');
}

function renderLifeWeeks() {
  const bdStr=localStorage.getItem('priv_birthdate');
  const bdForm=document.getElementById('life-bd-form');
  const content=document.getElementById('life-content');
  if (!bdForm||!content) return;
  if (!bdStr){ bdForm.style.display='flex'; content.style.display='none'; return; }
  bdForm.style.display='none'; content.style.display='block';

  const birth=new Date(bdStr), now=new Date();
  const TOTAL=85*52;
  const weeksLived=Math.floor((now-birth)/(7*24*60*60*1000));
  const weeksLeft=Math.max(0,TOTAL-weeksLived);
  const currentWk=Math.min(weeksLived,TOTAL-1);
  const pct=Math.min(100,weeksLived/TOTAL*100).toFixed(1);
  const age=Math.floor((now-birth)/(365.25*24*60*60*1000));

  const heroWk   = document.getElementById('life-hero-week');
  const heroTt   = document.getElementById('life-hero-total');
  const heroMeta = document.getElementById('life-hero-meta');
  const progFill = document.getElementById('life-progress-fill');
  if (heroWk)   heroWk.textContent   = weeksLived.toLocaleString('de-DE');
  if (heroTt)   heroTt.innerHTML     = weeksLeft.toLocaleString('de-DE') + ' von 4.420 verbleiben';
  if (heroMeta) heroMeta.textContent = age + ' Jahre · ' + pct.replace('.',',') + '% des Lebens erlebt';
  if (progFill) setTimeout(()=>{ progFill.style.width=pct+'%'; }, 80);

  const gridEl=document.getElementById('life-grid');
  if (gridEl){
    let html='';
    for (let i=0;i<TOTAL;i++){
      html+='<div class="life-cell'+(i===currentWk?' current':i<weeksLived?' lived':'')+'"></div>';
    }
    gridEl.innerHTML=html;
  }
}

function itaLogToday() { itaLogDay(privDateKey(new Date())); }

function renderItaHeatmap() {
  const container=document.getElementById('ita-heatmap');
  if (!container) return;
  const data=itaLoad();
  const today=new Date(); today.setHours(0,0,0,0);
  const todayStr=privDateKey(today);

  // Fixed range: April 1 → July 31 of current year
  const yr=today.getFullYear();
  const rangeStart=new Date(yr,3,1);  // April 1
  const rangeEnd  =new Date(yr,6,31); // July 31

  // Align to Monday on/before April 1
  const d0=rangeStart.getDay(); // 0=Sun
  const startDate=new Date(rangeStart);
  startDate.setDate(rangeStart.getDate()-(d0===0?6:d0-1));

  const columns=[], monthBreaks=[];
  let cur=new Date(startDate), prevMonth=-1, wIdx=0;

  while(cur<=rangeEnd){
    const cells=[], colMonth=cur.getMonth();
    if(colMonth!==prevMonth){ monthBreaks.push({w:wIdx,label:MONTHS[colMonth].substring(0,3)}); prevMonth=colMonth; }
    for(let day=0;day<7;day++){
      const k=privDateKey(cur);
      const inRange=cur>=rangeStart&&cur<=rangeEnd;
      const isFuture=cur>today;
      const isToday=k===todayStr;
      cells.push({k,isFuture,isToday,inRange,
        color:(!inRange||isFuture)?'transparent':itaMinsToColor(data[k]||0),
        mins:data[k]||0});
      cur.setDate(cur.getDate()+1);
    }
    columns.push(cells); wIdx++;
  }

  let monthRow='<div class="ita-month-labels">';
  let lastLblW=-6;
  columns.forEach((_,w)=>{
    const mb=monthBreaks.find(m=>m.w===w);
    if(mb&&w-lastLblW>=3){ monthRow+='<div class="ita-month-span" style="width:22px;min-width:22px;">'+mb.label+'</div>'; lastLblW=w; }
    else{ monthRow+='<div style="width:22px;min-width:22px;"></div>'; }
  });
  monthRow+='</div>';

  let gridHtml='<div class="ita-grid">';
  columns.forEach(cells=>{
    gridHtml+='<div class="ita-col">';
    cells.forEach(c=>{
      if(!c.inRange||c.isFuture)
        gridHtml+='<div class="ita-cell" style="background:transparent;cursor:default;pointer-events:none;"></div>';
      else
        gridHtml+='<div class="ita-cell'+(c.isToday?' ita-today':'')+'" style="background:'+c.color+'" title="'+c.k+': '+c.mins+' Min" onclick="itaLogDay(\''+c.k+'\')"></div>';
    });
    gridHtml+='</div>';
  });
  gridHtml+='</div>';

  container.innerHTML=monthRow+gridHtml;

  // ── Stats ─────────────────────────────────────────────
  // Streak (consecutive days with >0 min, walking back from today/yesterday)
  let streak=0, sd=new Date(today);
  if (!data[privDateKey(sd)]) sd.setDate(sd.getDate()-1);
  while (data[privDateKey(sd)]>0) { streak++; sd.setDate(sd.getDate()-1); }

  // This week (Mon-Sun including today)
  const wd=today.getDay(), monOffset=wd===0?-6:1-wd;
  const weekStart=new Date(today); weekStart.setDate(today.getDate()+monOffset);
  let weekMin=0;
  for (let i=0;i<7;i++){
    const d=new Date(weekStart); d.setDate(weekStart.getDate()+i);
    weekMin+=data[privDateKey(d)]||0;
  }

  // Total
  const totalMin=Object.values(data).reduce((a,b)=>a+(b||0),0);
  const totalH=totalMin>=60 ? (totalMin/60).toFixed(1)+'h' : totalMin+'m';

  const sEl=document.getElementById('ita-stat-streak');
  const wEl=document.getElementById('ita-stat-week');
  const tEl=document.getElementById('ita-stat-total');
  if (sEl) sEl.textContent = streak + ' ' + (streak===1?'Tag':'Tage');
  if (wEl) wEl.textContent = weekMin + ' min';
  if (tEl) tEl.textContent = totalMin >= 60 ? (totalMin/60).toFixed(1).replace('.',',')+' h' : totalMin+' min';
}
</script>
