<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard · Simon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:             #F2F2F7;
    --card:           #FFFFFF;
    --card-inner:     #F2F2F7;
    --text-primary:   #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary:  #C7C7CC;
    --border:         rgba(0,0,0,0.06);
    --shadow:         0 2px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
    --radius:         18px;
    --radius-sm:      13px;
    --accent-purple:  #5E5CE6;
    --accent-green:   #30D158;
    --accent-orange:  #FF9F0A;
    --accent-blue:    #0A84FF;
    --accent-red:     #FF453A;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Haupt-Grid ── */
  .screen {
    width: 100vw;
    height: 100dvh;
    padding: 20px;
    display: grid;
    grid-template-rows: 96px 1fr 90px;
    gap: 12px;
    overflow: hidden;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* ─────────────────────────────────────
     ROW 1: Zeit + Wetter
  ───────────────────────────────────── */
  .row-top {
    display: grid;
    grid-template-columns: 1fr 148px;
    gap: 12px;
  }

  .card-time {
    padding: 16px 22px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .time-display {
    font-size: clamp(46px, 7vw, 66px);
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -2.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-date {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 5px;
    letter-spacing: -0.2px;
  }

  .card-weather {
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 2px;
  }

  .weather-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }
  .weather-temp  { font-size: 36px; font-weight: 200; color: var(--text-primary); letter-spacing: -1.5px; line-height: 1; }
  .weather-desc  { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .weather-feel  { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .weather-city  { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  /* ─────────────────────────────────────
     ROW 2: Kalender + Pipeline
  ───────────────────────────────────── */
  .row-middle {
    display: grid;
    grid-template-columns: 1fr 298px;
    gap: 12px;
    min-height: 0;
  }

  /* Section-Header (wiederverwendbar) */
  .section-header {
    padding: 11px 16px 9px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }

  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .section-badge {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  /* Kalender */
  .card-calendar {
    display: flex;
    flex-direction: column;
  }

  .calendar-iframe-wrap {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .calendar-iframe-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Pipeline */
  .card-pipeline {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .pipeline-list {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 0;
    overflow: hidden;
  }

  .pipeline-item {
    background: var(--card-inner);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-height: 0;
  }

  .pipeline-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .pipeline-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .pipeline-date {
    font-size: 11px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .pipeline-status {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pipeline-action {
    font-size: 11.5px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .pipeline-amount {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent-purple);
    margin-top: 3px;
  }

  /* Fehler / leer Zustand */
  .state-msg {
    padding: 16px;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }

  /* ─────────────────────────────────────
     ROW 3: Fokus + Cashflow
  ───────────────────────────────────── */
  .row-bottom {
    display: grid;
    grid-template-columns: 1fr 210px;
    gap: 12px;
  }

  .card-fokus {
    padding: 12px 20px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .fokus-text {
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-cashflow {
    padding: 12px 18px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }

  .cashflow-row {
    display: flex;
    align-items: baseline;
    gap: 3px;
    margin-top: 2px;
  }

  .cashflow-value {
    font-size: 26px;
    font-weight: 200;
    color: var(--text-primary);
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .cashflow-sep {
    font-size: 16px;
    font-weight: 200;
    color: var(--text-tertiary);
  }

  .cashflow-goal {
    font-size: 16px;
    font-weight: 300;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .cashflow-sub {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .cashflow-bar-wrap {
    height: 3px;
    background: var(--card-inner);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }

  .cashflow-bar-fill {
    height: 100%;
    background: var(--accent-green);
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
  }

  /* ── Morning Report Button ── */
  .morning-btn {
    align-self: center;
    flex-shrink: 0;
    background: var(--accent-purple);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 15px;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.12s;
    white-space: nowrap;
  }
  .morning-btn:active   { transform: scale(0.96); }
  .morning-btn:disabled { opacity: 0.5; cursor: default; }
  .morning-btn.speaking { background: var(--accent-red); }
  .morning-btn svg      { flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.85s linear infinite; }

  /* ─────────────────────────────────────
     Skeleton / Loading
  ───────────────────────────────────── */
  .skel {
    display: block;
    background: linear-gradient(90deg, #ebebf0 25%, #e2e2e8 50%, #ebebf0 75%);
    background-size: 300% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
    border-radius: 5px;
  }

  @keyframes shimmer {
    0%   { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  .weather-skel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 4px;
  }

  /* ─────────────────────────────────────
     Animationen
  ───────────────────────────────────── */
  .fade-in {
    animation: fadeIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="screen">

  <!-- ── ROW 1: Zeit + Wetter ── -->
  <div class="row-top">

    <div class="card card-time">
      <div>
        <div class="time-display" id="clock">00:00</div>
        <div class="time-date"    id="datestr">Laden…</div>
      </div>
      <button class="morning-btn" id="morning-btn" onclick="startMorningReport()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/>
          <line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/>
          <line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
          <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/>
          <line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/>

        Morning Report

        <div>
          <span class="skel" style="width:80px;height:12px;margin-bottom:4px;"></span>
          <span class="skel" style="width:52px;height:11px;margin-bottom:2px;"></span>
          <span class="skel" style="width:44px;height:11px;"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- ── ROW 2: Kalender + Pipeline ── -->
  <div class="row-middle">

    <div class="card card-calendar">
      <div class="section-header">
        <span class="section-label">Kalender</span>
        <span class="section-badge" id="cal-date"></span>
      </div>
      <div class="calendar-iframe-wrap">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=simon-raphael.moser%40web.de&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showNav=1&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%23FFFFFF&color=%235E5CE6"
          scrolling="no"
          allowtransparency="true">
        </iframe>

    <div class="card card-pipeline">
      <div class="section-header">

        <div class="pipeline-item">

        <div class="pipeline-item">
          <span class="skel" style="width:58%;height:13px;"></span>

  <!-- ── ROW 3: Fokus + Cashflow ── -->

<script>
'use strict';

// ── Konstanten ────────────────────────────────────────────────
const WEATHER_KEY = '1f71b21255f6c1acd98a8f8406770053';
const WEATHER_CITY = 'Laubach,DE';

// Echte Table-Block-IDs (aus /api/notion?debug= ermittelt)
const TABLE = {
  pipeline: '9971f418-7f5f-4989-b815-c971bb65215a',
  fokus:    'e7ca1761-15c1-4791-84af-1c3320cec475',
  cashflow: 'ffae9691-2a24-4c15-87c1-41cda34db9fd',
};

const DAYS   = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const WEATHER_ICONS = {
  '01d':'☀️','01n':'🌙','02d':'⛅️','02n':'⛅️',
  '03d':'☁️','03n':'☁️','04d':'☁️','04n':'☁️',
  '09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧',
  '11d':'⛈','11n':'⛈','13d':'❄️','13n':'❄️',
  '50d':'🌫','50n':'🌫',
};

const WEATHER_DE = {
  'clear sky':'Klarer Himmel','few clouds':'Leicht bewölkt',
  'scattered clouds':'Bewölkt','broken clouds':'Stark bewölkt',
  'overcast clouds':'Bedeckt','light rain':'Leichter Regen',
  'moderate rain':'Regen','heavy intensity rain':'Starker Regen',
  'very heavy rain':'Starker Regen','extreme rain':'Starker Regen',
  'light snow':'Leichter Schnee','snow':'Schnee','heavy snow':'Starker Schnee',
  'mist':'Nebel','fog':'Nebel','haze':'Dunst',
  'thunderstorm':'Gewitter','drizzle':'Nieselregen',
  'light intensity drizzle':'Nieselregen','shower rain':'Schauer',
  'light intensity shower rain':'Leichter Schauer',
};

// ── Hilfsfunktionen ───────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n, unit) {
  if (n === null || n === undefined || isNaN(Number(n))) return '—';
  const formatted = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 }).format(Number(n));
  return unit ? formatted + '\u202F' + unit : formatted;
}

// ── Notion Blocks API ────────────────────────────────────────
// Liest eine einfache Notion-Tabelle (type: "table") per Blocks API
async function notionGetBlocks(blockId) {
  const res = await fetch(`/api/notion?endpoint=blocks/${blockId}/children&page_size=50`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// Parst Notion table_row Blöcke → Array von Objekten
// Erste Zeile wird als Header-Zeile behandelt
function parseNotionTable(data) {
  const rows = (data.results || []).filter(b => b.type === 'table_row');
  if (rows.length < 2) return [];
  const cellText = cells => (cells || []).map(t => t.plain_text || t.text?.content || '').join('').trim();
  const headers  = rows[0].table_row.cells.map(cellText);
  return rows.slice(1).map(row => {
    const obj = {};
    row.table_row.cells.forEach((cell, i) => { if (headers[i]) obj[headers[i]] = cellText(cell); });
    return obj;
  });
}

// Zahl aus deutschem Format: "1.000,50" → 1000.5, "1000" → 1000
function parseNum(s) {
  if (typeof s === 'number') return s;
  if (!s) return 0;
  const str = String(s).trim();
  // Deutsches Format: Punkt = Tausender, Komma = Dezimal
  if (/\d\.\d{3}/.test(str)) return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
  // Englisches Format oder plain
  return parseFloat(str.replace(',', '.').replace(/[^0-9.-]/g, '')) || 0;
}

// ── Uhrzeit ──────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent   = h + ':' + m;
  document.getElementById('datestr').textContent =
    DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  document.getElementById('cal-date').textContent =
    now.getDate() + '. ' + MONTHS[now.getMonth()];
}
updateClock();
setInterval(updateClock, 10_000);

// ── Wetter ───────────────────────────────────────────────────
async function fetchWeather() {
  try {
    const res  = await fetch(
      `https://api.openweathermap.org/data/2.5/weather?q=${WEATHER_CITY}&appid=${WEATHER_KEY}&units=metric&lang=de`
    );
    const d    = await res.json();
    if (d.cod !== 200) throw new Error('API error');

    const temp  = Math.round(d.main.temp);
    const feels = Math.round(d.main.feels_like);
    const icon  = WEATHER_ICONS[d.weather[0].icon] || '🌤';
    const desc  = WEATHER_DE[d.weather[0].description.toLowerCase()] || d.weather[0].description;

    document.getElementById('weather-card').innerHTML = `
      <div class="fade-in" style="display:flex;flex-direction:column;justify-content:space-between;height:100%;">
        <div>
          <div class="weather-icon">${icon}</div>
          <div class="weather-temp">${temp}°</div>
        </div>
        <div>
          <div class="weather-desc">${esc(desc)}</div>
          <div class="weather-feel">Fühlt: ${feels}°</div>
          <div class="weather-city">Laubach</div>
        </div>
      </div>`;
  } catch {
    document.getElementById('weather-card').innerHTML = `
      <div style="display:flex;flex-direction:column;justify-content:center;height:100%;gap:5px;">
        <div style="font-size:20px;">🌤</div>
        <div style="font-size:11px;color:var(--text-tertiary);">Nicht<br>verfügbar</div>
      </div>`;
  }
}
fetchWeather();
setInterval(fetchWeather, 10 * 60_000);

// ── Pipeline ─────────────────────────────────────────────────
async function loadPipeline() {
  try {
    const data  = await notionGetBlocks(TABLE.pipeline);
    const rows  = parseNotionTable(data);

    document.getElementById('pipeline-badge').textContent =
      rows.length ? rows.length + (rows.length === 1 ? ' Lead' : ' Leads') : '';

    if (!rows.length) {
      document.getElementById('pipeline-list').innerHTML =
        '<div class="state-msg">Keine Einträge in der Pipeline</div>';
      return;
    }

    document.getElementById('pipeline-list').innerHTML = rows.map(row => {
      const name   = row['Name']   || row['Titel']         || 'Unbenannt';
      const status = row['Status'] || '';
      const action = row['Nächste Aktion'] || row['Aktion'] || '';
      const date   = row['Datum']  || row['Date']           || '';
      const amount = row['Betrag'] || row['Amount']         || '';
      return `
        <div class="pipeline-item fade-in">
          <div class="pipeline-row">
            <span class="pipeline-name">${esc(name)}</span>
            ${date ? `<span class="pipeline-date">${esc(date)}</span>` : ''}
          </div>
          ${status ? `<div class="pipeline-status">${esc(status)}</div>` : ''}
          ${action ? `<div class="pipeline-action">${esc(action)}</div>` : ''}
          ${amount ? `<div class="pipeline-amount">${esc(amount)}</div>` : ''}
        </div>`;
    }).join('');

  } catch (err) {
    console.error('Pipeline:', err);
    document.getElementById('pipeline-list').innerHTML =
      '<div class="state-msg">Nicht verfügbar</div>';
  }
}

// ── Fokus heute ───────────────────────────────────────────────
async function loadFokus() {
  try {
    const data = await notionGetBlocks(TABLE.fokus);
    const rows = parseNotionTable(data);

    if (!rows.length) {
      document.getElementById('fokus-text').textContent = 'Kein Fokus eingetragen.';
      return;
    }

    // Neueste Zeile (letzte Zeile = aktuellster Eintrag bei chronologischer Reihenfolge)
    const entry = rows[rows.length - 1];
    // Ersten nicht-leeren Wert nehmen der nicht "Datum" heißt
    const text = entry['Fokus'] || entry['Fokus-Satz'] || entry['Text'] || entry['Satz']
      || Object.entries(entry).find(([k, v]) => v && !k.toLowerCase().includes('datum'))?.[1]
      || '—';
    document.getElementById('fokus-text').innerHTML =
      `<span class="fade-in">${esc(text)}</span>`;

  } catch (err) {
    console.error('Fokus:', err);
    document.getElementById('fokus-text').textContent = 'Nicht verfügbar';
  }
}

// ── Cashflow ──────────────────────────────────────────────────
async function loadCashflow() {
  try {
    const now  = new Date();
    const data = await notionGetBlocks(TABLE.cashflow);
    const rows = parseNotionTable(data);

    if (!rows.length) {
      document.getElementById('cashflow-inner').innerHTML =
        '<div class="state-msg" style="padding:0;margin-top:4px;">Keine Daten</div>';
      return;
    }

    // Aktuellen Monat suchen, sonst letzte Zeile
    const curMonthName = MONTHS[now.getMonth()].toLowerCase();
    const curMonthNum  = String(now.getMonth() + 1).padStart(2, '0');
    let entry = rows.find(r => {
      const m = String(r['Monat'] || r['Month'] || r['Name'] || '').toLowerCase();
      return m.includes(curMonthName) || m.includes(curMonthNum);
    }) || rows[rows.length - 1];

    const einnahmen = parseNum(entry['Einnahmen'] || entry['Revenue'] || 0);
    const ziel      = parseNum(entry['Ziel']      || entry['Goal']    || 0);
    const offen     = entry['Offene Rechnungen']  || entry['Offen']   || null;
    const pct       = ziel > 0 ? Math.min(Math.round((einnahmen / ziel) * 100), 100) : 0;

    document.getElementById('cashflow-inner').innerHTML = `
      <div class="fade-in">
        <div class="cashflow-row">
          <span class="cashflow-value">${fmtNum(einnahmen)}</span>
          <span class="cashflow-sep"> / </span>
          <span class="cashflow-goal">${fmtNum(ziel)} €</span>
        </div>
        <div class="cashflow-bar-wrap">
          <div class="cashflow-bar-fill" style="width:${pct}%;"></div>
        </div>
        <div class="cashflow-sub" style="margin-top:4px;">
          ${pct} % des Ziels${offen ? ' · ' + esc(offen) + ' € offen' : ''}
        </div>
      </div>`;

  } catch (err) {
    console.error('Cashflow:', err);
    document.getElementById('cashflow-inner').innerHTML =
      '<div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">Nicht verfügbar</div>';
  }
}

  loadPipeline();

const GOOGLE_TTS_KEY = 'AIzaSyB0q3cr74a8xoG9PZkz4Qjs8KjewbSMNKE';

const SVG_SUN  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="16.95" y2="7.05"/><line x1="7.05" y1="16.95" x2="4.93" y2="19.07"/></svg>`;
const SVG_SPIN = `<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>`;

let currentAudio = null;

function collectDashboardData() {
  const pipelineItems = Array.from(document.querySelectorAll('.pipeline-item'))
    .map(el => el.innerText.replace(/\n+/g, ' · ').trim())
    .filter(Boolean);
  return {
    time:     document.getElementById('clock')?.textContent?.trim() || '',
    date:     document.getElementById('datestr')?.textContent?.trim() || '',
    weather:  document.getElementById('weather-card')?.innerText?.trim() || '',
    fokus:    document.getElementById('fokus-text')?.innerText?.trim() || '',
    pipeline: pipelineItems,
    cashflow: document.getElementById('cashflow-inner')?.innerText?.replace(/\n+/g, ' ').trim() || '',
  };
}

function buildMorningText(d) {
  const now      = new Date();
  const hour     = now.getHours();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);

  const wochentag  = d.date.split(',')[0]?.trim() || 'Heute';
  const datumKurz  = d.date.split(', ').slice(1).join(', ').replace(/\s+\d{4}$/, '') || d.date;
  const greet      = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Hallo' : 'Guten Abend';
  const morgenTag  = DAYS[tomorrow.getDay()];

  const parts = [];

  // 1. Begrüßung
  parts.push(`${greet}, Simon! Es ist ${d.time} Uhr, ${wochentag} der ${datumKurz}.`);

  // 2. Wetter — Zeilen bereinigen, Emoji-Zeilen rausfiltern
  const wLines = d.weather.split('\n')
    .map(s => s.trim())
    .filter(s => s && s.length > 1 && !/^\p{Emoji_Presentation}$/u.test(s));
  const wTemp  = wLines.find(s => /^\d+°$/.test(s) || s.match(/^\d+°$/));
  const wDesc  = wLines.find(s => !/\d/.test(s) && !s.includes('Laubach') && !s.includes('Fühlt') && s.length > 3);
  const wFeels = wLines.find(s => s.includes('Fühlt'));
  if (wDesc || wTemp) {
    let w = 'Draußen in Laubach';
    if (wTemp) w += ` sind es ${wTemp}`;
    if (wDesc) w += `, ${wDesc.toLowerCase()}`;
    if (wFeels) w += `, ${wFeels.toLowerCase().replace('fühlt:', 'gefühlt').replace('fühlt: ', 'gefühlt ')}`;
    parts.push(w + '.');
  }

  // 3. Fokus
  const fokus = d.fokus.replace(/\n.*/s, '').trim();
  const fokusLeer = !fokus || ['—', 'Kein Fokus', 'Nicht verfügbar', 'Kein Fokus eingetragen'].some(s => fokus.includes(s));
  if (!fokusLeer) {
    parts.push(`Dein Fokus für heute: ${fokus}.`);
  } else {
    parts.push('Für heute ist noch kein Fokus eingetragen.');
  }

  // 4. Pipeline
  const leads = d.pipeline.filter(l => !l.includes('Nicht verfügbar'));
  if (leads.length) {
    const firstName = leads[0].split(' · ')[0].trim();
    if (leads.length === 1) {
      parts.push(`In deiner Pipeline läuft gerade ein aktiver Lead: ${firstName}.`);
    } else {
      const others = leads.slice(1).map(l => l.split(' · ')[0].trim());
      const list   = others.length === 1
        ? `${firstName} und ${others[0]}`
        : `${firstName}, ${others.slice(0, -1).join(', ')} und ${others.at(-1)}`;
      parts.push(`Du hast ${leads.length} aktive Leads in der Pipeline: ${list}.`);
    }
  }

  // 5. Cashflow
  const cfClean = d.cashflow.replace(/\s+/g, ' ').trim();
  const cfLeer  = !cfClean || ['Keine Daten', 'Nicht verfügbar'].some(s => cfClean.includes(s));
  if (!cfLeer) {
    // Nur Zahlen extrahieren: "400 / 1.000 € 40 % des Ziels" → lesbar machen
    const match = cfClean.match(/([\d.,]+)\s*\/\s*([\d.,]+)\s*€/);
    if (match) {
      parts.push(`Beim Cashflow stehst du diesen Monat bei ${match[1]} von ${match[2]} Euro Ziel.`);
    } else {
      parts.push(`Zum Cashflow: ${cfClean.split('\n')[0]}.`);
    }
  }

  // 6. Abschluss
  const closings = [
    `Morgen ist ${morgenTag} — noch ist heute, pack es an!`,
    `Einen produktiven ${wochentag} dir, mach was draus!`,
    `Morgen erwartet dich schon der ${morgenTag}, also nutze den heutigen Tag.`,
  ];
  parts.push(closings[now.getMinutes() % closings.length]);

  return parts.join(' ');
}

function setBtn(state) {
  const btn = document.getElementById('morning-btn');
  btn.classList.remove('speaking');
  switch (state) {
    case 'idle':
      btn.disabled = false;
      btn.innerHTML = SVG_SUN + ' Morning Report';
      btn.onclick = startMorningReport;
      break;
    case 'loading':
      btn.disabled = true;
      btn.innerHTML = SVG_SPIN + ' Lädt…';
      break;
    case 'speaking':
      btn.classList.add('speaking');
      btn.disabled = false;
      btn.innerHTML = SVG_STOP + ' Stop';
      btn.onclick = () => {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
        setBtn('idle');
      };
      break;
  }
}

async function startMorningReport() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  setBtn('loading');

  const text = buildMorningText(collectDashboardData());

  try {
    const res = await fetch(
      `https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_TTS_KEY}`,
      {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input:       { text },
          voice:       { languageCode: 'de-DE', name: 'de-DE-Wavenet-F' },
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.95, pitch: 0 },
        }),
      }
    );

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const { audioContent } = await res.json();
    if (!audioContent) throw new Error('Keine Audio-Daten erhalten');

    currentAudio = new Audio('data:audio/mpeg;base64,' + audioContent);
    currentAudio.onended = () => { currentAudio = null; setBtn('idle'); };
    currentAudio.onerror = () => { currentAudio = null; setBtn('idle'); };

    setBtn('speaking');
    await currentAudio.play();

  } catch (err) {
    console.error('TTS Fehler:', err);
    currentAudio = null;
    setBtn('idle');
    alert('Sprachausgabe fehlgeschlagen: ' + err.message);
  }
}
